<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Atmosphärischer Raum-Gradient -->
    <radialGradient id="bgGaze" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Magischer Lichtschein im Zentrum -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dunkler Hintergrund -->
  <rect width="1920" height="1080" fill="url(#bgGaze)" />

  <!-- Mystischer Lichtschein im Zentrum -->
  <circle cx="960" cy="500" r="550" fill="url(#goldGlow)" />

  <!-- Magisches Runen-Siegel -->
  <g transform="translate(960, 500)" stroke="#f59e0b" stroke-opacity="0.25" fill="none" stroke-width="2">
    <circle r="340" stroke-dasharray="8 6" />
    <circle r="300" stroke-width="1.5" />
    <circle r="220" />
    
    <!-- Stern-Geometrie -->
    <polygon points="0,-220 190.5,110 -190.5,110" />
    <polygon points="0,220 190.5,-110 -190.5,-110" />

    <circle r="120" stroke-dasharray="4 8" stroke-width="3" />
  </g>

  <!-- Schwebende magische Funken -->
  <g fill="#fde68a" opacity="0.4">
    <circle cx="560" cy="270" r="2.5" />
    <circle cx="640" cy="340" r="1.5" />
    <circle cx="820" cy="190" r="3" />
    <circle cx="1120" cy="230" r="2" />
    <circle cx="1280" cy="310" r="3.5" />
    <circle cx="1380" cy="210" r="1.5" />
    <circle cx="750" cy="740" r="2" />
    <circle cx="1180" cy="720" r="2.5" />
    <circle cx="450" cy="520" r="2" />
    <circle cx="1470" cy="480" r="2" />
  </g>
</svg>
