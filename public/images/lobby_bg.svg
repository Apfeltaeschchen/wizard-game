<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGaze" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Karten-Schlagschatten -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dunkler Hintergrund -->
  <rect width="1920" height="1080" fill="url(#bgGaze)" />

  <!-- Mystischer Lichtschein im Zentrum -->
  <circle cx="960" cy="500" r="550" fill="url(#goldGlow)" />

  <!-- Magisches Runen-Siegel (Zentrum) -->
  <g transform="translate(960, 500)" stroke="#f59e0b" stroke-opacity="0.25" fill="none" stroke-width="2">
    <circle r="340" stroke-dasharray="8 6" />
    <circle r="300" stroke-width="1.5" />
    <circle r="220" />
    
    <!-- Stern-Geometrie -->
    <polygon points="0,-220 190.5,110 -190.5,110" />
    <polygon points="0,220 190.5,-110 -190.5,-110" />

    <circle r="120" stroke-dasharray="4 8" stroke-width="3" />
  </g>

  <!-- Schwebende Zauberer-Karten im Hintergrund (Deko) -->
  <g filter="url(#cardShadow)">
    <!-- Karte links -->
    <g transform="translate(420, 480) rotate(-18)">
      <rect width="120" height="180" rx="10" fill="#2e1065" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" />
      <text x="60" y="105" fill="#f59e0b" font-size="44" text-anchor="middle" font-family="sans-serif" opacity="0.4">🧙</text>
    </g>

    <!-- Karte rechts -->
    <g transform="translate(1380, 500) rotate(16)">
      <rect width="120" height="180" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
      <text x="60" y="105" fill="#38bdf8" font-size="44" text-anchor="middle" font-family="sans-serif" opacity="0.4">🤡</text>
    </g>
  </g>

  <!-- Magische Funken & Sterne -->
  <g fill="#fde68a" opacity="0.4">
    <circle cx="580" cy="280" r="2.5" />
    <circle cx="640" cy="340" r="1.5" />
    <circle cx="820" cy="200" r="3" />
    <circle cx="1120" cy="240" r="2" />
    <circle cx="1280" cy="320" r="3.5" />
    <circle cx="1380" cy="220" r="1.5" />
    <circle cx="750" cy="740" r="2" />
    <circle cx="1180" cy="720" r="2.5" />
  </g>
</svg>
