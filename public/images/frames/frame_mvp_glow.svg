<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Höchster Zitadellen-Kaisergold Gradient -->
    <radialGradient id="archmageSovereignGold" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="95%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#3a2203"/>
    </radialGradient>

    <!-- Kaiserlicher Zenith-Rubin -->
    <radialGradient id="zenithCrownRuby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="75%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Gleißender Diamant-Glanz -->
    <radialGradient id="crownDiamondGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef9c3"/>
      <stop offset="80%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <filter id="mvpSovereignShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="3.0" flood-color="#eab308" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#mvpSovereignShadow)">
    <!-- 1. KAISERLICHER MEISTERREIF (r=35.5, Stärke 2.0px) & PERLMUTTKORDEL -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#archmageSovereignGold)" stroke-width="2"/>
    <circle cx="50" cy="50" r="37.4" stroke="#fde047" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- 2. FLANKEN: BAROCKE GOLD-VOLUTEN & LORBEER-MÄANDER (vgl. User-Referenz 4) -->
    <!-- Gold-Volute Links (außerhalb r=35.5) -->
    <g fill="url(#archmageSovereignGold)" stroke="#713f12" stroke-width="0.3">
      <!-- Ausladende Volutenschwinge oben-links -->
      <path d="M26,24 C16,18 10,26 8,36 C13,38 15,44 11,50 C16,52 18,58 16,66 C22,63 25,55 25,46 C25,36 21,28 26,24 Z"/>
      <!-- Goldene Lilien-Spitze bei 9 Uhr -->
      <polygon points="6,50 11,46 11,54"/>
    </g>

    <!-- Gold-Volute Rechts -->
    <g fill="url(#archmageSovereignGold)" stroke="#713f12" stroke-width="0.3">
      <!-- Ausladende Volutenschwinge oben-rechts -->
      <path d="M74,24 C84,18 90,26 92,36 C87,38 85,44 89,50 C84,52 82,58 84,66 C78,63 75,55 75,46 C75,36 79,28 74,24 Z"/>
      <!-- Goldene Lilien-Spitze bei 3 Uhr -->
      <polygon points="94,50 89,46 89,54"/>
    </g>

    <!-- 3. BASIS (6 Uhr): GRAVIERTES MVP-SIEGELSCHILD MIT RUBIN (y=82 bis 95) -->
    <path d="M42,86 L58,86 L55,94 L50,96 L45,94 Z" fill="url(#archmageSovereignGold)" stroke="#713f12" stroke-width="0.5"/>
    <!-- Zentraler Königs-Rubin auf dem Siegelschild -->
    <circle cx="50" cy="89.5" r="2.2" fill="url(#zenithCrownRuby)" stroke="#713f12" stroke-width="0.3"/>
    <circle cx="50" cy="89.5" r="0.7" fill="#ffffff"/>

    <!-- 4. APEX (12 Uhr): MONUMENTALE FÜNFZACKIGE HOCHMAGIER-KRONE (y=2 bis 16) -->
    <g transform="translate(50, 9)">
      <!-- Kronenreif-Basis -->
      <path d="M-9,6 C-3,4 3,4 9,6 L8,7 C3,5 -3,5 -8,7 Z" fill="#713f12"/>
      
      <!-- Fünfzackige Kronenzinnen (Mittlere Zinne reicht bis y=2, d.h. rel. -7) -->
      <polygon points="-8,6 -8,0 -6,3 -3,-3 0,4 0,-7 0,4 3,-3 6,3 8,0 8,6"
        fill="url(#archmageSovereignGold)" stroke="#713f12" stroke-width="0.4"/>

      <!-- Kronjuwelen auf den 5 Zinnenspitzen -->
      <circle cx="-8" cy="0" r="0.8" fill="#ffffff"/>
      <circle cx="-3" cy="-3" r="0.9" fill="#ffffff"/>
      <circle cx="0" cy="-7" r="1.3" fill="url(#crownDiamondGlow)" stroke="#713f12" stroke-width="0.3"/>
      <circle cx="3" cy="-3" r="0.9" fill="#ffffff"/>
      <circle cx="8" cy="0" r="0.8" fill="#ffffff"/>

      <!-- Zentraler Zenith-Rubin im Kronenkörper -->
      <polygon points="0,0 2,3 0,5 -2,3" fill="url(#zenithCrownRuby)" stroke="#713f12" stroke-width="0.3"/>
      <circle cx="0" cy="2.5" r="0.5" fill="#ffffff"/>
    </g>

    <!-- 5. HYBRID-ANIMATION (6.0s Zyklus) -->
    <!-- A) Dauer-Mikro: Majestätisches Pulsieren der goldenen Meister-Aura -->
    <circle cx="50" cy="9" r="4.5" fill="#fde047" opacity="0.25">
      <animate attributeName="opacity" values="0.25; 0.65; 0.3; 0.7; 0.25" dur="6.0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.2; 5.5; 4.5; 5.2; 4.2" dur="6.0s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 6s): Gleißender Diamant-Sternblitz & Ringschockwelle -->
    <!-- Diamantblitz an der Kronenspitze -->
    <g transform="translate(50, 2)">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 0.2; 0.95; 0; 0"
          keyTimes="0; 0.44; 0.49; 0.54; 0.59; 0.66; 1" dur="6.0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
          values="0.4; 0.4; 1.5; 0.8; 1.4; 0.4; 0.4"
          keyTimes="0; 0.44; 0.49; 0.54; 0.59; 0.66; 1" dur="6.0s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Goldene Schockwelle um das Medaillon -->
    <circle cx="50" cy="50" r="35.5" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0">
      <animate attributeName="r" values="35.5; 35.5; 42; 47; 35.5"
        keyTimes="0; 0.46; 0.54; 0.64; 1" dur="6.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 0.9; 0.2; 0"
        keyTimes="0; 0.46; 0.50; 0.64; 1" dur="6.0s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
