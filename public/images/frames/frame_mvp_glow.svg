<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Imperiales Großmeister-Gold & Juwelen -->
    <radialGradient id="royalGoldFine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="royalAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#fbbf24" flood-opacity="0.85"/>
    </filter>
  </defs>

  <g filter="url(#royalAura)">
    <!-- 1. Schlanker Goldreif (r=35.5, stroke 1.5px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#royalGoldFine)" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="37.2" stroke="#b45309" stroke-width="0.8"/>

    <!-- 2. WEIT NACH AUSSEN AUFRAGENDE MEISTERMAGIER-KRONE & PHÖNIXSCHWINGEN (r=37 bis r=49) -->
    <!-- Krone Oben (12 Uhr) thront weit nach außen bis y=6 -->
    <!-- 5 Kronenzacken -->
    <path d="M35,28 L35,18 L42,23 L50,6 L58,23 L65,18 L65,28 Q50,32 35,28 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="50" cy="6" r="1.5" fill="#ffffff"/>
    <circle cx="35" cy="18" r="1.1" fill="#ffffff"/>
    <circle cx="65" cy="18" r="1.1" fill="#ffffff"/>
    <ellipse cx="50" cy="22" rx="2.2" ry="2.8" fill="#ef4444" stroke="#fef08a" stroke-width="0.5"/>

    <!-- Phönixfedern Flanke Rechts nach außen bis x=88 -->
    <path d="M68,36 Q80,26 88,20 Q80,32 74,40 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.4"/>
    <path d="M72,48 Q82,44 88,50 Q80,56 72,52 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.4"/>
    <path d="M68,64 Q80,72 88,78 Q80,68 74,60 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.4"/>

    <!-- Unten (6 Uhr): Wappensporn nach außen bis y=88 -->
    <path d="M47,65 Q45,78 50,88 Q55,78 53,65 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.4"/>
    <circle cx="50" cy="78" r="1.6" fill="#3b82f6" stroke="#fef08a" stroke-width="0.4"/>

    <!-- Phönixfedern Flanke Links nach außen bis x=12 -->
    <path d="M32,36 Q20,26 12,20 Q20,32 26,40 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.4"/>
    <path d="M28,48 Q18,44 12,50 Q20,56 28,52 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.4"/>
    <path d="M32,64 Q20,72 12,78 Q20,68 26,60 Z" fill="url(#royalGoldFine)" stroke="#78350f" stroke-width="0.4"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE ZIERKLAMMERN (Greifen nur 2.5px bis r=33) -->
    <polygon points="48.5,35.5 50,33 51.5,35.5" fill="#fef08a"/>
    <polygon points="64.5,48.5 67,50 64.5,51.5" fill="#fef08a"/>
    <polygon points="48.5,64.5 50,67 51.5,64.5" fill="#fef08a"/>
    <polygon points="35.5,48.5 33,50 35.5,51.5" fill="#fef08a"/>
  </g>
</svg>
