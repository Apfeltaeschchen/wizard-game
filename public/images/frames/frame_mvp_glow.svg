<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="royalRingFine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="royalCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#royalCalmShadow)">
    <!-- 1. Schlanker Goldreif (r=35.5, stroke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#royalRingFine)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#b45309" stroke-width="0.8"/>

    <!-- 2. PLASTISCHE PHÖNIXFEDERN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Schwingen nach außen bis r=42.0) -->
    <path d="M83,48 Q88,44 92,50 Q88,56 83,52 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.3"/>
    <path d="M47,83 Q45,88 50,92 Q55,88 53,83 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="50" cy="85" r="1.4" fill="#3b82f6"/>
    <path d="M17,48 Q12,44 8,50 Q12,56 17,52 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.3"/>

    <!-- 3. 5-ZACKIGE MEISTERMAGIER-KRONE SITZT FREI OBEN AUF DEM REIF (y=6 bis y=14) -->
    <g transform="translate(50, 12)">
      <!-- Krone-Silhouette nach oben -->
      <path d="M-7,3 L-7,-1 L-3.5,0.5 L0,-5 L3.5,0.5 L7,-1 L7,3 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.4"/>
      <!-- Perlen auf Zacken -->
      <circle cx="0" cy="-5" r="0.9" fill="#ffffff"/>
      <circle cx="-7" cy="-1" r="0.7" fill="#ffffff"/>
      <circle cx="7" cy="-1" r="0.7" fill="#ffffff"/>
      <!-- Zentraler imperialer Rubin -->
      <ellipse cx="0" cy="1" rx="1.6" ry="1.8" fill="#ef4444" stroke="#fef08a" stroke-width="0.4"/>

      <!-- PERIODISCHER STERNENBLITZ AUF DEM ZENTRALEN RUBIN (alle 6s) -->
      <g>
        <path d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.5; 0.54; 0.58; 1" dur="6s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="scale" values="0.5; 0.5; 1.4; 0.5; 0.5" keyTimes="0; 0.5; 0.54; 0.58; 1" dur="6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
