<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="royalRingFine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="royalCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#royalCalmShadow)">
    <!-- 1. Schlanker Goldreif (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#royalRingFine)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#b45309" stroke-width="0.8"/>

    <!-- 2. ZARTE PHÖNIXFEDERN NUR AUSSEN (r=36 bis r=46) -->
    <path d="M66,48 Q78,44 86,50 Q78,56 66,52 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.3"/>
    <path d="M47,66 Q45,78 50,86 Q55,78 53,66 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="50" cy="78" r="1.4" fill="#3b82f6"/>
    <path d="M34,48 Q22,44 14,50 Q22,56 34,52 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.3"/>

    <!-- 3. 5-ZACKIGE MEISTERMAGIER-KRONE SITZT FREI OBEN AUF DEM REIF (y=4 bis y=14) -->
    <g transform="translate(50, 10)">
      <!-- Krone-Silhouette nach oben -->
      <path d="M-9,4 L-9,-2 L-4,1 L0,-8 L4,1 L9,-2 L9,4 Z" fill="url(#royalRingFine)" stroke="#78350f" stroke-width="0.4"/>
      <!-- Perlen auf Zacken -->
      <circle cx="0" cy="-8" r="1.1" fill="#ffffff"/>
      <circle cx="-9" cy="-2" r="0.8" fill="#ffffff"/>
      <circle cx="9" cy="-2" r="0.8" fill="#ffffff"/>
      <!-- Zentraler imperialer Rubin -->
      <ellipse cx="0" cy="0" rx="2" ry="2.4" fill="#ef4444" stroke="#fef08a" stroke-width="0.4"/>

      <!-- PERIODISCHER STERNENBLITZ AUF DEM ZENTRALEN RUBIN (alle 6s) -->
      <g>
        <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.5; 0.54; 0.58; 1" dur="6s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="scale" values="0.5; 0.5; 1.4; 0.5; 0.5" keyTimes="0; 0.5; 0.54; 0.58; 1" dur="6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
