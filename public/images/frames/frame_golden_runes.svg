<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Kosmisches Sonnen-Astrolabium Gold Gradient -->
    <radialGradient id="solarAstrolabeGold" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <radialGradient id="runeSealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <filter id="runeCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#runeCalmShadow)">
    <!-- 1. ASTROLABIUM-DOPPELRING MIT GRADUIERUNGEN (r=35.5 und r=37.5) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#solarAstrolabeGold)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.5" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="1 3"/>

    <!-- 2. VIER SONNENFLARE-SPITZEN AUF DEN HAUPTACHSEN (reichen bis r=45) -->
    <!-- Flare Oben (12 Uhr): Bis y=5 -->
    <polygon points="50,5 47,15 53,15" fill="url(#solarAstrolabeGold)" stroke="#78350f" stroke-width="0.3"/>
    <line x1="50" y1="5" x2="50" y2="15" stroke="#ffffff" stroke-width="0.4"/>

    <!-- Flare Rechts (3 Uhr): Bis x=95 -->
    <polygon points="95,50 85,47 85,53" fill="url(#solarAstrolabeGold)" stroke="#78350f" stroke-width="0.3"/>
    <line x1="95" y1="50" x2="85" y2="50" stroke="#ffffff" stroke-width="0.4"/>

    <!-- Flare Unten (6 Uhr): Bis y=95 -->
    <polygon points="50,95 47,85 53,85" fill="url(#solarAstrolabeGold)" stroke="#78350f" stroke-width="0.3"/>
    <line x1="50" y1="95" x2="50" y2="85" stroke="#ffffff" stroke-width="0.4"/>

    <!-- Flare Links (9 Uhr): Bis x=5 -->
    <polygon points="5,50 15,47 15,53" fill="url(#solarAstrolabeGold)" stroke="#78350f" stroke-width="0.3"/>
    <line x1="5" y1="50" x2="15" y2="50" stroke="#ffffff" stroke-width="0.4"/>

    <!-- 3. VIER ECHTE MAGISCHE RUNEN-SIEGEL (Algiz, Sowilo, Tiwaz, Ansuz) -->
    <!-- Algiz Oben (Schutz-Rune bei y=14) -->
    <g stroke="#ffffff" stroke-width="0.9" stroke-linecap="round">
      <path d="M50,11 L50,16 M47.5,13 L50,11 L52.5,13"/>
    </g>
    <!-- Sowilo Rechts (Sonnenkraft-Rune bei x=86) -->
    <g stroke="#ffffff" stroke-width="0.9" stroke-linecap="round">
      <path d="M87,47 L85,49 L87,51 L85,53"/>
    </g>
    <!-- Tiwaz Unten (Sieges-Rune bei y=86) -->
    <g stroke="#ffffff" stroke-width="0.9" stroke-linecap="round">
      <path d="M50,89 L50,84 M47.5,86 L50,89 L52.5,86"/>
    </g>
    <!-- Ansuz Links (Erkenntnis-Rune bei x=14) -->
    <g stroke="#ffffff" stroke-width="0.9" stroke-linecap="round">
      <path d="M13,47 L13,53 M13,48.5 L15.5,50 M13,50.5 L15.5,52"/>
    </g>

    <!-- 4. HYBRID-ANIMATION (7.0s Zyklus) -->
    <!-- A) Dauer-Mikro: Sanftes Atmen der 4 Runen-Siegel -->
    <circle cx="50" cy="13.5" r="2.5" fill="url(#runeSealGlow)" opacity="0.25">
      <animate attributeName="opacity" values="0.2; 0.6; 0.25; 0.65; 0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="50" r="2.5" fill="url(#runeSealGlow)" opacity="0.25">
      <animate attributeName="opacity" values="0.2; 0.6; 0.25; 0.65; 0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="86.5" r="2.5" fill="url(#runeSealGlow)" opacity="0.25">
      <animate attributeName="opacity" values="0.2; 0.6; 0.25; 0.65; 0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14" cy="50" r="2.5" fill="url(#runeSealGlow)" opacity="0.25">
      <animate attributeName="opacity" values="0.2; 0.6; 0.25; 0.65; 0.2" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 7s): Rotierende Sonnenflare-Welle im Uhrzeigersinn entfacht alle 4 Runen -->
    <!-- Umlaufender Sonnenblitz -->
    <circle cx="50" cy="50" r="35.5" stroke="#ffffff" stroke-width="2.2" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.3; 0.9; 0; 0"
        keyTimes="0; 0.40; 0.46; 0.52; 0.58; 0.64; 1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- Spitzen-Flash Algiz Oben -->
    <circle cx="50" cy="5" r="3" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 0; 0"
        keyTimes="0; 0.45; 0.48; 0.54; 1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
