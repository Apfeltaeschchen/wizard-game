<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="solarRuneRing" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="runeCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#runeCalmShadow)">
    <!-- 1. Schlanker Sonnenreif (r=35.5, Strich 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#solarRuneRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2 4"/>

    <!-- 2. PLASTISCHE SONNENFLARE-SPITZEN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Spitzen nach außen bis r=42.0) -->
    <!-- Sonnenstrahl Oben (12 Uhr): Startet bei r=33 (y=17) mit feiner Spitze nach y=8 -->
    <path d="M48,17 L50,8 L52,17 Z" fill="url(#solarRuneRing)" stroke="#78350f" stroke-width="0.4"/>
    <line x1="50" y1="17" x2="50" y2="9" stroke="#ffffff" stroke-width="0.4"/>

    <!-- Sonnenstrahl Rechts (3 Uhr): Startet bei r=33 (x=83) bis x=92 -->
    <path d="M83,48 L92,50 L83,52 Z" fill="url(#solarRuneRing)" stroke="#78350f" stroke-width="0.4"/>
    <!-- Sonnenstrahl Unten (6 Uhr): Startet bei r=33 (y=83) bis y=92 -->
    <path d="M48,83 L50,92 L52,83 Z" fill="url(#solarRuneRing)" stroke="#78350f" stroke-width="0.4"/>
    <!-- Sonnenstrahl Links (9 Uhr): Startet bei r=33 (x=17) bis x=8 -->
    <path d="M17,48 L8,50 L17,52 Z" fill="url(#solarRuneRing)" stroke="#78350f" stroke-width="0.4"/>

    <!-- 4 arkane Runen-Glyphen dezent auf dem Reif/Außenbereich -->
    <g stroke="#fef08a" stroke-width="0.8" stroke-linecap="round">
      <!-- Algiz oben -->
      <path d="M50,14 L50,18 M48,16 L50,14 L52,16"/>
      <!-- Sowilo rechts -->
      <path d="M86,48 L84,50 L86,52 L84,54"/>
      <!-- Tiwaz unten -->
      <path d="M50,86 L50,82 M48,84 L50,86 L52,84"/>
      <!-- Ansuz links -->
      <path d="M14,46 L14,54 M14,48 L16,50 M14,51 L16,53"/>
    </g>

    <!-- 3. PERIODISCHE RUNEN-ERLEUCHTUNG (alle 8s flammen die 4 Runen golden auf) -->
    <circle cx="50" cy="50" r="35.5" stroke="#fffbeb" stroke-width="2.2" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0; 0" keyTimes="0; 0.35; 0.4; 0.45; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
