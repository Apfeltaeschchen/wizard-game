<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Sonnengold & Runenlicht -->
    <radialGradient id="solarFine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <filter id="runeAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.75"/>
    </filter>
  </defs>

  <g filter="url(#runeAura)">
    <!-- 1. Schlanker Sonnenreif (r=35.5, stroke 1.5px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#solarFine)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="37.5" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2 4"/>

    <!-- 2. WEIT NACH AUSSEN STRAHLENDE SONNENLANZEN & RUNEN (r=37 bis r=49) -->
    <!-- Sonnenstrahl Oben (12 Uhr) nach außen bis y=10 -->
    <path d="M48,35 L50,10 L52,35 Z" fill="url(#solarFine)" stroke="#78350f" stroke-width="0.4"/>
    <line x1="50" y1="35" x2="50" y2="12" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Diagonale Sonnenstrahlen außen -->
    <path d="M68,32 L83,17 L72,28 Z" fill="url(#solarFine)"/>
    <path d="M72,48 L90,50 L72,52 Z" fill="url(#solarFine)"/>
    <path d="M68,68 L83,83 L72,72 Z" fill="url(#solarFine)"/>
    <path d="M48,65 L50,90 L52,65 Z" fill="url(#solarFine)"/>
    <path d="M32,68 L17,83 L28,72 Z" fill="url(#solarFine)"/>
    <path d="M28,48 L10,50 L28,52 Z" fill="url(#solarFine)"/>
    <path d="M32,32 L17,17 L28,28 Z" fill="url(#solarFine)"/>

    <!-- Schwebende Runen-Symbole im Außenraum (Algiz, Tiwaz, Sowilo, Ansuz) -->
    <path d="M50,18 L50,26 M47,21 L50,18 L53,21" stroke="#fef08a" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M78,50 L70,50 M75,47 L78,50 L75,53" stroke="#fef08a" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M50,82 L50,74 M47,79 L50,82 L53,79" stroke="#fef08a" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M22,50 L30,50 M25,47 L22,50 L25,53" stroke="#fef08a" stroke-width="0.9" stroke-linecap="round"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE RUNENPFEILE (Nur 2.5px bis r=33) -->
    <polygon points="48.5,35.5 50,32.8 51.5,35.5" fill="#fef08a"/>
    <polygon points="64.5,48.5 67.2,50 64.5,51.5" fill="#fef08a"/>
    <polygon points="48.5,64.5 50,67.2 51.5,64.5" fill="#fef08a"/>
    <polygon points="35.5,48.5 32.8,50 35.5,51.5" fill="#fef08a"/>
  </g>
</svg>
