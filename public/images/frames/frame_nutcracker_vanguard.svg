<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Karmesin-Samt & Goldkordel Gradienten -->
    <radialGradient id="nutcrackerRedRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#b91c1c"/>
      <stop offset="70%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <linearGradient id="goldCordGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="guardStarShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="nutcrackerShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.5" flood-color="#b91c1c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#nutcrackerShadow)">
    <!-- 1. Karmesinroter Samtreif (r=35.5, stroke 1.8px) & Goldene Husaren-Kordel -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#nutcrackerRedRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="url(#goldCordGrad)" stroke-width="0.8" stroke-dasharray="3 2"/>

    <!-- 2. Gestaffelte Gold-Epauletten & Samtbänder Flanke Links (maxR <= 43.8) -->
    <g stroke="url(#goldCordGrad)" stroke-linecap="round" fill="none">
      <!-- Äußerer Samt-Schwung -->
      <path d="M19,34 C14,30 11,36 9,42 C13,43 14,48 11,54 C14,56 17,61 19,67" stroke-width="1.3"/>
      <!-- Epauletten-Fransen -->
      <path d="M12,40 L8,42 M13,46 L9,48 M14,52 L10,54" stroke-width="0.8" stroke="#fef08a"/>
      <!-- Goldene Knöpfe -->
      <circle cx="13" cy="42" r="1.1" fill="url(#guardStarShine)" stroke="#78350f" stroke-width="0.3"/>
      <circle cx="14" cy="51" r="1.1" fill="url(#guardStarShine)" stroke="#78350f" stroke-width="0.3"/>
    </g>

    <!-- Gestaffelte Gold-Epauletten & Samtbänder Flanke Rechts (maxR <= 43.8) -->
    <g stroke="url(#goldCordGrad)" stroke-linecap="round" fill="none">
      <!-- Äußerer Samt-Schwung -->
      <path d="M81,34 C86,30 89,36 91,42 C87,43 86,48 89,54 C86,56 83,61 81,67" stroke-width="1.3"/>
      <!-- Epauletten-Fransen -->
      <path d="M88,40 L92,42 M87,46 L91,48 M86,52 L90,54" stroke-width="0.8" stroke="#fef08a"/>
      <!-- Goldene Knöpfe -->
      <circle cx="87" cy="42" r="1.1" fill="url(#guardStarShine)" stroke="#78350f" stroke-width="0.3"/>
      <circle cx="86" cy="51" r="1.1" fill="url(#guardStarShine)" stroke="#78350f" stroke-width="0.3"/>
    </g>

    <!-- 3. Unten: Gekreuzte Säbelspitzen & Wappenschild (y=83 bis y=91) -->
    <polygon points="50,91 46,83 54,83" fill="#450a0a" stroke="#fbbf24" stroke-width="0.6"/>
    <!-- Goldener Gardestern unten -->
    <polygon points="50,83 51,85 53,85.5 51.5,87 52,89 50,88 48,89 48.5,87 47,85.5 49,85" fill="url(#guardStarShine)" stroke="#78350f" stroke-width="0.2"/>

    <!-- 4. Oben: Imperialer Nussknacker-Tschako mit Gardestern (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Tschako-Haube (Karmesinrot mit Goldrand) -->
      <path d="M-4.5,4 L-4,-1 C-4,-3 4,-3 4,-1 L4.5,4 Z" fill="url(#nutcrackerRedRing)" stroke="#78350f" stroke-width="0.4"/>
      <!-- Goldene Stirnblende -->
      <path d="M-4.5,3.5 C-2,2.5 2,2.5 4.5,3.5" stroke="url(#goldCordGrad)" stroke-width="0.7"/>
      <!-- Weißer Federstutz links oben -->
      <path d="M-2.5,-1 C-3,-4 -1.5,-4.5 -1.5,-1 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.3"/>

      <!-- Imperialer Gardestern im Zentrum -->
      <polygon points="0,-1.5 0.8,0.2 2.5,0.5 1.2,1.8 1.6,3.5 0,2.6 -1.6,3.5 -1.2,1.8 -2.5,0.5 -0.8,0.2" fill="url(#guardStarShine)" stroke="#78350f" stroke-width="0.3"/>
      <circle cx="0" cy="1" r="0.6" fill="#ffffff"/>

      <!-- Periodischer Ehrensalut-Sternenblitz alle 6.5s -->
      <path d="M0,-2.5 L0.9,0.1 L3.5,1 L0.9,1.9 L0,4.5 L-0.9,1.9 L-3.5,1 L-0.9,0.1 Z" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 0.2; 0.9; 0; 0"
          keyTimes="0; 0.45; 0.50; 0.54; 0.58; 0.64; 1" dur="6.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
          values="0.5; 0.5; 1.4; 0.8; 1.3; 0.5; 0.5"
          keyTimes="0; 0.45; 0.50; 0.54; 0.58; 0.64; 1" dur="6.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
