<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ironSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="ironCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#475569" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#ironCalmShadow)">
    <!-- 1. Schlanker Schmiedeeisenreif (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#ironSteel)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="6 2"/>

    <!-- 2. FEINE DORNENRÄNKELEIN, DIE NUR NACH AUSSEN WACHSEN (r=36 bis r=46) -->
    <!-- Stachel Oben (12 Uhr) nach außen bis y=14 -->
    <path d="M48,34 Q49,24 50,14 Q51,24 52,34 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <line x1="50" y1="14" x2="50" y2="34" stroke="#ffffff" stroke-width="0.4"/>
    <path d="M43,36 Q38,28 34,22 Q40,28 45,34 Z" fill="url(#ironSteel)"/>
    <path d="M57,36 Q62,28 66,22 Q60,28 55,34 Z" fill="url(#ironSteel)"/>

    <!-- Dornen Rechts (3 Uhr) nach außen bis x=86 -->
    <path d="M66,48 Q76,49 86,50 Q76,51 66,52 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M64,43 Q72,38 78,34 Q70,42 65,45 Z" fill="url(#ironSteel)"/>
    <path d="M64,57 Q72,62 78,66 Q70,58 65,55 Z" fill="url(#ironSteel)"/>

    <!-- Dornen Unten (6 Uhr) nach außen bis y=86 -->
    <path d="M48,66 Q49,76 50,86 Q51,76 52,66 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M43,64 Q38,72 34,78 Q40,72 45,66 Z" fill="url(#ironSteel)"/>
    <path d="M57,64 Q62,72 66,78 Q60,72 55,66 Z" fill="url(#ironSteel)"/>

    <!-- Dornen Links (9 Uhr) nach außen bis x=14 -->
    <path d="M34,48 Q24,49 14,50 Q24,51 34,52 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M36,43 Q28,38 22,34 Q30,42 35,45 Z" fill="url(#ironSteel)"/>
    <path d="M36,57 Q28,62 22,66 Q30,58 35,55 Z" fill="url(#ironSteel)"/>

    <!-- Diagonale feine Stachelspitzen (r=42) -->
    <path d="M31,31 Q24,24 18,18 Q25,25 32,30 Z" fill="url(#ironSteel)"/>
    <path d="M69,31 Q76,24 82,18 Q75,25 68,30 Z" fill="url(#ironSteel)"/>
    <path d="M69,69 Q76,76 82,82 Q75,75 68,70 Z" fill="url(#ironSteel)"/>
    <path d="M31,69 Q24,76 18,82 Q25,75 32,70 Z" fill="url(#ironSteel)"/>

    <!-- 3. PERIODISCHES STAHL-AUFBLITZEN (thornGlint alle 8s) -->
    <circle cx="50" cy="14" r="2.5" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.9; 0; 0" keyTimes="0; 0.4; 0.44; 0.48; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
