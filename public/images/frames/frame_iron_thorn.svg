<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gehärteter Schwarzstahl & Hämatit Gradient -->
    <linearGradient id="ironSteelHardened" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#64748b"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="90%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="sparkEmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>

    <filter id="ironCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#475569" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#ironCalmShadow)">
    <!-- 1. GEHÄMMERTER SCHWARZSTAHLREIF (r=35.5, Stärke 1.8px) & GEKERBTER AUSSENKRANZ -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#ironSteelHardened)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. AGGRESSIVE DORNEN & KEILE (Strikt von r=35.5 nach außen bis r=46) -->
    <!-- Stachel Oben (12 Uhr): Doppelspitze bis y=6 -->
    <path d="M47,15 L50,6 L53,15 Z" fill="url(#ironSteelHardened)" stroke="#0f172a" stroke-width="0.4"/>
    <line x1="50" y1="6" x2="50" y2="15" stroke="#ffffff" stroke-width="0.4"/>
    <path d="M42,17 L36,10 L45,15 Z" fill="url(#ironSteelHardened)"/>
    <path d="M58,17 L64,10 L55,15 Z" fill="url(#ironSteelHardened)"/>

    <!-- Dornen Flanke Rechts (3 Uhr): Gruppe bis x=94 -->
    <path d="M85,47 L94,50 L85,53 Z" fill="url(#ironSteelHardened)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M83,41 L90,34 L85,45 Z" fill="url(#ironSteelHardened)"/>
    <path d="M83,59 L90,66 L85,55 Z" fill="url(#ironSteelHardened)"/>

    <!-- Dornen Unten (6 Uhr): Stachel bis y=94 -->
    <path d="M47,85 L50,94 L53,85 Z" fill="url(#ironSteelHardened)" stroke="#0f172a" stroke-width="0.4"/>
    <line x1="50" y1="85" x2="50" y2="94" stroke="#ffffff" stroke-width="0.4"/>
    <path d="M42,83 L36,90 L45,85 Z" fill="url(#ironSteelHardened)"/>
    <path d="M58,83 L64,90 L55,85 Z" fill="url(#ironSteelHardened)"/>

    <!-- Dornen Flanke Links (9 Uhr): Gruppe bis x=6 -->
    <path d="M15,47 L6,50 L15,53 Z" fill="url(#ironSteelHardened)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M17,41 L10,34 L15,45 Z" fill="url(#ironSteelHardened)"/>
    <path d="M17,59 L10,66 L15,55 Z" fill="url(#ironSteelHardened)"/>

    <!-- Diagonale scharfe Grat-Spitzen (45°, r=43) -->
    <path d="M26,26 L19,19 L27,24 Z" fill="url(#ironSteelHardened)"/>
    <path d="M74,26 L81,19 L73,24 Z" fill="url(#ironSteelHardened)"/>
    <path d="M74,74 L81,81 L73,76 Z" fill="url(#ironSteelHardened)"/>
    <path d="M26,74 L19,81 L27,76 Z" fill="url(#ironSteelHardened)"/>

    <!-- 3. HYBRID-ANIMATION (8.0s Zyklus) -->
    <!-- A) Dauer-Mikro: Kaltes Stahl-Glimmen an den Kanten -->
    <circle cx="50" cy="7" r="1.4" fill="#cbd5e1" opacity="0.3">
      <animate attributeName="opacity" values="0.25; 0.65; 0.3; 0.7; 0.25" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 8s): Zischender Klingen-Glint & Schmiedefunken Oben -->
    <!-- Glint-Streif über obere Spitze -->
    <line x1="44" y1="14" x2="56" y2="8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0; 0"
        keyTimes="0; 0.40; 0.44; 0.48; 0.52; 1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="44; 44; 48; 54; 58; 44"
        keyTimes="0; 0.40; 0.43; 0.46; 0.49; 1" dur="8s" repeatCount="indefinite"/>
    </line>

    <!-- Aufsteigende Funken -->
    <circle cx="50" cy="6" r="0.8" fill="url(#sparkEmber)" opacity="0">
      <animate attributeName="cy" values="6; 6; 2; 0; 6"
        keyTimes="0; 0.42; 0.47; 0.52; 1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 0.95; 0; 0"
        keyTimes="0; 0.42; 0.45; 0.52; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
