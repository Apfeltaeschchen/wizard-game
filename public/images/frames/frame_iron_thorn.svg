<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ironSteel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="ironCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#475569" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#ironCalmShadow)">
    <!-- 1. Schlanker Schmiedeeisenreif (r=35.5, stroke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#ironSteel)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="6 2"/>

    <!-- 2. PLASTISCHE DORNENRÄNKELEIN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Spitzen nach außen bis r=42.0) -->
    <!-- Stachel Oben (12 Uhr): Startet bei r=33 (y=17) bis y=8 -->
    <path d="M48,17 Q49,12 50,8 Q51,12 52,17 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <line x1="50" y1="8" x2="50" y2="17" stroke="#ffffff" stroke-width="0.4"/>
    <path d="M43,18 Q38,15 34,11 Q40,14 45,17 Z" fill="url(#ironSteel)"/>
    <path d="M57,18 Q62,15 66,11 Q60,14 55,17 Z" fill="url(#ironSteel)"/>

    <!-- Dornen Rechts (3 Uhr): Startet bei r=33 (x=83) bis x=92 -->
    <path d="M83,48 Q88,49 92,50 Q88,51 83,52 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M82,43 Q86,39 89,35 Q86,42 82,45 Z" fill="url(#ironSteel)"/>
    <path d="M82,57 Q86,61 89,65 Q86,58 82,55 Z" fill="url(#ironSteel)"/>

    <!-- Dornen Unten (6 Uhr): Startet bei r=33 (y=83) bis y=92 -->
    <path d="M48,83 Q49,88 50,92 Q51,88 52,83 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M43,82 Q38,85 34,89 Q40,86 45,83 Z" fill="url(#ironSteel)"/>
    <path d="M57,82 Q62,85 66,89 Q60,86 55,83 Z" fill="url(#ironSteel)"/>

    <!-- Dornen Links (9 Uhr): Startet bei r=33 (x=17) bis x=8 -->
    <path d="M17,48 Q12,49 8,50 Q12,51 17,52 Z" fill="url(#ironSteel)" stroke="#0f172a" stroke-width="0.4"/>
    <path d="M18,43 Q14,39 11,35 Q14,42 18,45 Z" fill="url(#ironSteel)"/>
    <path d="M18,57 Q14,61 11,65 Q14,58 18,55 Z" fill="url(#ironSteel)"/>

    <!-- Diagonale feine Stachelspitzen (r=41) -->
    <path d="M26,26 Q23,23 20,20 Q24,24 27,25 Z" fill="url(#ironSteel)"/>
    <path d="M74,26 Q77,23 80,20 Q76,24 73,25 Z" fill="url(#ironSteel)"/>
    <path d="M74,74 Q77,77 80,80 Q76,76 73,75 Z" fill="url(#ironSteel)"/>
    <path d="M26,74 Q23,77 20,80 Q24,76 27,75 Z" fill="url(#ironSteel)"/>

    <!-- 3. PERIODISCHES STAHL-AUFBLITZEN (thornGlint alle 8s) -->
    <circle cx="50" cy="8" r="2" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.9; 0; 0" keyTimes="0; 0.4; 0.44; 0.48; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
