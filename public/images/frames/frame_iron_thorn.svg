<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Düsteres Schmiedeeisen & geschwärzter Stahl -->
    <radialGradient id="ironBevel" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="spikeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="ironShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#475569" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Äußerer genieteter Eisenreif mit Zacken-Außenflanschen -->
  <g filter="url(#ironShadow)">
    <!-- Äußerer Stachelkranz -->
    <circle cx="50" cy="50" r="41.5" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="50" cy="50" r="38.5" stroke="url(#ironBevel)" stroke-width="4.5"/>
    
    <!-- Robuste Außennieten (8 Positionen) -->
    <circle cx="50" cy="11.5" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="77.2" cy="22.8" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="88.5" cy="50" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="77.2" cy="77.2" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="50" cy="88.5" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="22.8" cy="77.2" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="11.5" cy="50" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>
    <circle cx="22.8" cy="22.8" r="1.3" fill="#cbd5e1" stroke="#0f172a" stroke-width="0.5"/>

    <!-- Innere Facette bei r=35 -->
    <circle cx="50" cy="50" r="35" stroke="#64748b" stroke-width="1.2"/>
  </g>

  <!-- HINEINRAGENDE EISENDORNEN (INWARD OVERLAP: 8 scharfe Haken & Stacheln greifen tief bis r=25..27) -->
  <g filter="url(#ironShadow)">
    <!-- 1. Oben (12 Uhr) gekrümmter Doppelstachel -->
    <path d="M46,14 L50,25 L54,14 Q50,17 46,14 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M50,14 L50,25" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- 2. Oben-Rechts (1:30 Uhr) -->
    <path d="M72,24 L63,33 L75,29 Q72,26 72,24 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M74,26 L63,33" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- 3. Rechts (3 Uhr) Hakendorn -->
    <path d="M86,46 L75,50 L86,54 Q83,50 86,46 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M86,50 L75,50" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- 4. Unten-Rechts (4:30 Uhr) -->
    <path d="M75,71 L63,67 L72,76 Q72,74 75,71 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M74,74 L63,67" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- 5. Unten (6 Uhr) gekrümmter Doppelstachel -->
    <path d="M46,86 L50,75 L54,86 Q50,83 46,86 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M50,86 L50,75" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- 6. Unten-Links (7:30 Uhr) -->
    <path d="M25,71 L37,67 L28,76 Q28,74 25,71 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M26,74 L37,67" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- 7. Links (9 Uhr) Hakendorn -->
    <path d="M14,46 L25,50 L14,54 Q17,50 14,46 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M14,50 L25,50" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- 8. Oben-Links (10:30 Uhr) -->
    <path d="M28,24 L37,33 L25,29 Q28,26 28,24 Z" fill="url(#spikeGrad)" stroke="#0f172a" stroke-width="0.6"/>
    <path d="M26,26 L37,33" stroke="#e2e8f0" stroke-width="0.5"/>
  </g>
</svg>
