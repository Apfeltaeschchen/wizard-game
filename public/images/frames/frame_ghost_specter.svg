<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Spektrales Ektoplasma & Seelennebel-Türkis -->
    <radialGradient id="ghostMist" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="35%" stop-color="#0f766e"/>
      <stop offset="70%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#021715"/>
    </radialGradient>
    <linearGradient id="soulVapor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="75%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="ghostGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#2dd4bf" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Spektral-Ring mit Seelennebel -->
  <g filter="url(#ghostGlow)">
    <circle cx="50" cy="50" r="39" stroke="url(#ghostMist)" stroke-width="4.5"/>
    <circle cx="50" cy="50" r="35" stroke="#5eead4" stroke-width="1.2"/>
  </g>

  <!-- HINEINRAGENDE SEELENKLAUEN & EKTOPLASMA-FRATZE (INWARD OVERLAP: 
       1. Oben: Spektraler Geisterschädel ragt von y=8 bis y=26 ins Porträt
       2. Unten & Flanken: Gespenstische Nebelklauen und Seelenschwaden wehen tief bis r=25..27!) -->

  <!-- OBEN (12 Uhr): Heulender Seelenfratzen-Schädel -->
  <g filter="url(#ghostGlow)">
    <!-- Schädel-Silhouette ragt nach unten bis y=26.5 -->
    <path d="M38,13 C38,6 44,5 50,6 C56,5 62,6 62,13 C62,21 57,26.5 50,26.5 C43,26.5 38,21 38,13 Z" fill="url(#soulVapor)" stroke="#042f2e" stroke-width="0.7"/>
    <!-- Hohl leuchtende Seelenaugen (langgezogen geisterhaft) -->
    <ellipse cx="45" cy="13" rx="2" ry="3" fill="#042f2e"/>
    <ellipse cx="55" cy="13" rx="2" ry="3" fill="#042f2e"/>
    <circle cx="45" cy="12.5" r="0.7" fill="#ccfbf1"/>
    <circle cx="55" cy="12.5" r="0.7" fill="#ccfbf1"/>
    <!-- Klagender offener Geistermund ragt tief bis y=23 -->
    <ellipse cx="50" cy="20" rx="2.5" ry="4" fill="#042f2e"/>
    <ellipse cx="50" cy="19.5" rx="1.5" ry="2" fill="#5eead4" opacity="0.6"/>
  </g>

  <!-- SEELENKLAUEN AN DEN FLANKEN & UNTEN -->
  <g filter="url(#ghostGlow)">
    <!-- Linke Seelenkralle (greift von der linken Flanke bei 8 Uhr bis x=25.5 ins Porträt) -->
    <path d="M14,56 C19,53 23,54 26,50 C21,57 26,62 25,67 C20,63 15,61 14,56 Z" fill="url(#soulVapor)" stroke="#042f2e" stroke-width="0.5"/>
    <path d="M16,56 Q22,55 26,50" stroke="#ffffff" stroke-width="0.6"/>

    <!-- Rechte Seelenkralle (greift bei 4 Uhr bis x=74.5 ins Porträt) -->
    <path d="M86,56 C81,53 77,54 74,50 C79,57 74,62 75,67 C80,63 85,61 86,56 Z" fill="url(#soulVapor)" stroke="#042f2e" stroke-width="0.5"/>
    <path d="M84,56 Q78,55 74,50" stroke="#ffffff" stroke-width="0.6"/>

    <!-- Unten: Aufsteigende Seelenschwaden (6 Uhr, wehen nach oben bis y=74.5) -->
    <path d="M43,87 C43,80 47,74.5 50,74.5 C53,74.5 57,80 57,87 C53,85 47,85 43,87 Z" fill="url(#soulVapor)" stroke="#042f2e" stroke-width="0.5"/>
    <path d="M48,84 Q50,78 50,75" stroke="#ffffff" stroke-width="0.6"/>
  </g>
</svg>
