<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ghostVaporLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="70%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="ghostCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#2dd4bf" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#ghostCalmShadow)">
    <!-- 1. Schlanker Spektralreif (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="#042f2e" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#5eead4" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. ZARTE EKTOPLASMA-SCHWADEN NUR AUSSEN (r=36 bis r=46) -->
    <path d="M66,48 Q78,44 86,50 Q78,56 66,52 Z" fill="url(#ghostVaporLine)"/>
    <path d="M47,66 Q45,78 50,86 Q55,78 53,66 Z" fill="url(#ghostVaporLine)"/>
    <path d="M34,48 Q22,44 14,50 Q22,56 34,52 Z" fill="url(#ghostVaporLine)"/>

    <!-- 3. KLEINE GEISTERFRATZE SITZT FREI OBEN AUF DEM REIF (y=4 bis y=14) -->
    <g transform="translate(50, 9)">
      <ellipse cx="0" cy="0" rx="5" ry="5.5" fill="url(#ghostVaporLine)" stroke="#042f2e" stroke-width="0.4"/>
      <ellipse cx="-1.8" cy="-0.5" rx="1.1" ry="1.4" fill="#042f2e"/>
      <ellipse cx="1.8" cy="-0.5" rx="1.1" ry="1.4" fill="#042f2e"/>
      <circle cx="-1.8" cy="-0.8" r="0.4" fill="#ccfbf1"/>
      <circle cx="1.8" cy="-0.8" r="0.4" fill="#ccfbf1"/>
      <ellipse cx="0" cy="3" rx="1.2" ry="1.8" fill="#042f2e"/>

      <!-- PERIODISCHER GEISTER-HAUCH (Driften / Schweben alle 8s) -->
      <path d="M-6,0 C-10,-4 -8,-8 0,-7 C8,-8 10,-4 6,0 Z" fill="#99f6e4" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.7; 0; 0" keyTimes="0; 0.55; 0.6; 0.65; 1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,-6; 0,0" keyTimes="0; 0.55; 0.65; 1" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
