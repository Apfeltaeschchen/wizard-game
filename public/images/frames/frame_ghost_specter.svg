<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Spektrales Ektoplasma Gradient -->
    <radialGradient id="specterPlasmaRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="35%" stop-color="#2dd4bf"/>
      <stop offset="70%" stop-color="#0d9488"/>
      <stop offset="90%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </radialGradient>

    <!-- Transzendente Seelen-Aura -->
    <radialGradient id="soulMaskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ccfbf1"/>
      <stop offset="80%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </radialGradient>

    <filter id="ghostSpecterShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.8" flood-color="#2dd4bf" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#ghostSpecterShadow)">
    <!-- 1. WIRBELNDER EKTOPLASMA-STRUDELREIF (r=35.5, Stärke 2.0px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#specterPlasmaRing)" stroke-width="2"/>
    <circle cx="50" cy="50" r="37.5" stroke="#2dd4bf" stroke-width="0.8" stroke-dasharray="4 3"/>

    <!-- 2. FLIESSENDE GEISTERSCHWEIFE AN DEN FLANKEN (außerhalb r=34.5 bis r=45) -->
    <!-- Geisterschweif Links (9 Uhr bis 7 Uhr) -->
    <path d="M15,42 C8,46 7,56 12,64 C10,58 13,50 16,46 Z"
      fill="url(#specterPlasmaRing)" opacity="0.8"/>
    <!-- Geisterklaue links oben -->
    <path d="M18,32 C12,30 9,36 12,40 C14,36 16,35 19,36 Z"
      fill="#2dd4bf" opacity="0.7"/>

    <!-- Geisterschweif Rechts (3 Uhr bis 5 Uhr) -->
    <path d="M85,42 C92,46 93,56 88,64 C90,58 87,50 84,46 Z"
      fill="url(#specterPlasmaRing)" opacity="0.8"/>
    <!-- Geisterklaue rechts oben -->
    <path d="M82,32 C88,30 91,36 88,40 C86,36 84,35 81,36 Z"
      fill="#2dd4bf" opacity="0.7"/>

    <!-- 3. BASIS (6 Uhr): VERLORENE SEELEN-WIRBEL (y=84 bis 94) -->
    <path d="M42,86 C46,92 54,92 58,86 C54,89 46,89 42,86 Z" fill="#2dd4bf" opacity="0.85"/>
    <circle cx="50" cy="88" r="1.4" fill="url(#soulMaskGlow)"/>

    <!-- 4. APEX (12 Uhr): HEULENDE SEELENMASKE DER UNTERWELT (y=5 bis 17) -->
    <g transform="translate(50, 11)">
      <!-- Spektrales Seelengesicht Silhouette -->
      <ellipse cx="0" cy="0" rx="4.5" ry="5.5" fill="url(#specterPlasmaRing)" stroke="#042f2e" stroke-width="0.4"/>
      <!-- Leere Hohlaugen -->
      <ellipse cx="-1.8" cy="-1.5" rx="0.9" ry="1.4" fill="#042f2e"/>
      <ellipse cx="1.8" cy="-1.5" rx="0.9" ry="1.4" fill="#042f2e"/>
      <!-- Klagender weit geöffneter Mund -->
      <ellipse cx="0" cy="2" rx="1.2" ry="2.2" fill="#042f2e"/>
    </g>

    <!-- 5. HYBRID-ANIMATION (6.5s Zyklus) -->
    <!-- A) Dauer-Mikro: Sanft waberndes, transluzentes Geisterweben -->
    <circle cx="50" cy="50" r="37.5" stroke="#ccfbf1" stroke-width="1.2" opacity="0.3">
      <animate attributeName="opacity" values="0.2; 0.55; 0.25; 0.6; 0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 6.5s): Heulender Seelenaufschrei & spektrale Druckwelle -->
    <!-- Spektrale Druckwelle aus dem Mund der Seelenmaske -->
    <circle cx="50" cy="11" r="3" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0">
      <animate attributeName="r" values="3; 3; 16; 26; 3"
        keyTimes="0; 0.40; 0.48; 0.58; 1" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 0.9; 0.2; 0"
        keyTimes="0; 0.40; 0.44; 0.58; 1" dur="6.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Seelenmaske leuchtet grell weiß auf -->
    <circle cx="50" cy="11" r="4.5" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0.85; 0; 0"
        keyTimes="0; 0.40; 0.45; 0.50; 0.55; 0.62; 1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
