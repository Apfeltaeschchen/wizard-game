<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ghostVaporLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="70%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="ghostCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2.5" flood-color="#2dd4bf" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#ghostCalmShadow)">
    <!-- 1. Schlanker Spektralreif (r=35.5, stroke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="#042f2e" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#5eead4" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. PLASTISCHE EKTOPLASMA-SCHWADEN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Schwaden nach außen bis r=42.0) -->
    <path d="M83,48 Q88,44 92,50 Q88,56 83,52 Z" fill="url(#ghostVaporLine)"/>
    <path d="M47,83 Q45,88 50,92 Q55,88 53,83 Z" fill="url(#ghostVaporLine)"/>
    <path d="M17,48 Q12,44 8,50 Q12,56 17,52 Z" fill="url(#ghostVaporLine)"/>

    <!-- 3. KLEINE GEISTERFRATZE SITZT FREI OBEN AUF DEM REIF (y=7 bis y=14) -->
    <g transform="translate(50, 11)">
      <ellipse cx="0" cy="0" rx="3.5" ry="3.8" fill="url(#ghostVaporLine)" stroke="#042f2e" stroke-width="0.4"/>
      <ellipse cx="-1.2" cy="-0.4" rx="0.8" ry="1.0" fill="#042f2e"/>
      <ellipse cx="1.2" cy="-0.4" rx="0.8" ry="1.0" fill="#042f2e"/>
      <circle cx="-1.2" cy="-0.6" r="0.3" fill="#ccfbf1"/>
      <circle cx="1.2" cy="-0.6" r="0.3" fill="#ccfbf1"/>
      <ellipse cx="0" cy="2" rx="0.8" ry="1.2" fill="#042f2e"/>

      <!-- PERIODISCHER GEISTER-HAUCH (Driften / Schweben alle 8s) -->
      <path d="M-3,0 C-5,-2 -4,-4 0,-3 C4,-4 5,-2 3,0 Z" fill="#99f6e4" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.7; 0; 0" keyTimes="0; 0.55; 0.6; 0.65; 1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-1.5; 0,-3; 0,0" keyTimes="0; 0.55; 0.65; 1" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
