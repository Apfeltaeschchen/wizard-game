<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Ektoplasma-Türkis & Seelennebel -->
    <linearGradient id="ghostVaporFine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="70%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="ghostAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2dd4bf" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#ghostAura)">
    <!-- 1. Schlanker Spektralreif (r=35.5, stroke 1.5px) -->
    <circle cx="50" cy="50" r="35.5" stroke="#042f2e" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="36.8" stroke="#5eead4" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. WEIT NACH AUSSEN WEHENDE NEBELSCHWADEN & GEISTERSCHÄDEL (r=37 bis r=49) -->
    <!-- Geisterschädel Oben (12 Uhr) sitzt frei auf dem Reif nach außen bis y=10 -->
    <path d="M42,22 C42,12 45,10 50,11 C55,10 58,12 58,22 C58,30 55,34 50,34 C45,34 42,30 42,22 Z" fill="url(#ghostVaporFine)" stroke="#042f2e" stroke-width="0.5"/>
    <ellipse cx="46" cy="20" rx="1.5" ry="2" fill="#042f2e"/>
    <ellipse cx="54" cy="20" rx="1.5" ry="2" fill="#042f2e"/>
    <circle cx="46" cy="19.5" r="0.5" fill="#ccfbf1"/>
    <circle cx="54" cy="19.5" r="0.5" fill="#ccfbf1"/>
    <ellipse cx="50" cy="26" rx="1.8" ry="2.5" fill="#042f2e"/>

    <!-- Nebelschwaden Flanke Rechts nach außen bis x=90 -->
    <path d="M68,34 Q80,24 88,18 Q82,30 74,38 Z" fill="url(#ghostVaporFine)"/>
    <path d="M72,48 Q84,44 90,50 Q82,56 72,52 Z" fill="url(#ghostVaporFine)"/>
    <path d="M68,66 Q80,76 88,82 Q82,70 74,62 Z" fill="url(#ghostVaporFine)"/>

    <!-- Nebelschwaden Unten (6 Uhr) nach außen bis y=90 -->
    <path d="M47,65 Q44,78 50,90 Q56,78 53,65 Z" fill="url(#ghostVaporFine)"/>

    <!-- Nebelschwaden Flanke Links nach außen bis x=10 -->
    <path d="M32,34 Q20,24 12,18 Q18,30 26,38 Z" fill="url(#ghostVaporFine)"/>
    <path d="M28,48 Q16,44 10,50 Q18,56 28,52 Z" fill="url(#ghostVaporFine)"/>
    <path d="M32,66 Q20,76 12,82 Q18,70 26,62 Z" fill="url(#ghostVaporFine)"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE NEBELHAUCHE (Greifen nur 2.5px bis r=33) -->
    <polygon points="48.5,64.5 50,67 51.5,64.5" fill="#5eead4"/>
    <polygon points="64.5,48.5 67,50 64.5,51.5" fill="#5eead4"/>
    <polygon points="35.5,48.5 33,50 35.5,51.5" fill="#5eead4"/>
  </g>
</svg>
