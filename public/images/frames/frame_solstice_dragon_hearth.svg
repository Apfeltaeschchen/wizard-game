<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Zwergen-Bronze & Drachenglut Gradienten -->
    <radialGradient id="dragonHearthRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="65%" stop-color="#9a3412"/>
      <stop offset="90%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0a03"/>
    </radialGradient>
    <linearGradient id="dragonHornGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#270d04"/>
    </linearGradient>
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <filter id="dragonHearthShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.8" flood-color="#ea580c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#dragonHearthShadow)">
    <!-- 1. Geschmiedeter Bronze-Reif (r=35.5, stroke 1.8px) & Glut-Kerben -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#dragonHearthRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#f97316" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. Geschuppte Schwingen & Zangen-Dornen Links -->
    <g stroke="url(#dragonHornGrad)" stroke-linecap="round" fill="none">
      <path d="M19,34 C13,29 9,35 7,41 C11,42 13,47 9,53 C13,55 16,60 19,67" stroke-width="1.3"/>
      <!-- Drachen-Panzerplatten Links -->
      <polygon points="7,41 12,42 11,38" fill="#7c2d12" stroke="#ea580c" stroke-width="0.4"/>
      <polygon points="9,53 14,54 13,49" fill="#7c2d12" stroke="#ea580c" stroke-width="0.4"/>
      <path d="M16,36 C12,41 12,46 15,50" stroke-width="0.7" stroke="#fdba74"/>
    </g>

    <!-- Geschuppte Schwingen & Zangen-Dornen Rechts -->
    <g stroke="url(#dragonHornGrad)" stroke-linecap="round" fill="none">
      <path d="M81,34 C87,29 91,35 93,41 C89,42 87,47 91,53 C87,55 84,60 81,67" stroke-width="1.3"/>
      <!-- Drachen-Panzerplatten Rechts -->
      <polygon points="93,41 88,42 89,38" fill="#7c2d12" stroke="#ea580c" stroke-width="0.4"/>
      <polygon points="91,53 86,54 87,49" fill="#7c2d12" stroke="#ea580c" stroke-width="0.4"/>
      <path d="M84,36 C88,41 88,46 85,50" stroke-width="0.7" stroke="#fdba74"/>
    </g>

    <!-- 3. Unten: Kamin-Schmiede-Spitze mit glühendem Kohlen-Edelstein (y=83 bis y=92) -->
    <polygon points="50,92 46,83 54,83" fill="#1c0a03" stroke="#f97316" stroke-width="0.6"/>
    <circle cx="50" cy="85.5" r="1.3" fill="url(#emberGlow)"/>
    <circle cx="50" cy="85.5" r="0.5" fill="#ffffff"/>

    <!-- 4. Oben: Schlafender kleiner Winterdrache mit glimmendem Atem alle 8s (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Drachenkopf-Silhouette -->
      <path d="M-3,-2 C-1,-4 1,-4 3,-2 C4,1 2,3.5 0,4 C-2,3.5 -4,1 -3,-2 Z" fill="#7c2d12" stroke="#ea580c" stroke-width="0.5"/>
      <!-- Hörner -->
      <path d="M-2.5,-2 Q-4.5,-5 -3.5,-5.5 Q-2,-4.5 -1.5,-2.5" fill="#fdba74" stroke="#7c2d12" stroke-width="0.3"/>
      <path d="M2.5,-2 Q4.5,-5 3.5,-5.5 Q2,-4.5 1.5,-2.5" fill="#fdba74" stroke="#7c2d12" stroke-width="0.3"/>
      <!-- Nüstern / Schnauze -->
      <circle cx="-1" cy="2" r="0.4" fill="#1c0a03"/>
      <circle cx="1" cy="2" r="0.4" fill="#1c0a03"/>

      <!-- Atem-Glutfeuer (flackert und pulsiert) -->
      <circle cx="0" cy="2.2" r="1.0" fill="url(#emberGlow)" opacity="0.4">
        <animate attributeName="opacity" values="0.4; 0.95; 0.2; 0.85; 0.4; 0.4"
          keyTimes="0; 0.08; 0.16; 0.24; 0.32; 1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="0.8; 1.8; 0.8; 1.5; 0.8; 0.8"
          keyTimes="0; 0.08; 0.16; 0.24; 0.32; 1" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>