<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vulkanisches Obsidian & Glutflammen -->
    <radialGradient id="dragonBone" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="30%" stop-color="#451a03"/>
      <stop offset="70%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="clawGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="75%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="fireGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#ea580c" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Äußere lodernde Flammenzungen um den Obsidian-Ring -->
  <g filter="url(#fireGlow)">
    <!-- Flammende Spitzen Außenkranz -->
    <path d="M50,8 Q54,1 55,6 Q60,3 58,11 Q65,6 64,15 Q72,12 70,21 Q79,18 76,28 Q86,28 82,37 Q91,39 86,49 Q94,52 87,61 Q92,67 85,74 Q89,82 80,85 Q82,93 72,92 Q68,99 60,94 Q54,101 49,94 Q43,101 39,94 Q30,98 27,90 Q19,92 20,83 Q11,81 16,73 Q8,66 14,58 Q6,50 14,44 Q7,37 16,30 Q12,21 22,19 Q20,11 29,13 Q31,4 37,10 Q40,1 45,7 Z" fill="url(#fireGrad)" opacity="0.85"/>

    <!-- Obsidian-Basalt Reif -->
    <circle cx="50" cy="50" r="38.5" stroke="url(#dragonBone)" stroke-width="4.5"/>
    <circle cx="50" cy="50" r="35" stroke="#f97316" stroke-width="1.2"/>
  </g>

  <!-- HINEINRAGENDE DRACHENKRALLEN (INWARD OVERLAP: 3 Klauen oben, 3 Klauen unten, greifen tief bis r=24!) -->
  
  <!-- OBEN (12 Uhr): 3 massive, gekrümmte Drachenklauen packen nach unten ins Bild -->
  <g filter="url(#fireGlow)">
    <!-- Mittlere Kralle (am längsten: bis y=26!) -->
    <path d="M47,13 C47,18 47,23 50,26.5 C53,23 53,18 53,13 C51,15 49,15 47,13 Z" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.6"/>
    <path d="M49.2,14 Q49.2,21 50,26.5" stroke="#fef08a" stroke-width="0.6"/>

    <!-- Linke Kralle (gekrümmt nach innen rechts) -->
    <path d="M41,15 C40,20 42,24 44.5,25.5 C46,23 46,18 45,15 C43,16 42,16 41,15 Z" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.6"/>
    <path d="M42.5,16 Q43,21 44.5,25.5" stroke="#fed7aa" stroke-width="0.5"/>

    <!-- Rechte Kralle (gekrümmt nach innen links) -->
    <path d="M59,15 C60,20 58,24 55.5,25.5 C54,23 54,18 55,15 C57,16 58,16 59,15 Z" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.6"/>
    <path d="M57.5,16 Q57,21 55.5,25.5" stroke="#fed7aa" stroke-width="0.5"/>

    <!-- Drachen-Knöchel / Wulst über den Klauen -->
    <path d="M38,13 Q50,17 62,13 Q50,11 38,13 Z" fill="#1c1917" stroke="#ea580c" stroke-width="0.6"/>
  </g>

  <!-- UNTEN (6 Uhr): 3 Drachenklauen greifen nach oben ins Porträt -->
  <g filter="url(#fireGlow)">
    <!-- Mittlere Kralle (bis y=73.5!) -->
    <path d="M47,87 C47,82 47,77 50,73.5 C53,77 53,82 53,87 C51,85 49,85 47,87 Z" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.6"/>
    <path d="M49.2,86 Q49.2,79 50,73.5" stroke="#fef08a" stroke-width="0.6"/>

    <!-- Linke Kralle -->
    <path d="M41,85 C40,80 42,76 44.5,74.5 C46,77 46,82 45,85 C43,84 42,84 41,85 Z" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.6"/>
    <path d="M42.5,84 Q43,79 44.5,74.5" stroke="#fed7aa" stroke-width="0.5"/>

    <!-- Rechte Kralle -->
    <path d="M59,85 C60,80 58,76 55.5,74.5 C54,77 54,82 55,85 C57,84 58,84 59,85 Z" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.6"/>
    <path d="M57.5,84 Q57,79 55.5,74.5" stroke="#fed7aa" stroke-width="0.5"/>

    <path d="M38,87 Q50,83 62,87 Q50,89 38,87 Z" fill="#1c1917" stroke="#ea580c" stroke-width="0.6"/>
  </g>

  <!-- Seitliche Glut-Reißzähne bei 3 und 9 Uhr -->
  <g filter="url(#fireGlow)">
    <polygon points="14,47 24,50 14,53" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.5"/>
    <polygon points="86,47 76,50 86,53" fill="url(#clawGrad)" stroke="#451a03" stroke-width="0.5"/>
  </g>
</svg>
