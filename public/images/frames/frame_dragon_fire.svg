<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dragonBasalt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="40%" stop-color="#7f1d1d"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="dragonFlameSpurt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="fireCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ea580c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#fireCalmShadow)">
    <!-- 1. Schlanker Basalt-Drachenreif (r=35.5, stroke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#dragonBasalt)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. PLASTISCHE DRACHENSPORNE & FLAMMENZÜNGLEIN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Zungen nach außen bis r=42.0) -->
    <!-- Zarte Flamme Oben (12 Uhr): Startet bei r=33 (y=17) mit Bogen nach y=8 -->
    <path d="M47,17 Q45,12 50,8 Q55,12 53,17 Q50,15 47,17 Z" fill="url(#dragonFlameSpurt)"/>
    <path d="M43,18 Q38,15 34,11 Q41,14 45,17 Z" fill="url(#dragonFlameSpurt)"/>
    <path d="M57,18 Q62,15 66,11 Q59,14 55,17 Z" fill="url(#dragonFlameSpurt)"/>

    <!-- Flammen Flanke Rechts: Startet bei r=33 (x=83) bis x=92 -->
    <path d="M83,47 Q88,45 92,50 Q88,55 83,53 Z" fill="url(#dragonFlameSpurt)"/>
    <!-- Flammen Unten (6 Uhr): Startet bei r=33 (y=83) bis y=92 -->
    <path d="M47,83 Q45,88 50,92 Q55,88 53,83 Z" fill="url(#dragonFlameSpurt)"/>
    <!-- Flammen Flanke Links: Startet bei r=33 (x=17) bis x=8 -->
    <path d="M17,47 Q12,45 8,50 Q12,55 17,53 Z" fill="url(#dragonFlameSpurt)"/>

    <!-- 3. PERIODISCHES GLUT-AUFFLACKERN & FUNKENSPRÜHEN (alle 6s) -->
    <!-- Obere Flamme flammt kurz auf -->
    <path d="M48,17 Q44,12 50,8 Q56,12 52,17 Z" fill="#fffbeb" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.4; 0" keyTimes="0; 0.4; 0.45; 0.5; 1" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- Aufsteigende Funken -->
    <circle cx="49" cy="8" r="0.8" fill="#fef08a" opacity="0">
      <animate attributeName="cy" values="8; 4; 2" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.45; 0.55" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="9" r="0.8" fill="#f97316" opacity="0">
      <animate attributeName="cy" values="9; 5; 3" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.46; 0.56" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
