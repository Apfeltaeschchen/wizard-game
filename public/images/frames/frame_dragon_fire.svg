<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vulkanbasalt & Drachenglut -->
    <linearGradient id="dragonFireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="fireAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#fireAura)">
    <!-- 1. Schlanker Basaltreif (r=35.5, stroke 1.5px) -->
    <circle cx="50" cy="50" r="35.5" stroke="#1c1917" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="36.8" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. WEIT NACH AUSSEN LODERNDE FLAMMENZUNGEN & DRACHENSPORNE (r=37 bis r=49) -->
    <!-- Große Flamme Oben (12 Uhr) nach außen bis y=8 -->
    <path d="M47,35 Q44,20 50,8 Q56,20 53,35 Q50,26 47,35 Z" fill="url(#dragonFireGrad)"/>
    <path d="M42,34 Q36,22 32,16 Q40,24 45,32 Z" fill="url(#dragonFireGrad)"/>
    <path d="M58,34 Q64,22 68,16 Q60,24 55,32 Z" fill="url(#dragonFireGrad)"/>

    <!-- Flammen Flanke Rechts nach außen bis x=90 -->
    <path d="M65,47 Q78,44 90,50 Q78,56 65,53 Q74,50 65,47 Z" fill="url(#dragonFireGrad)"/>
    <path d="M68,34 Q78,26 86,20 Q77,32 72,40 Z" fill="url(#dragonFireGrad)"/>
    <path d="M68,66 Q78,74 86,80 Q77,68 72,60 Z" fill="url(#dragonFireGrad)"/>

    <!-- Flammen Unten (6 Uhr) nach außen bis y=92 -->
    <path d="M47,65 Q44,80 50,92 Q56,80 53,65 Q50,74 47,65 Z" fill="url(#dragonFireGrad)"/>
    <path d="M42,66 Q36,78 32,84 Q40,76 45,68 Z" fill="url(#dragonFireGrad)"/>
    <path d="M58,66 Q64,78 68,84 Q60,76 55,68 Z" fill="url(#dragonFireGrad)"/>

    <!-- Flammen Flanke Links nach außen bis x=10 -->
    <path d="M35,47 Q22,44 10,50 Q22,56 35,53 Q26,50 35,47 Z" fill="url(#dragonFireGrad)"/>
    <path d="M32,34 Q22,26 14,20 Q23,32 28,40 Z" fill="url(#dragonFireGrad)"/>
    <path d="M32,66 Q22,74 14,80 Q23,68 28,60 Z" fill="url(#dragonFireGrad)"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE DRACHENKRALLEN (Schmale, feine Spitzen, greifen nur 2.5px bis r=33) -->
    <!-- 3 schlanke Krallenspitzen oben greifen bis y=33 -->
    <polygon points="46,35.5 47,33 48,35.5" fill="#fef08a"/>
    <polygon points="49.2,35.5 50,32.5 50.8,35.5" fill="#ffffff"/>
    <polygon points="52,35.5 53,33 54,35.5" fill="#fef08a"/>

    <!-- 3 schlanke Krallenspitzen unten greifen bis y=67 -->
    <polygon points="46,64.5 47,67 48,64.5" fill="#fef08a"/>
    <polygon points="49.2,64.5 50,67.5 50.8,64.5" fill="#ffffff"/>
    <polygon points="52,64.5 53,67 54,64.5" fill="#fef08a"/>
  </g>
</svg>
