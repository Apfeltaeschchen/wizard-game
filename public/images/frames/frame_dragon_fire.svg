<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dragonBasalt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="40%" stop-color="#7f1d1d"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="dragonFlameSpurt" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="fireCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ea580c" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#fireCalmShadow)">
    <!-- 1. Schlanker Basalt-Drachenreif (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#dragonBasalt)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. FEINE DRACHENSPORNE & FLAMMENZÜNGLEIN NUR AUSSEN (r=36 bis r=46) -->
    <!-- Zarte Flamme Oben (12 Uhr) nach außen bis y=14 -->
    <path d="M47,34 Q45,22 50,14 Q55,22 53,34 Q50,26 47,34 Z" fill="url(#dragonFlameSpurt)"/>
    <path d="M42,35 Q37,25 33,20 Q39,26 44,33 Z" fill="url(#dragonFlameSpurt)"/>
    <path d="M58,35 Q63,25 67,20 Q61,26 56,33 Z" fill="url(#dragonFlameSpurt)"/>

    <!-- Flammen Flanke Rechts nach außen bis x=86 -->
    <path d="M66,48 Q76,46 86,50 Q76,54 66,52 Z" fill="url(#dragonFlameSpurt)"/>
    <!-- Flammen Unten (6 Uhr) nach außen bis y=86 -->
    <path d="M47,66 Q45,78 50,86 Q55,78 53,66 Z" fill="url(#dragonFlameSpurt)"/>
    <!-- Flammen Flanke Links nach außen bis x=14 -->
    <path d="M34,48 Q24,46 14,50 Q24,54 34,52 Z" fill="url(#dragonFlameSpurt)"/>

    <!-- 3. PERIODISCHES GLUT-AUFFLACKERN & FUNKENSPRÜHEN (alle 6s) -->
    <!-- Obere Flamme flammt kurz auf -->
    <path d="M48,34 Q44,18 50,8 Q56,18 52,34 Z" fill="#fffbeb" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.4; 0" keyTimes="0; 0.4; 0.45; 0.5; 1" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- Aufsteigende Funken -->
    <circle cx="49" cy="10" r="0.8" fill="#fef08a" opacity="0">
      <animate attributeName="cy" values="10; 4; 2" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.45; 0.55" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="11" r="0.8" fill="#f97316" opacity="0">
      <animate attributeName="cy" values="11; 6; 3" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.46; 0.56" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
