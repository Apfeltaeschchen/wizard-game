<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Poliertes Novizen-Messing Gradient -->
    <radialGradient id="brassApprenticeRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <radialGradient id="cardinalStudShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <filter id="brassNoviceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#brassNoviceShadow)">
    <!-- 1. SCHLANKER NOVIZEN-MESSINGREIF (Doppelreif r=35.5 und r=37.2) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#brassApprenticeRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#d97706" stroke-width="0.7" stroke-dasharray="2 3"/>

    <!-- 2. VIER KARDINAL-NIETEN (12, 3, 6, 9 Uhr) AUF DEM REIF -->
    <!-- Oben (12 Uhr, y=12.8) -->
    <circle cx="50" cy="12.8" r="1.3" fill="url(#cardinalStudShine)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="50" cy="12.8" r="0.4" fill="#ffffff"/>

    <!-- Rechts (3 Uhr, x=87.2) -->
    <circle cx="87.2" cy="50" r="1.3" fill="url(#cardinalStudShine)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="87.2" cy="50" r="0.4" fill="#ffffff"/>

    <!-- Unten (6 Uhr, y=87.2) -->
    <circle cx="50" cy="87.2" r="1.3" fill="url(#cardinalStudShine)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="50" cy="87.2" r="0.4" fill="#ffffff"/>

    <!-- Links (9 Uhr, x=12.8) -->
    <circle cx="12.8" cy="50" r="1.3" fill="url(#cardinalStudShine)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="12.8" cy="50" r="0.4" fill="#ffffff"/>

    <!-- 3. HYBRID-ANIMATION (8.0s Zyklus) -->
    <!-- A) Dauer-Mikro: Sanftes Atmen der warmen Novizen-Goldaura -->
    <circle cx="50" cy="50" r="35.5" stroke="#fef08a" stroke-width="1.4" opacity="0.25">
      <animate attributeName="opacity" values="0.2; 0.5; 0.22; 0.55; 0.2" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 8s): Umlaufender Lichtschein & Aufblitzen der Kardinal-Nieten -->
    <circle cx="50" cy="12.8" r="2.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0; 0"
        keyTimes="0; 0.40; 0.43; 0.47; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="87.2" cy="50" r="2.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0; 0"
        keyTimes="0; 0.46; 0.49; 0.53; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="87.2" r="2.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0; 0"
        keyTimes="0; 0.52; 0.55; 0.59; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12.8" cy="50" r="2.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0; 0"
        keyTimes="0; 0.58; 0.61; 0.65; 1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
