<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="noneGoldRing" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="goldCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#goldCalmShadow)">
    <!-- 1. Schlanker Goldreif (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#noneGoldRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#78350f" stroke-width="0.8"/>

    <!-- 2. Zarte Juweliers-Nieten an den 4 Kardinalpunkten (außen) -->
    <circle cx="50" cy="13" r="1.5" fill="#fef08a"/>
    <circle cx="87" cy="50" r="1.5" fill="#fef08a"/>
    <circle cx="50" cy="87" r="1.5" fill="#fef08a"/>
    <circle cx="13" cy="50" r="1.5" fill="#fef08a"/>

    <!-- Diagonale Mini-Goldkügelchen (r=37.5) -->
    <circle cx="23.5" cy="23.5" r="1.1" fill="#fde68a"/>
    <circle cx="76.5" cy="23.5" r="1.1" fill="#fde68a"/>
    <circle cx="76.5" cy="76.5" r="1.1" fill="#fde68a"/>
    <circle cx="23.5" cy="76.5" r="1.1" fill="#fde68a"/>

    <!-- 3. PERIODISCHER LICHTGLANZ-REFLEX UM DEN REIF (Gleam alle 7s) -->
    <circle cx="50" cy="50" r="35.5" stroke="#ffffff" stroke-width="2.2" stroke-dasharray="14 210" opacity="0">
      <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.2s" begin="2s; 9s; 16s; 23s; 30s" repeatCount="1"/>
      <animate attributeName="opacity" values="0; 0.9; 0" dur="1.2s" begin="2s; 9s; 16s; 23s; 30s" repeatCount="1"/>
    </circle>
  </g>
</svg>
