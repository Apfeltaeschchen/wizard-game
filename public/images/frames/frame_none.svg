<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gold Metall-Verläufe -->
    <radialGradient id="goldBevel" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9d6"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="gemRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Äußerer verzierter Ring (Außenkante r=41.5 bis r=35) -->
  <g filter="url(#goldGlow)">
    <!-- Dunkler Außenschatten-Ring -->
    <circle cx="50" cy="50" r="41" stroke="#261405" stroke-width="2.5"/>
    <!-- Haupt-Goldreif -->
    <circle cx="50" cy="50" r="38.5" stroke="url(#goldBevel)" stroke-width="4.5"/>
    <!-- Zierperlen auf dem Außenreif -->
    <circle cx="50" cy="9.5" r="1.4" fill="#fffbe8"/>
    <circle cx="50" cy="90.5" r="1.4" fill="#fffbe8"/>
    <circle cx="9.5" cy="50" r="1.4" fill="#fffbe8"/>
    <circle cx="90.5" cy="50" r="1.4" fill="#fffbe8"/>
    <circle cx="21.5" cy="21.5" r="1.2" fill="#fde68a"/>
    <circle cx="78.5" cy="21.5" r="1.2" fill="#fde68a"/>
    <circle cx="21.5" cy="78.5" r="1.2" fill="#fde68a"/>
    <circle cx="78.5" cy="78.5" r="1.2" fill="#fde68a"/>
    <!-- Innere Facettenkante bei r=35 (Avatar-Kante) -->
    <circle cx="50" cy="50" r="35.5" stroke="#ffe58f" stroke-width="1.2"/>
  </g>

  <!-- HINEINRAGENDE ELEMENTE (INWARD OVERLAP in den Avatar: r=35 nach r=27) -->
  <!-- 4 Kardinal-Klammern (Fleur-de-Lis Gemmenfassungen) -->
  
  <!-- OBEN (12 Uhr): ragt von y=14.5 tief bis y=23.5 in den Avatar -->
  <g filter="url(#goldGlow)">
    <!-- Goldene Zierklaue -->
    <path d="M44,13 Q47,19 46,24 Q48,27 50,28.5 Q52,27 54,24 Q53,19 56,13 C53,15 47,15 44,13 Z" fill="url(#goldBevel)" stroke="#78350f" stroke-width="0.7"/>
    <!-- Zierblatt-Links/Rechts Überlappung -->
    <path d="M47,21 Q43,23 45,26 Q49,25 48,22 Z" fill="#f59e0b"/>
    <path d="M53,21 Q57,23 55,26 Q51,25 52,22 Z" fill="#f59e0b"/>
    <!-- Eingelassener Rubin-Cabochon -->
    <circle cx="50" cy="21" r="2.4" fill="url(#gemRed)" stroke="#fef08a" stroke-width="0.6"/>
    <circle cx="49.2" cy="20.2" r="0.7" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- UNTEN (6 Uhr): ragt von y=85.5 tief bis y=76.5 in den Avatar -->
  <g filter="url(#goldGlow)">
    <path d="M44,87 Q47,81 46,76 Q48,73 50,71.5 Q52,73 54,76 Q53,81 56,87 C53,85 47,85 44,87 Z" fill="url(#goldBevel)" stroke="#78350f" stroke-width="0.7"/>
    <path d="M47,79 Q43,77 45,74 Q49,75 48,78 Z" fill="#f59e0b"/>
    <path d="M53,79 Q57,77 55,74 Q51,75 52,78 Z" fill="#f59e0b"/>
    <circle cx="50" cy="79" r="2.4" fill="url(#gemRed)" stroke="#fef08a" stroke-width="0.6"/>
    <circle cx="49.2" cy="78.2" r="0.7" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- LINKS (9 Uhr): ragt von x=14.5 tief bis x=23.5 in den Avatar -->
  <g filter="url(#goldGlow)">
    <path d="M13,44 Q19,47 24,46 Q27,48 28.5,50 Q27,52 24,54 Q19,53 13,56 C15,53 15,47 13,44 Z" fill="url(#goldBevel)" stroke="#78350f" stroke-width="0.7"/>
    <path d="M21,47 Q23,43 26,45 Q25,49 22,48 Z" fill="#f59e0b"/>
    <path d="M21,53 Q23,57 26,55 Q25,51 22,52 Z" fill="#f59e0b"/>
    <circle cx="21" cy="50" r="2.4" fill="url(#gemRed)" stroke="#fef08a" stroke-width="0.6"/>
    <circle cx="20.2" cy="49.2" r="0.7" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- RECHTS (3 Uhr): ragt von x=85.5 tief bis x=76.5 in den Avatar -->
  <g filter="url(#goldGlow)">
    <path d="M87,44 Q81,47 76,46 Q73,48 71.5,50 Q73,52 76,54 Q81,53 87,56 C85,53 85,47 87,44 Z" fill="url(#goldBevel)" stroke="#78350f" stroke-width="0.7"/>
    <path d="M79,47 Q77,43 74,45 Q75,49 78,48 Z" fill="#f59e0b"/>
    <path d="M79,53 Q77,57 74,55 Q75,51 78,52 Z" fill="#f59e0b"/>
    <circle cx="79" cy="50" r="2.4" fill="url(#gemRed)" stroke="#fef08a" stroke-width="0.6"/>
    <circle cx="78.2" cy="49.2" r="0.7" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
