<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Antikes Poliergold -->
    <radialGradient id="fineGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <filter id="goldAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#goldAura)">
    <!-- 1. Schlanker Doppel-Goldreif an der Avatarkante (r=35.5, stroke 1.4px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#fineGold)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="37.5" stroke="#78350f" stroke-width="0.8"/>

    <!-- 2. NACH AUSSEN RAGENDE ZIERKNOTEN (Fleur-de-lis & Zierperlen bis r=48) -->
    <!-- Zierknoten Oben (12 Uhr) nach außen bis y=12 -->
    <path d="M47,35 Q44,24 50,14 Q56,24 53,35 Q50,28 47,35 Z" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="50" cy="14" r="1.5" fill="#fef08a"/>
    <circle cx="43" cy="22" r="1.1" fill="#fde68a"/>
    <circle cx="57" cy="22" r="1.1" fill="#fde68a"/>

    <!-- Zierknoten Rechts (3 Uhr) nach außen bis x=88 -->
    <path d="M65,47 Q76,44 86,50 Q76,56 65,53 Q72,50 65,47 Z" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="86" cy="50" r="1.5" fill="#fef08a"/>
    <circle cx="78" cy="43" r="1.1" fill="#fde68a"/>
    <circle cx="78" cy="57" r="1.1" fill="#fde68a"/>

    <!-- Zierknoten Unten (6 Uhr) nach außen bis y=88 -->
    <path d="M47,65 Q44,76 50,86 Q56,76 53,65 Q50,72 47,65 Z" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="50" cy="86" r="1.5" fill="#fef08a"/>
    <circle cx="43" cy="78" r="1.1" fill="#fde68a"/>
    <circle cx="57" cy="78" r="1.1" fill="#fde68a"/>

    <!-- Zierknoten Links (9 Uhr) nach außen bis x=12 -->
    <path d="M35,47 Q24,44 14,50 Q24,56 35,53 Q28,50 35,47 Z" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.5"/>
    <circle cx="14" cy="50" r="1.5" fill="#fef08a"/>
    <circle cx="22" cy="43" r="1.1" fill="#fde68a"/>
    <circle cx="22" cy="57" r="1.1" fill="#fde68a"/>

    <!-- Diagonale feine Glanzperlen auf r=37.5 -->
    <circle cx="23.5" cy="23.5" r="1.1" fill="#fef08a"/>
    <circle cx="76.5" cy="23.5" r="1.1" fill="#fef08a"/>
    <circle cx="76.5" cy="76.5" r="1.1" fill="#fef08a"/>
    <circle cx="23.5" cy="76.5" r="1.1" fill="#fef08a"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE JUWELIERS-FASSUNGEN (Greifen nur 2.5px bis r=33) -->
    <!-- Oben feine Rubin-Halteklammer -->
    <polygon points="48.5,35.5 50,33 51.5,35.5" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="50" cy="34.5" r="0.9" fill="#ef4444"/>

    <!-- Rechts Halteklammer -->
    <polygon points="64.5,48.5 67,50 64.5,51.5" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="65.5" cy="50" r="0.9" fill="#ef4444"/>

    <!-- Unten Halteklammer -->
    <polygon points="48.5,64.5 50,67 51.5,64.5" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="50" cy="65.5" r="0.9" fill="#ef4444"/>

    <!-- Links Halteklammer -->
    <polygon points="35.5,48.5 33,50 35.5,51.5" fill="url(#fineGold)" stroke="#78350f" stroke-width="0.3"/>
    <circle cx="34.5" cy="50" r="0.9" fill="#ef4444"/>
  </g>
</svg>
