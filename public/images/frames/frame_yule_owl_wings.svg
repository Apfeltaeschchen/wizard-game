<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Mondsilber & Tiefnacht Gradienten -->
    <radialGradient id="owlSilverRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="65%" stop-color="#64748b"/>
      <stop offset="90%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="owlFeatherGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="owlNocturneShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#owlNocturneShadow)">
    <!-- 1. Silberner Zierring (r=35.5, stroke 1.8px) & Runen-Kranz -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#owlSilverRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- 2. Gefiederte Schwingen Flanke Links -->
    <g stroke="#94a3b8" stroke-linecap="round" fill="none">
      <path d="M19,34 C14,29 10,35 8,41 C12,42 14,47 10,53 C14,55 17,60 19,67" stroke-width="1.2"/>
      <!-- Innere Federzüge -->
      <path d="M16,36 C11,40 12,46 15,51" stroke-width="0.7" stroke="#e2e8f0"/>
      <path d="M13,44 C10,48 11,53 14,57" stroke-width="0.6" stroke="#cbd5e1"/>
    </g>

    <!-- Gefiederte Schwingen Flanke Rechts -->
    <g stroke="#94a3b8" stroke-linecap="round" fill="none">
      <path d="M81,34 C86,29 90,35 92,41 C88,42 86,47 90,53 C86,55 83,60 81,67" stroke-width="1.2"/>
      <!-- Innere Federzüge -->
      <path d="M84,36 C89,40 88,46 85,51" stroke-width="0.7" stroke="#e2e8f0"/>
      <path d="M87,44 C90,48 89,53 86,57" stroke-width="0.6" stroke="#cbd5e1"/>
    </g>

    <!-- 3. Unten: Mondsichel-Spange mit Saphirperle (y=83 bis y=91) -->
    <path d="M44,83 C47,89 53,89 56,83 C53,86 47,86 44,83 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="0.6"/>
    <circle cx="50" cy="85.5" r="1.2" fill="#38bdf8"/>
    <circle cx="50" cy="85.5" r="0.4" fill="#ffffff"/>

    <!-- 4. Oben: Schlafende weiße Schnee-Eule mit Federanimation alle 9s (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Eulen-Körper -->
      <ellipse cx="0" cy="0" rx="2.5" ry="3.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.5"/>
      <!-- Federohren -->
      <polygon points="-2.5,-2.5 -3.8,-5.5 -1.2,-3.5" fill="#e2e8f0" stroke="#64748b" stroke-width="0.4"/>
      <polygon points="2.5,-2.5 3.8,-5.5 1.2,-3.5" fill="#e2e8f0" stroke="#64748b" stroke-width="0.4"/>
      <!-- Bernsteinfarbene Eulenaugen -->
      <circle cx="-1.0" cy="-0.8" r="0.7" fill="#fbbf24"/>
      <circle cx="1.0" cy="-0.8" r="0.7" fill="#fbbf24"/>
      <circle cx="-1.0" cy="-0.8" r="0.3" fill="#0f172a"/>
      <circle cx="1.0" cy="-0.8" r="0.3" fill="#0f172a"/>
      <!-- Schnabel -->
      <polygon points="0,0.2 -0.5,-0.6 0.5,-0.6" fill="#f59e0b"/>

      <!-- Linke Flügelschwinge -->
      <g>
        <path d="M-2.2,-0.5 C-5.5,-4 -10,-1 -11.5,3 C-8.5,3.5 -6,6 -3,3 Z" fill="url(#owlFeatherGrad)" stroke="#475569" stroke-width="0.4"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0,0; -24 0,0; 8 0,0; -24 0,0; 0 0,0; 0 0,0"
          keyTimes="0; 0.04; 0.08; 0.12; 0.16; 1"
          dur="9s" repeatCount="indefinite"/>
      </g>

      <!-- Rechte Flügelschwinge -->
      <g>
        <path d="M2.2,-0.5 C5.5,-4 10,-1 11.5,3 C8.5,3.5 6,6 3,3 Z" fill="url(#owlFeatherGrad)" stroke="#475569" stroke-width="0.4"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0,0; 24 0,0; -8 0,0; 24 0,0; 0 0,0; 0 0,0"
          keyTimes="0; 0.04; 0.08; 0.12; 0.16; 1"
          dur="9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>