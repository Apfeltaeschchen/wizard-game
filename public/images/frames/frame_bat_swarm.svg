<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="batGothicRing" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="40%" stop-color="#581c87"/>
      <stop offset="80%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </radialGradient>
    <linearGradient id="batWingGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="batCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#9333ea" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#batCalmShadow)">
    <!-- 1. Schlanker gotischer Zierring (r=35.5, stroke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#batGothicRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. PLASTISCHE GOTISCHE SPITZBÖGEN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Schwingen nach außen bis r=42.0) -->
    <!-- Rankenartige Schwingen-Bögen Flanke Links -->
    <path d="M19,34 C15,30 11,36 9,42 C13,43 15,48 11,54 C15,55 18,60 20,66" stroke="#7e22ce" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- Rankenartige Schwingen-Bögen Flanke Rechts -->
    <path d="M81,34 C85,30 89,36 91,42 C87,43 85,48 89,54 C85,55 82,60 80,66" stroke="#7e22ce" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    
    <!-- Unten: Zarte gotische Spitze mit Fassung bei r=33 (y=83) bis y=91 -->
    <polygon points="50,91 47,83 53,83" fill="#3b0764" stroke="#a855f7" stroke-width="0.6"/>
    <circle cx="50" cy="85" r="1.2" fill="#c084fc"/>

    <!-- 3. ANIMIERTE FLEDERMAUS OBEN (y=8 bis y=15, schlägt alle 8s mit den Flügeln) -->
    <g transform="translate(50, 11)">
      <!-- Fledermaus-Körper & Kopf -->
      <ellipse cx="0" cy="0" rx="2" ry="3" fill="#1e1b4b" stroke="#7e22ce" stroke-width="0.5"/>
      <!-- Ohren -->
      <polygon points="-2,-2 -3,-5 -1,-3" fill="#3b0764"/>
      <polygon points="2,-2 3,-5 1,-3" fill="#3b0764"/>
      <!-- Leuchtende Augen -->
      <circle cx="-0.8" cy="-1" r="0.4" fill="#fbcfe8"/>
      <circle cx="0.8" cy="-1" r="0.4" fill="#fbcfe8"/>

      <!-- Linker Flügel -->
      <g>
        <path d="M-2,0 C-5,-4 -9,-2 -11,2 C-8,3 -6,6 -3,3 Z" fill="url(#batWingGrad2)" stroke="#1e1b4b" stroke-width="0.4"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0,0; -30 0,0; 10 0,0; -30 0,0; 0 0,0; 0 0,0"
          keyTimes="0; 0.03; 0.06; 0.09; 0.12; 1"
          dur="8s" repeatCount="indefinite"/>
      </g>

      <!-- Rechter Flügel -->
      <g>
        <path d="M2,0 C5,-4 9,-2 11,2 C8,3 6,6 3,3 Z" fill="url(#batWingGrad2)" stroke="#1e1b4b" stroke-width="0.4"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0,0; 30 0,0; -10 0,0; 30 0,0; 0 0,0; 0 0,0"
          keyTimes="0; 0.03; 0.06; 0.09; 0.12; 1"
          dur="8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
