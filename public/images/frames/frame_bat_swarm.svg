<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="batGothicRing" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="40%" stop-color="#581c87"/>
      <stop offset="80%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </radialGradient>
    <linearGradient id="batWingGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="80%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="batCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#9333ea" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#batCalmShadow)">
    <!-- 1. Schlanker gotischer Zierring (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#batGothicRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. Äußere zarte gotische Spitzbögen & Verzierungen (r=37 bis r=46) -->
    <!-- Rankenartige Schwingen-Bögen, die sich außen an den Reif schmiegen -->
    <path d="M25,32 C20,28 14,35 12,42 C16,42 18,48 14,54 C18,54 22,60 25,66" stroke="#7e22ce" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M75,32 C80,28 86,35 88,42 C84,42 82,48 86,54 C82,54 78,60 75,66" stroke="#7e22ce" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    
    <!-- Unten: Zarte gotische Spitze nach außen (y=88) -->
    <polygon points="50,88 47,80 53,80" fill="#3b0764" stroke="#a855f7" stroke-width="0.6"/>
    <circle cx="50" cy="81" r="1.2" fill="#c084fc"/>

    <!-- 3. ANIMIERTE FLEDERMAUS OBEN AUF DEM REIF (y=6 bis y=15, schlägt alle 8s mit den Flügeln) -->
    <g transform="translate(50, 11)">
      <!-- Fledermaus-Körper & Kopf -->
      <ellipse cx="0" cy="0" rx="2" ry="3" fill="#1e1b4b" stroke="#7e22ce" stroke-width="0.5"/>
      <!-- Ohren -->
      <polygon points="-2,-2 -3,-5 -1,-3" fill="#3b0764"/>
      <polygon points="2,-2 3,-5 1,-3" fill="#3b0764"/>
      <!-- Leuchtende Augen -->
      <circle cx="-0.8" cy="-1" r="0.4" fill="#fbcfe8"/>
      <circle cx="0.8" cy="-1" r="0.4" fill="#fbcfe8"/>

      <!-- Linker Flügel mit animiertem Flügelschlag (alle 8s schlägt er zweimal kurz: bei 0s, 0.3s, 0.6s, dann Ruhe) -->
      <g>
        <path d="M-2,0 C-6,-5 -12,-3 -14,2 C-10,3 -8,7 -4,4 Z" fill="url(#batWingGrad2)" stroke="#1e1b4b" stroke-width="0.4"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0,0; -35 0,0; 10 0,0; -35 0,0; 0 0,0; 0 0,0"
          keyTimes="0; 0.03; 0.06; 0.09; 0.12; 1"
          dur="8s" repeatCount="indefinite"/>
      </g>

      <!-- Rechter Flügel mit animiertem Flügelschlag -->
      <g>
        <path d="M2,0 C6,-5 12,-3 14,2 C10,3 8,7 4,4 Z" fill="url(#batWingGrad2)" stroke="#1e1b4b" stroke-width="0.4"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0,0; 35 0,0; -10 0,0; 35 0,0; 0 0,0; 0 0,0"
          keyTimes="0; 0.03; 0.06; 0.09; 0.12; 1"
          dur="8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
