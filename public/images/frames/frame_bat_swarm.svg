<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gotisches Schattengrau & Vampir-Violett -->
    <radialGradient id="gothicIron" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="35%" stop-color="#2e1065"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="batWingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#7e22ce"/>
      <stop offset="70%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#18022b"/>
    </linearGradient>
    <filter id="batGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#a855f7" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Gotischer Wölbbogen & Fledermaus-Silhouette außen -->
  <g filter="url(#batGlow)">
    <!-- Oben aufsteigende Fledermäuse Silhouette -->
    <!-- Kleine Fledermaus Oben-Links (11 Uhr) -->
    <path d="M22,12 Q24,7 28,10 Q26,11 25,14 Q23,12 22,12 Z" fill="#3b0764"/>
    <!-- Kleine Fledermaus Oben-Rechts (1 Uhr) -->
    <path d="M78,12 Q76,7 72,10 Q74,11 75,14 Q77,12 78,12 Z" fill="#3b0764"/>

    <!-- Reif-Körper -->
    <circle cx="50" cy="50" r="39" stroke="url(#gothicIron)" stroke-width="4.5"/>
    <circle cx="50" cy="50" r="35" stroke="#a855f7" stroke-width="1.2"/>

    <!-- Gotische Spitze Oben (12 Uhr) -->
    <polygon points="50,6 46,14 54,14" fill="#2e1065" stroke="#a855f7" stroke-width="0.6"/>
  </g>

  <!-- HINEINRAGENDE FLEDERMAUS-SCHWINGEN (INWARD OVERLAP: 
       Zwei mächtige fledermausartige Lederschwingen umgreifen den Avatar von Links & Rechts bis r=25!) -->
  <g filter="url(#batGlow)">
    <!-- LINKE SCHWINGE (Umfasst die linke Flanke und ragt bis x=24.5 ins Porträt) -->
    <path d="M12,32 C17,31 23,34 25,38 C21,41 24,47 26,50 C22,54 23,61 17,66 C15,55 12,43 12,32 Z" fill="url(#batWingGrad)" stroke="#18022b" stroke-width="0.6"/>
    <!-- Knöchel-Kralle des Flügels ragt tief ins Bild -->
    <polygon points="25,38 27.5,39 24.5,41" fill="#e9d5ff"/>
    <polygon points="26,50 28.5,51 25.5,53" fill="#e9d5ff"/>
    <!-- Schwingen-Fingerrippen -->
    <path d="M14,35 Q20,38 25,38" stroke="#d8b4fe" stroke-width="0.5"/>
    <path d="M14,48 Q21,49 26,50" stroke="#d8b4fe" stroke-width="0.5"/>
    <path d="M15,60 Q21,58 24,56" stroke="#d8b4fe" stroke-width="0.5"/>

    <!-- RECHTE SCHWINGE (Symmetrisch auf der rechten Flanke, ragt bis x=75.5 ins Porträt) -->
    <path d="M88,32 C83,31 77,34 75,38 C79,41 76,47 74,50 C78,54 77,61 83,66 C85,55 88,43 88,32 Z" fill="url(#batWingGrad)" stroke="#18022b" stroke-width="0.6"/>
    <polygon points="75,38 72.5,39 75.5,41" fill="#e9d5ff"/>
    <polygon points="74,50 71.5,51 74.5,53" fill="#e9d5ff"/>
    <path d="M86,35 Q80,38 75,38" stroke="#d8b4fe" stroke-width="0.5"/>
    <path d="M86,48 Q79,49 74,50" stroke="#d8b4fe" stroke-width="0.5"/>
    <path d="M85,60 Q79,58 76,56" stroke="#d8b4fe" stroke-width="0.5"/>

    <!-- Unten: Gotischer Vampir-Kamm (6 Uhr, ragt bis y=76 nach oben) -->
    <polygon points="50,75 46,86 54,86" fill="url(#batWingGrad)" stroke="#18022b" stroke-width="0.5"/>
    <circle cx="50" cy="79" r="1.3" fill="#c084fc"/>
  </g>
</svg>
