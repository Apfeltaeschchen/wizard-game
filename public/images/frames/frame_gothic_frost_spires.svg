<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Tiefes gotisches Frost-Eisblau Gradient -->
    <radialGradient id="frostGothicRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="frostSpireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="frostCrystalCore" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="frostGothicShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.8" flood-color="#0284c7" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#frostGothicShadow)">
    <!-- 1. Gotischer Eisring (r=35.5, stroke 1.8px) & Frost-Zierkreis -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#frostGothicRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#7dd3fc" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. Gotische Eiszapfen-Maßwerk-Flanken Links -->
    <g stroke="url(#frostSpireGrad)" stroke-linecap="round" fill="none">
      <!-- Äußere Kathedralen-Spitze links -->
      <path d="M19,34 C14,30 10,36 8,42 C12,43 14,48 10,54 C14,56 17,61 19,67" stroke-width="1.2"/>
      <!-- Filigranes inneres Eis-Gespinst -->
      <path d="M16,38 C12,42 12,48 15,52" stroke-width="0.7" stroke="#e0f2fe"/>
      <polygon points="7,42 11,43 10,40" fill="#bae6fd" stroke="none"/>
      <polygon points="9,54 13,53 11,56" fill="#bae6fd" stroke="none"/>
    </g>

    <!-- Gotische Eiszapfen-Maßwerk-Flanken Rechts -->
    <g stroke="url(#frostSpireGrad)" stroke-linecap="round" fill="none">
      <!-- Äußere Kathedralen-Spitze rechts -->
      <path d="M81,34 C86,30 90,36 92,42 C88,43 86,48 90,54 C86,56 83,61 81,67" stroke-width="1.2"/>
      <!-- Filigranes inneres Eis-Gespinst -->
      <path d="M84,38 C88,42 88,48 85,52" stroke-width="0.7" stroke="#e0f2fe"/>
      <polygon points="93,42 89,43 90,40" fill="#bae6fd" stroke="none"/>
      <polygon points="91,54 87,53 89,56" fill="#bae6fd" stroke="none"/>
    </g>

    <!-- 3. Unten: Gotischer Dreipass mit hängendem Eiskristall (y=83 bis y=92) -->
    <polygon points="50,92 46,84 54,84" fill="#082f49" stroke="#7dd3fc" stroke-width="0.6"/>
    <!-- Glänzendes Kristall-Juwel -->
    <polygon points="50,89 48,85 50,83 52,85" fill="#f0f9ff" stroke="#38bdf8" stroke-width="0.3"/>
    <circle cx="50" cy="85.5" r="0.6" fill="#ffffff"/>

    <!-- 4. Oben: Schwebender, pulsierender Frostkristall / Yule-Stern (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Kristall-Schild -->
      <polygon points="0,-4.5 3.2,-1 4,1 0,4.5 -4,1 -3.2,-1" fill="url(#frostCrystalCore)" stroke="#082f49" stroke-width="0.5"/>
      <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="#f0f9ff" stroke-width="0.4"/>
      <line x1="-4" y1="1" x2="4" y2="1" stroke="#bae6fd" stroke-width="0.4"/>

      <!-- Kristalline Flanken-Spitzen -->
      <polygon points="-4,1 -6,0.5 -4,0" fill="#e0f2fe"/>
      <polygon points="4,1 6,0.5 4,0" fill="#e0f2fe"/>

      <!-- Lebendiges Glitzern / Pulsieren alle 7s -->
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" opacity="0.3">
        <animate attributeName="opacity" values="0.3; 0.9; 0.3; 0.8; 0.3; 0.3"
          keyTimes="0; 0.08; 0.16; 0.24; 0.32; 1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="r" values="1.2; 2.2; 1.2; 2.0; 1.2; 1.2"
          keyTimes="0; 0.08; 0.16; 0.24; 0.32; 1" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>