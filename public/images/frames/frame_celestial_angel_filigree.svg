<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Himmlisches Lichtgold & Perlmutt Gradienten -->
    <radialGradient id="angelGoldRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="65%" stop-color="#ca8a04"/>
      <stop offset="90%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#3a2203"/>
    </radialGradient>
    <linearGradient id="angelFiligreeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="haloSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef9c3"/>
      <stop offset="80%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </radialGradient>
    <filter id="angelFiligreeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.8" flood-color="#eab308" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#angelFiligreeShadow)">
    <!-- 1. Erhabener Gold-Zierring (r=35.5, stroke 1.8px) & Arkane Sonnen-Punkte -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#angelGoldRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#fde047" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- 2. Barocke Engelsflügel-Bögen Flanke Links -->
    <g stroke="url(#angelFiligreeGrad)" stroke-linecap="round" fill="none">
      <path d="M19,34 C13,28 9,34 7,41 C11,42 13,47 9,53 C13,55 16,60 19,67" stroke-width="1.3"/>
      <!-- Filigranes goldenes Maßwerk & Lilien -->
      <path d="M16,36 C10,40 11,46 14,50" stroke-width="0.7" stroke="#ffffff"/>
      <path d="M14,44 C11,48 12,52 15,56" stroke-width="0.6" stroke="#fef08a"/>
      <polygon points="7,41 11,42 10,38" fill="#fef08a" stroke="none"/>
      <polygon points="9,53 13,54 11,50" fill="#fef08a" stroke="none"/>
    </g>

    <!-- Barocke Engelsflügel-Bögen Flanke Rechts -->
    <g stroke="url(#angelFiligreeGrad)" stroke-linecap="round" fill="none">
      <path d="M81,34 C87,28 91,34 93,41 C89,42 87,47 91,53 C87,55 84,60 81,67" stroke-width="1.3"/>
      <!-- Filigranes goldenes Maßwerk & Lilien -->
      <path d="M84,36 C90,40 89,46 86,50" stroke-width="0.7" stroke="#ffffff"/>
      <path d="M86,44 C89,48 88,52 85,56" stroke-width="0.6" stroke="#fef08a"/>
      <polygon points="93,41 89,42 90,38" fill="#fef08a" stroke="none"/>
      <polygon points="91,53 87,54 89,50" fill="#fef08a" stroke="none"/>
    </g>

    <!-- 3. Unten: Gotischer Lilien-Abschluss mit Sonnendiamant (y=83 bis y=92) -->
    <polygon points="50,92 46,84 54,84" fill="#3a2203" stroke="#fde047" stroke-width="0.6"/>
    <polygon points="50,90 48,85 50,83 52,85" fill="#ffffff" stroke="#fde047" stroke-width="0.4"/>
    <circle cx="50" cy="85.5" r="0.6" fill="#fef08a"/>

    <!-- 4. Oben: Heiliger Heiligenschein & Stern des Ostens (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Aureole / Nimbus -->
      <circle cx="0" cy="0" r="3.6" fill="none" stroke="#fef08a" stroke-width="0.6" stroke-dasharray="1 1"/>
      
      <!-- Achtzackiger Stern -->
      <polygon points="0,-4.5 1,-1.2 4.2,-1 1.6,0.8 2.5,4 0,1.8 -2.5,4 -1.6,0.8 -4.2,-1 -1,-1.2"
        fill="url(#haloSunGlow)" stroke="#ca8a04" stroke-width="0.3"/>
      
      <!-- Sanftes Atmen / Pulsieren der göttlichen Aura alle 6s -->
      <circle cx="0" cy="0" r="1.6" fill="#ffffff" opacity="0.4">
        <animate attributeName="opacity" values="0.4; 0.95; 0.35; 0.85; 0.4; 0.4"
          keyTimes="0; 0.1; 0.2; 0.3; 0.4; 1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="r" values="1.2; 2.5; 1.2; 2.2; 1.2; 1.2"
          keyTimes="0; 0.1; 0.2; 0.3; 0.4; 1" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>