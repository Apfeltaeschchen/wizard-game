<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="silverRingGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="silverCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#cbd5e1" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#silverCalmShadow)">
    <!-- 1. Schlanker Elfen-Mithrilreif (r=35.5, stroke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#silverRingGrad)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#64748b" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. PLASTISCHE LORBEERBLÄTTCHEN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Blätter nach außen bis r=42.0) -->
    <!-- Linke Flanke: Blätterzweige schmiegen sich an den Reif -->
    <path d="M26,26 Q21,23 18,20 Q24,25 27,27 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M17,46 Q13,44 10,48 Q15,50 17,50 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M26,74 Q21,77 18,80 Q24,75 27,73 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>

    <!-- Rechte Flanke: Blätterzweige -->
    <path d="M74,26 Q79,23 82,20 Q76,25 73,27 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M83,46 Q87,44 90,48 Q85,50 83,50 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M74,74 Q79,77 82,80 Q76,75 73,73 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>

    <!-- Oben (12 Uhr): Zarter Elfenknoten mit Fassung bei r=33 (y=17) bis y=9 -->
    <path d="M47,17 Q45,12 50,9 Q55,12 53,17 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>
    <circle cx="50" cy="9" r="1.3" fill="#ffffff"/>

    <!-- Unten (6 Uhr): Elegante Elfen-Schleife mit Fassung bei r=33 (y=83) bis y=91 -->
    <path d="M46,83 Q50,87 50,91 Q50,87 54,83 Z" fill="url(#silverRingGrad)" stroke="#1e293b" stroke-width="0.4"/>
    <circle cx="50" cy="91" r="1.3" fill="#ffffff"/>

    <!-- 3. PERIODISCHES STERNEN-FUNKELN AUF DER MITHRIL-SPITZE (alle 8s) -->
    <g transform="translate(50, 9)">
      <path d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.45; 0.48; 0.52; 1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.5; 0.5; 1.4; 0.5; 0.5" keyTimes="0; 0.45; 0.48; 0.52; 1" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
