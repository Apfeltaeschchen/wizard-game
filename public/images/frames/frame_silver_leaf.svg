<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Elfen-Mithrilsilber mit zartem Mondglanz -->
    <radialGradient id="silverGleam" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cbd5e1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Grundkranz & Rankenbasis -->
  <g filter="url(#silverGlow)">
    <circle cx="50" cy="50" r="39.5" stroke="#334155" stroke-width="2"/>
    <circle cx="50" cy="50" r="38" stroke="url(#silverGleam)" stroke-width="3"/>
    <circle cx="50" cy="50" r="35.5" stroke="#f8fafc" stroke-width="1"/>
    
    <!-- Schleifenknoten an der Basis (6 Uhr) -->
    <path d="M46,89 Q50,86 54,89 Q52,94 50,91 Q48,94 46,89 Z" fill="url(#silverGleam)" stroke="#334155" stroke-width="0.5"/>
    <circle cx="50" cy="89" r="1.8" fill="#ffffff" stroke="#94a3b8" stroke-width="0.6"/>
  </g>

  <!-- HINEINRAGENDE LORBEERBLÄTTER & ELFEN-RANKEN (INWARD OVERLAP: r=35 bis tief r=26..28) -->
  <g filter="url(#silverGlow)">
    <!-- LINKE FLANKE (Klettert von 6 Uhr über 9 Uhr nach 12 Uhr hoch) -->
    <!-- Blatt 1: Unten-Links ragt nach innen -->
    <path d="M34,80 C31,77 26,76 29,71 C34,73 36,76 34,80 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M31,78 Q29,74 30,72" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 2: Mitte-Unten-Links greift bis r=27 -->
    <path d="M26,69 C22,64 21,57 26,58 C28,62 29,66 26,69 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M25,67 Q23,61 25,59" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 3: Mitte-Links ragt direkt nach innen über die Flanke (x=24!) -->
    <path d="M21,52 C17,49 19,42 25,45 C25,49 23,51 21,52 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M21,50 Q20,45 24,44" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 4: Oben-Links greift tief ins Porträt (r=27) -->
    <path d="M25,37 C22,32 28,26 31,31 C29,34 27,36 25,37 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M26,36 Q26,30 30,30" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 5: Spitze Oben-Links vor der Krone -->
    <path d="M34,25 C34,20 41,20 40,26 C37,26 35,26 34,25 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>

    <!-- RECHTE FLANKE (Symmetrisch gespiegelt) -->
    <!-- Blatt 6: Unten-Rechts -->
    <path d="M66,80 C69,77 74,76 71,71 C66,73 64,76 66,80 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M69,78 Q71,74 70,72" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 7: Mitte-Unten-Rechts greift bis r=27 -->
    <path d="M74,69 C78,64 79,57 74,58 C72,62 71,66 74,69 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M75,67 Q77,61 75,59" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 8: Mitte-Rechts (x=76!) -->
    <path d="M79,52 C83,49 81,42 75,45 C75,49 77,51 79,52 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M79,50 Q80,45 76,44" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 9: Oben-Rechts -->
    <path d="M75,37 C78,32 72,26 69,31 C71,34 73,36 75,37 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>
    <path d="M74,36 Q74,30 70,30" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Blatt 10: Spitze Oben-Rechts -->
    <path d="M66,25 C66,20 59,20 60,26 C63,26 65,26 66,25 Z" fill="url(#leafGrad)" stroke="#1e293b" stroke-width="0.5"/>

    <!-- Spitzen-Schließe bei 12 Uhr (Mithril-Lilie, ragt nach unten zu y=24) -->
    <path d="M46,13 Q50,23 50,26 Q50,23 54,13 C51,16 49,16 46,13 Z" fill="url(#silverGleam)" stroke="#1e293b" stroke-width="0.6"/>
    <circle cx="50" cy="23" r="1.5" fill="#ffffff" stroke="#94a3b8" stroke-width="0.5"/>
  </g>
</svg>
