<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Elfen-Mithrilsilber mit Mondglanz -->
    <radialGradient id="silverVine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="silverAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#cbd5e1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#silverAura)">
    <!-- 1. Zarter Silberranken-Grundreif (r=35.5, stroke 1.5px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#silverVine)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="36.8" stroke="#64748b" stroke-width="0.8" stroke-dasharray="6 2"/>

    <!-- 2. WEIT NACH AUSSEN BLÜHENDE LORBEERBLÄTTER & ELFEN-RANKEN (r=37 bis r=49) -->
    <!-- Linke Flanke: Blätterzweig wächst nach außen links -->
    <path d="M30,30 Q20,24 15,18 Q23,26 28,33 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M26,42 Q16,40 10,43 Q18,46 25,46 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M27,56 Q17,60 12,67 Q20,63 27,59 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M34,70 Q25,78 20,85 Q28,79 34,73 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>

    <!-- Rechte Flanke: Blätterzweig wächst nach außen rechts -->
    <path d="M70,30 Q80,24 85,18 Q77,26 72,33 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M74,42 Q84,40 90,43 Q82,46 75,46 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M73,56 Q83,60 88,67 Q80,63 73,59 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>
    <path d="M66,70 Q75,78 80,85 Q72,79 66,73 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.4"/>

    <!-- Oben (12 Uhr): Zarter Elfenknoten nach außen bis y=12 -->
    <path d="M47,35 Q44,22 50,14 Q56,22 53,35 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="50" cy="14" r="1.4" fill="#ffffff"/>

    <!-- Unten (6 Uhr): Elegante Schleife nach außen bis y=88 -->
    <path d="M46,65 Q50,72 50,86 Q50,72 54,65 Z" fill="url(#silverVine)" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="50" cy="86" r="1.4" fill="#ffffff"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE BLATTSPITZEN (Greifen nur 2-3px bis r=32.5) -->
    <!-- Zarte Blattspitze Oben-Links r=32.5 -->
    <path d="M38,38 L34,35 L38.5,35 Z" fill="url(#silverVine)"/>
    <!-- Zarte Blattspitze Oben-Rechts r=32.5 -->
    <path d="M62,38 L66,35 L61.5,35 Z" fill="url(#silverVine)"/>
    <!-- Zarte Blattspitze Unten-Links -->
    <path d="M38,62 L34,65 L38.5,65 Z" fill="url(#silverVine)"/>
    <!-- Zarte Blattspitze Unten-Rechts -->
    <path d="M62,62 L66,65 L61.5,65 Z" fill="url(#silverVine)"/>
  </g>
</svg>
