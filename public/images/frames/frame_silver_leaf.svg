<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Elfisches Mondschein-Mithril Gradient -->
    <radialGradient id="elvenSilverMithril" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="90%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>

    <!-- Waldelfischer Tropfen-Aquamarin -->
    <radialGradient id="aquamarineDrop" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <filter id="silverCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#cbd5e1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#silverCalmShadow)">
    <!-- 1. FILIGRANER MITHRIL-BASISREIF (r=35.5, Stärke 1.8px) & PERLENKRANZ -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#elvenSilverMithril)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- 2. PLASTISCHE LORBEER- & OLIVENBLÄTTER (Entlang beider Flanken von r=35.5 nach außen bis r=45) -->
    <!-- Flanke Links: Geschwungene Lorbeerzweige -->
    <g fill="url(#elvenSilverMithril)" stroke="#334155" stroke-width="0.3">
      <!-- Oben-Links (10 Uhr) -->
      <path d="M26,26 Q20,22 16,18 Q23,24 27,27 Z"/>
      <path d="M22,34 Q15,31 11,28 Q18,33 23,35 Z"/>
      <!-- Mitte-Links (9 Uhr) -->
      <path d="M16,46 Q10,43 7,47 Q13,50 16,50 Z"/>
      <circle cx="10" cy="42" r="1.1" fill="url(#aquamarineDrop)" stroke="#059669" stroke-width="0.2"/>
      <!-- Unten-Links (8 Uhr) -->
      <path d="M22,66 Q15,69 11,72 Q18,67 23,65 Z"/>
      <path d="M26,74 Q20,78 16,82 Q23,76 27,73 Z"/>
    </g>

    <!-- Flanke Rechts: Geschwungene Lorbeerzweige -->
    <g fill="url(#elvenSilverMithril)" stroke="#334155" stroke-width="0.3">
      <!-- Oben-Rechts (2 Uhr) -->
      <path d="M74,26 Q80,22 84,18 Q77,24 73,27 Z"/>
      <path d="M78,34 Q85,31 89,28 Q82,33 77,35 Z"/>
      <!-- Mitte-Rechts (3 Uhr) -->
      <path d="M84,46 Q90,43 93,47 Q87,50 84,50 Z"/>
      <circle cx="90" cy="42" r="1.1" fill="url(#aquamarineDrop)" stroke="#059669" stroke-width="0.2"/>
      <!-- Unten-Rechts (4 Uhr) -->
      <path d="M78,66 Q85,69 89,72 Q82,67 77,65 Z"/>
      <path d="M74,74 Q80,78 84,82 Q77,76 73,73 Z"/>
    </g>

    <!-- 3. APEX (12 Uhr): ELFESCHER DREIKLANG-KNOTEN & BLATTKRONE (y=6 bis 16) -->
    <path d="M47,16 Q44,10 50,6 Q56,10 53,16 Z" fill="url(#elvenSilverMithril)" stroke="#334155" stroke-width="0.4"/>
    <circle cx="50" cy="6" r="1.4" fill="#ffffff"/>

    <!-- 4. BASIS (6 Uhr): FILIGRANE SILBERSCHLEIFE MIT TROPFEN-AQUAMARIN (y=84 bis 95) -->
    <path d="M44,85 Q50,89 50,93 Q50,89 56,85 Z" fill="url(#elvenSilverMithril)" stroke="#334155" stroke-width="0.4"/>
    <polygon points="50,95 48,88 52,88" fill="url(#aquamarineDrop)" stroke="#059669" stroke-width="0.3"/>
    <circle cx="50" cy="89" r="0.6" fill="#ffffff"/>

    <!-- 5. HYBRID-ANIMATION (7.5s Zyklus) -->
    <!-- A) Dauer-Mikro: Zartes Perlmutt-Schimmern entlang der Blattränder -->
    <circle cx="50" cy="6" r="1.8" fill="#ffffff" opacity="0.3">
      <animate attributeName="opacity" values="0.25; 0.65; 0.3; 0.7; 0.25" dur="7.5s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 7.5s): Wellenförmige Lichtwelle durch die Lorbeerblätter zum Scheitelstern -->
    <!-- Welle links -->
    <path d="M26,74 Q12,50 26,26" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0; 0"
        keyTimes="0; 0.40; 0.45; 0.50; 0.55; 1" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <!-- Welle rechts -->
    <path d="M74,74 Q88,50 74,26" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0; 0"
        keyTimes="0; 0.40; 0.45; 0.50; 0.55; 1" dur="7.5s" repeatCount="indefinite"/>
    </path>

    <!-- Sternenblitz am Scheitelknoten -->
    <g transform="translate(50, 6)">
      <path d="M0,-3.5 L0.8,-0.8 L3.5,0 L0.8,0.8 L0,3.5 L-0.8,0.8 L-3.5,0 L-0.8,-0.8 Z" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 0.2; 0.9; 0; 0"
          keyTimes="0; 0.48; 0.52; 0.56; 0.60; 0.66; 1" dur="7.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
          values="0.5; 0.5; 1.4; 0.8; 1.3; 0.5; 0.5"
          keyTimes="0; 0.48; 0.52; 0.56; 0.60; 0.66; 1" dur="7.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
