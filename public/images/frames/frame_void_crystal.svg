<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="voidRingGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#7e22ce"/>
      <stop offset="80%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#18022b"/>
    </radialGradient>
    <linearGradient id="crystalFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="40%" stop-color="#d8b4fe"/>
      <stop offset="80%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="voidCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#voidCalmShadow)">
    <!-- 1. Schlanker Astralreif (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#voidRingGrad)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="2 4"/>

    <!-- 2. AMETHYST-KRISTALLE SITZEN NUR AUSSEN AUF DEM REIF (r=36 bis r=46) -->
    <!-- Kristallgruppe Oben (12 Uhr) nach außen bis y=12 -->
    <g>
      <polygon points="50,11 47,24 50,34 53,24" fill="url(#crystalFacet)" stroke="#2e1065" stroke-width="0.4"/>
      <line x1="50" y1="11" x2="50" y2="34" stroke="#ffffff" stroke-width="0.5"/>
      <polygon points="42,21 40,28 46,33 47,26" fill="url(#crystalFacet)"/>
      <polygon points="58,21 60,28 54,33 53,26" fill="url(#crystalFacet)"/>
      <!-- Periodischer Prisma-Glanz alle 7s -->
      <polygon points="50,11 47,24 50,34 53,24" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.85; 0; 0" keyTimes="0; 0.3; 0.34; 0.38; 1" dur="7s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Kristallgruppe Rechts (3 Uhr) nach außen bis x=89 -->
    <g>
      <polygon points="89,50 76,47 66,50 76,53" fill="url(#crystalFacet)" stroke="#2e1065" stroke-width="0.4"/>
      <line x1="89" y1="50" x2="66" y2="50" stroke="#ffffff" stroke-width="0.5"/>
      <polygon points="79,42 72,40 67,46 74,47" fill="url(#crystalFacet)"/>
      <polygon points="79,58 72,60 67,54 74,53" fill="url(#crystalFacet)"/>
    </g>

    <!-- Kristallgruppe Unten (6 Uhr) nach außen bis y=89 -->
    <g>
      <polygon points="50,89 47,76 50,66 53,76" fill="url(#crystalFacet)" stroke="#2e1065" stroke-width="0.4"/>
      <line x1="50" y1="89" x2="50" y2="66" stroke="#ffffff" stroke-width="0.5"/>
      <polygon points="42,79 40,72 46,67 47,74" fill="url(#crystalFacet)"/>
      <polygon points="58,79 60,72 54,67 53,74" fill="url(#crystalFacet)"/>
    </g>

    <!-- Kristallgruppe Links (9 Uhr) nach außen bis x=11 -->
    <g>
      <polygon points="11,50 24,47 34,50 24,53" fill="url(#crystalFacet)" stroke="#2e1065" stroke-width="0.4"/>
      <line x1="11" y1="50" x2="34" y2="50" stroke="#ffffff" stroke-width="0.5"/>
      <polygon points="21,42 28,40 33,46 26,47" fill="url(#crystalFacet)"/>
      <polygon points="21,58 28,60 33,54 26,53" fill="url(#crystalFacet)"/>
    </g>

    <!-- Diagonale schwebende Minisplitter außen (r=42) -->
    <circle cx="25" cy="25" r="1.2" fill="#e9d5ff"/>
    <circle cx="75" cy="25" r="1.2" fill="#e9d5ff"/>
    <circle cx="75" cy="75" r="1.2" fill="#e9d5ff"/>
    <circle cx="25" cy="75" r="1.2" fill="#e9d5ff"/>
  </g>
</svg>
