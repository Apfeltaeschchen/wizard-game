<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Astral-Amethyst & Äther-Violett -->
    <linearGradient id="amethystShard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="voidAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#c084fc" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#voidAura)">
    <!-- 1. Schlanker Astralreif (r=35.5, stroke 1.5px) -->
    <circle cx="50" cy="50" r="35.5" stroke="#3b0764" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="36.8" stroke="#a855f7" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. WEIT NACH AUSSEN SPRIESSENDE AMETHYST-KRISTALLE & ASTRAL-SPLITTER (r=37 bis r=49) -->
    <!-- Große Kristall-Gruppe Oben (12 Uhr) nach außen bis y=8 -->
    <polygon points="50,10 46,24 50,35 54,24" fill="url(#amethystShard)" stroke="#2e1065" stroke-width="0.4"/>
    <line x1="50" y1="10" x2="50" y2="35" stroke="#ffffff" stroke-width="0.5"/>
    <polygon points="41,18 38,28 44,34 46,26" fill="url(#amethystShard)"/>
    <polygon points="59,18 62,28 56,34 54,26" fill="url(#amethystShard)"/>

    <!-- Kristalle Flanke Rechts nach außen bis x=90 -->
    <polygon points="90,50 76,46 65,50 76,54" fill="url(#amethystShard)" stroke="#2e1065" stroke-width="0.4"/>
    <line x1="90" y1="50" x2="65" y2="50" stroke="#ffffff" stroke-width="0.5"/>
    <polygon points="82,34 72,38 68,44 76,42" fill="url(#amethystShard)"/>
    <polygon points="82,66 72,62 68,56 76,58" fill="url(#amethystShard)"/>

    <!-- Kristalle Unten (6 Uhr) nach außen bis y=90 -->
    <polygon points="50,90 46,76 50,65 54,76" fill="url(#amethystShard)" stroke="#2e1065" stroke-width="0.4"/>
    <line x1="50" y1="90" x2="50" y2="65" stroke="#ffffff" stroke-width="0.5"/>
    <polygon points="41,82 38,72 44,66 46,74" fill="url(#amethystShard)"/>
    <polygon points="59,82 62,72 56,66 54,74" fill="url(#amethystShard)"/>

    <!-- Kristalle Flanke Links nach außen bis x=10 -->
    <polygon points="10,50 24,46 35,50 24,54" fill="url(#amethystShard)" stroke="#2e1065" stroke-width="0.4"/>
    <line x1="10" y1="50" x2="35" y2="50" stroke="#ffffff" stroke-width="0.5"/>
    <polygon points="18,34 28,38 32,44 24,42" fill="url(#amethystShard)"/>
    <polygon points="18,66 28,62 32,56 24,58" fill="url(#amethystShard)"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE FACETTEN-SPITZEN (Greifen nur 2.5px bis r=33) -->
    <polygon points="48.5,35.5 50,33 51.5,35.5" fill="#f5d0fe"/>
    <polygon points="64.5,48.5 67,50 64.5,51.5" fill="#f5d0fe"/>
    <polygon points="48.5,64.5 50,67 51.5,64.5" fill="#f5d0fe"/>
    <polygon points="35.5,48.5 33,50 35.5,51.5" fill="#f5d0fe"/>
  </g>
</svg>
