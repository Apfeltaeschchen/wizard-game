<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Antik-Mondsilber Gradienten -->
    <radialGradient id="silverMoonCrescent" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="90%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>

    <!-- Lebendige Mistelranke -->
    <linearGradient id="livingMistletoeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Schimmernde Perlenbeeren -->
    <radialGradient id="pearlBerryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f1f5f9"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <!-- Kerzenflamme & Wachslicht -->
    <radialGradient id="solsticeCandleGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <filter id="mistletoeRelicShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.5" flood-color="#15803d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#mistletoeRelicShadow)">
    <!-- 1. ASYMMETRISCHE MONDSICHEL & ELFEN-SILBERREIF -->
    <!-- Zarter Grundreif um das Porträt (r=35.5, Stärke 1.4px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#silverMoonCrescent)" stroke-width="1.4"/>
    <circle cx="50" cy="50" r="37.2" stroke="#94a3b8" stroke-width="0.7" stroke-dasharray="2 3"/>

    <!-- Dominante Mondsichel-Spange auf der linken Flanke (schmiegt sich von 7 Uhr bis 1 Uhr) -->
    <!-- Äußerer Sichelbogen (r ~ 42 bis 45) bis zur Zierspitze oben -->
    <path d="M48,12 C30,12 14,26 12,46 C10,64 22,80 40,86 C28,78 20,65 21,48 C22,32 34,18 48,12 Z"
      fill="url(#silverMoonCrescent)" stroke="#1e293b" stroke-width="0.5"/>

    <!-- 2. LEBENDIGE MISTELRANKEN & PERLENBEEREN (organisch rankend um die Sichel) -->
    <!-- Rankenast windet sich von links unten nach oben -->
    <path d="M22,78 C15,68 11,54 13,42 C15,32 24,20 38,15"
      stroke="url(#livingMistletoeGrad)" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Mistelblätter-Paare entlang der Ranke (immer außerhalb r=34.5) -->
    <!-- Blattpaar 1 (ca. 8 Uhr, x=15, y=65) -->
    <path d="M14,64 Q9,62 10,57 Q15,59 15,64 Z" fill="#15803d" stroke="#86efac" stroke-width="0.3"/>
    <path d="M16,66 Q13,71 8,70 Q10,65 15,66 Z" fill="#15803d" stroke="#86efac" stroke-width="0.3"/>
    <!-- Perlenbeere 1 -->
    <circle cx="15.5" cy="62" r="1.5" fill="url(#pearlBerryGrad)" stroke="#475569" stroke-width="0.3"/>

    <!-- Blattpaar 2 (ca. 9 Uhr, x=11, y=48) -->
    <path d="M12,47 Q7,44 8,39 Q13,42 13,47 Z" fill="#16a34a" stroke="#86efac" stroke-width="0.3"/>
    <path d="M12,50 Q6,52 6,57 Q11,54 12,50 Z" fill="#15803d" stroke="#86efac" stroke-width="0.3"/>
    <!-- Perlenbeere 2 & 3 (Cluster) -->
    <circle cx="10" cy="46" r="1.4" fill="url(#pearlBerryGrad)" stroke="#475569" stroke-width="0.3"/>
    <circle cx="8.5" cy="50" r="1.2" fill="url(#pearlBerryGrad)" stroke="#475569" stroke-width="0.3"/>

    <!-- Blattpaar 3 (ca. 10 Uhr, x=20, y=28) -->
    <path d="M20,29 Q15,25 18,20 Q23,24 21,29 Z" fill="#15803d" stroke="#86efac" stroke-width="0.3"/>
    <path d="M23,28 Q26,22 31,23 Q27,27 23,28 Z" fill="#16a34a" stroke="#86efac" stroke-width="0.3"/>
    <!-- Perlenbeere 4 -->
    <circle cx="21" cy="25" r="1.4" fill="url(#pearlBerryGrad)" stroke="#475569" stroke-width="0.3"/>

    <!-- Zarte Mistel-Spitze rechts oben (ca. 1 Uhr) -->
    <path d="M52,12 Q65,13 72,18" stroke="url(#livingMistletoeGrad)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M68,16 Q73,13 77,15 Q72,19 68,16 Z" fill="#15803d" stroke="#86efac" stroke-width="0.3"/>
    <circle cx="71" cy="15" r="1.3" fill="url(#pearlBerryGrad)" stroke="#475569" stroke-width="0.3"/>

    <!-- 3. GEWEIHTE FESTTAGSKERZE AUF SILBER-KONSOLE (auf 5 Uhr, ca. x=76, y=72) -->
    <g transform="translate(76, 70)">
      <!-- Antike silberne Kerzenteller-Konsole -->
      <path d="M-5,10 C-3,8 3,8 5,10 C2,12 -2,12 -5,10 Z" fill="url(#silverMoonCrescent)" stroke="#1e293b" stroke-width="0.4"/>
      <path d="M-1,10 L-2,14 L2,14 L1,10 Z" fill="#475569" stroke="#1e293b" stroke-width="0.3"/>

      <!-- Elfenbeinfarbener Kerzenkörper -->
      <rect x="-2" y="2" width="4" height="8" rx="0.8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.4"/>
      <!-- Kerzendocht -->
      <line x1="0" y1="2" x2="0" y2="-0.5" stroke="#1e293b" stroke-width="0.5"/>

      <!-- Lebendig flackernde Kerzenflamme (Dauer-Mikro-Animation) -->
      <g id="candleFlameGlowGroup">
        <path d="M0,-6 C-1.8,-4 -1.8,-1.8 0,-1 C1.8,-1.8 1.8,-4 0,-6 Z"
          fill="url(#solsticeCandleGlow)" stroke="#ea580c" stroke-width="0.3"/>
        <circle cx="0" cy="-2.5" r="0.7" fill="#ffffff"/>

        <!-- Dauer-Mikro-Flackern: Sanfte Größen- & Neigungsschwankung -->
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1.08 1.15; 0.92 0.95; 1.12 1.2; 0.96 0.98; 1 1"
          keyTimes="0; 0.2; 0.4; 0.6; 0.8; 1" dur="1.8s" repeatCount="indefinite"/>
      </g>

      <!-- Warmes Kerzenschein-Aura-Leuchten -->
      <circle cx="0" cy="-3" r="5" fill="#fef08a" opacity="0.25">
        <animate attributeName="opacity" values="0.2; 0.45; 0.22; 0.4; 0.2" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4.5; 5.8; 4.8; 5.5; 4.5" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 4. PERIODISCHER HIGHLIGHT-PEAK (7.0s Zyklus): SILBERNER LICHTLAUF & BEEREN-GLIMMEN -->
    <!-- Lichtpuls 1 auf Perlenbeere bei 8 Uhr -->
    <circle cx="15.5" cy="62" r="2.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0.8; 0; 0"
        keyTimes="0; 0.45; 0.49; 0.53; 0.58; 0.65; 1" dur="7.0s" repeatCount="indefinite"/>
    </circle>
    <!-- Lichtpuls 2 auf Perlenbeeren-Cluster bei 9 Uhr -->
    <circle cx="10" cy="46" r="2.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0.8; 0; 0"
        keyTimes="0; 0.48; 0.52; 0.56; 0.61; 0.68; 1" dur="7.0s" repeatCount="indefinite"/>
    </circle>
    <!-- Lichtpuls 3 auf Perlenbeere bei 10 Uhr -->
    <circle cx="21" cy="25" r="2.8" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0.8; 0; 0"
        keyTimes="0; 0.51; 0.55; 0.59; 0.64; 0.71; 1" dur="7.0s" repeatCount="indefinite"/>
    </circle>

    <!-- Silbriger Glanzstreif über die Mondsichel -->
    <path d="M20,40 Q15,48 20,56" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.9; 0.3; 0; 0"
        keyTimes="0; 0.46; 0.52; 0.60; 0.66; 1" dur="7.0s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
