<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Tannengrün & Antik-Silber Gradienten -->
    <radialGradient id="mistletoeRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="mistletoeVine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#15803d"/>
      <stop offset="80%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="pearlBerry" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <radialGradient id="candleFlameGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <filter id="mistletoeRelicShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.5" flood-color="#15803d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#mistletoeRelicShadow)">
    <!-- 1. Antiker Silber-Ring (r=35.5, stroke 1.8px) & Nadel-Dotted Accent -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#mistletoeRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#4ade80" stroke-width="0.8" stroke-dasharray="3 2"/>

    <!-- 2. Verschlungene Mistel-Ranken Flanke Links (streng maxR <= 43.8) -->
    <g stroke="url(#mistletoeVine)" stroke-linecap="round" fill="none">
      <path d="M19,34 C14,30 11,36 9,42 C13,43 14,48 11,54 C14,56 17,61 19,67" stroke-width="1.3"/>
      <!-- Mistelblätter Links -->
      <path d="M12,38 Q9,35 13,33 Q16,36 12,38 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <path d="M10,49 Q7,46 11,44 Q14,47 10,49 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <!-- Perlenbeere links -->
      <circle cx="11" cy="42" r="1.3" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
      <circle cx="13" cy="53" r="1.1" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
    </g>

    <!-- Verschlungene Mistel-Ranken Flanke Rechts (streng maxR <= 43.8) -->
    <g stroke="url(#mistletoeVine)" stroke-linecap="round" fill="none">
      <path d="M81,34 C86,30 89,36 91,42 C87,43 86,48 89,54 C86,56 83,61 81,67" stroke-width="1.3"/>
      <!-- Mistelblätter Rechts -->
      <path d="M88,38 Q91,35 87,33 Q84,36 88,38 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <path d="M90,49 Q93,46 89,44 Q86,47 90,49 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <!-- Perlenbeere rechts -->
      <circle cx="89" cy="42" r="1.3" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
      <circle cx="87" cy="53" r="1.1" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
    </g>

    <!-- 3. Unten: Gotische Wurzel-Klammer mit Rubin-Auge (y=83 bis y=91) -->
    <polygon points="50,91 46,83 54,83" fill="#022c22" stroke="#4ade80" stroke-width="0.6"/>
    <circle cx="50" cy="85.5" r="1.2" fill="#ef4444"/>
    <circle cx="50" cy="85.5" r="0.4" fill="#ffffff"/>

    <!-- 4. Oben: Geweihte Festtagskerze auf Messing-Halter mit lebendigem Flackern alle 7.0s (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Messing-Leuchterfuss / Mistelschleife -->
      <path d="M-3,3.5 C-1.5,2 1.5,2 3,3.5 Z" fill="#b45309" stroke="#f59e0b" stroke-width="0.4"/>
      <!-- Kerzenkörper (Wachs elfenbein) -->
      <rect x="-1.2" y="-0.5" width="2.4" height="4" rx="0.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.3"/>
      <!-- Kerzendocht -->
      <line x1="0" y1="-0.5" x2="0" y2="-1.8" stroke="#1e293b" stroke-width="0.4"/>

      <!-- Kerzenflamme mit sanftem Doppel-Flackern alle 7.0s -->
      <g>
        <path d="M0,-5 C-1.2,-3.5 -1.2,-2 0,-1.6 C1.2,-2 1.2,-3.5 0,-5 Z" fill="url(#candleFlameGlow)" stroke="#ea580c" stroke-width="0.2"/>
        <circle cx="0" cy="-2.5" r="0.6" fill="#ffffff"/>

        <!-- Sanftes lebendiges Flackern -->
        <animateTransform attributeName="transform" type="scale"
          values="1 1; 1 1; 1.25 1.3; 0.85 0.9; 1.15 1.2; 1 1; 1 1"
          keyTimes="0; 0.45; 0.50; 0.54; 0.58; 0.64; 1"
          dur="7.0s" repeatCount="indefinite"/>
      </g>

      <!-- Periodischer Schimmer auf den Perlenbeeren -->
      <circle cx="0" cy="-2.5" r="2.8" fill="#fef08a" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.5; 0.1; 0.4; 0; 0"
          keyTimes="0; 0.45; 0.50; 0.54; 0.58; 0.64; 1" dur="7.0s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
