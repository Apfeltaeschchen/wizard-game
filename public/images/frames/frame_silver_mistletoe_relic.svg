<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Tannengrün & Antik-Silber Gradienten -->
    <radialGradient id="mistletoeRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="mistletoeVine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#15803d"/>
      <stop offset="80%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="pearlBerry" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="mistletoeRelicShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.5" flood-color="#15803d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#mistletoeRelicShadow)">
    <!-- 1. Antiker Silber-Ring (r=35.5, stroke 1.8px) & Nadel-Dotted Accent -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#mistletoeRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#4ade80" stroke-width="0.8" stroke-dasharray="3 2"/>

    <!-- 2. Verschlungene Mistel-Ranken Flanke Links -->
    <g stroke="url(#mistletoeVine)" stroke-linecap="round" fill="none">
      <path d="M19,34 C13,29 9,35 8,42 C12,43 14,48 10,54 C13,56 17,61 19,67" stroke-width="1.3"/>
      <!-- Mistelblätter Links -->
      <path d="M11,38 Q8,35 12,33 Q15,36 11,38 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <path d="M9,49 Q6,46 10,44 Q13,47 9,49 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <!-- Perlenbeere links -->
      <circle cx="10" cy="42" r="1.3" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
      <circle cx="12" cy="53" r="1.1" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
    </g>

    <!-- Verschlungene Mistel-Ranken Flanke Rechts -->
    <g stroke="url(#mistletoeVine)" stroke-linecap="round" fill="none">
      <path d="M81,34 C87,29 91,35 92,42 C88,43 86,48 90,54 C87,56 83,61 81,67" stroke-width="1.3"/>
      <!-- Mistelblätter Rechts -->
      <path d="M89,38 Q92,35 88,33 Q85,36 89,38 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <path d="M91,49 Q94,46 90,44 Q87,47 91,49 Z" fill="#15803d" stroke="#4ade80" stroke-width="0.4"/>
      <!-- Perlenbeere rechts -->
      <circle cx="90" cy="42" r="1.3" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
      <circle cx="88" cy="53" r="1.1" fill="url(#pearlBerry)" stroke="#475569" stroke-width="0.3"/>
    </g>

    <!-- 3. Unten: Gotische Wurzel-Klammer mit Rubin-Auge (y=83 bis y=91) -->
    <polygon points="50,91 46,83 54,83" fill="#022c22" stroke="#4ade80" stroke-width="0.6"/>
    <circle cx="50" cy="85.5" r="1.2" fill="#ef4444"/>
    <circle cx="50" cy="85.5" r="0.4" fill="#ffffff"/>

    <!-- 4. Oben: Antike silberne Festtags-Glocke mit sanftem Schwung alle 7.5s (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Zarte Mistel-Schleife über Glocke -->
      <path d="M-3,-3.5 C-1.5,-4.5 1.5,-4.5 3,-3.5 C1.5,-2.5 -1.5,-2.5 -3,-3.5 Z" fill="#991b1b" stroke="#f87171" stroke-width="0.4"/>
      
      <!-- Schwingende Glocke -->
      <g>
        <path d="M-2.5,-2 C-2.5,-3 2.5,-3 2.5,-2 C2.5,0.5 4,2 4.5,3 L-4.5,3 C-4,2 -2.5,0.5 -2.5,-2 Z" fill="#e2e8f0" stroke="#475569" stroke-width="0.4"/>
        <line x1="-4.5" y1="3" x2="4.5" y2="3" stroke="#cbd5e1" stroke-width="0.6"/>
        <!-- Klöppel -->
        <circle cx="0" cy="3.8" r="0.8" fill="#f59e0b"/>
        
        <animateTransform attributeName="transform" type="rotate"
          values="0 0,-3; 14 0,-3; -14 0,-3; 8 0,-3; -8 0,-3; 0 0,-3; 0 0,-3"
          keyTimes="0; 0.05; 0.10; 0.15; 0.20; 0.25; 1"
          dur="7.5s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>