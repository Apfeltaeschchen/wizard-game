<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pumpkinVineRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291205"/>
    </linearGradient>
    <radialGradient id="miniPumpkinHead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <filter id="pumpkinCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f97316" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#pumpkinCalmShadow)">
    <!-- 1. Schlanker Brombeer-Wurzelreif (r=35.5, stroke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#pumpkinVineRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. PLASTISCHE WURZELN (Fassung bei r=33.0 mit subtiler 3D-Tiefe, Ranken nach außen bis r=42.0) -->
    <path d="M83,48 Q88,46 92,50 Q88,54 83,52 Z" fill="url(#pumpkinVineRing)"/>
    <path d="M47,83 Q45,88 50,92 Q55,88 53,83 Z" fill="url(#pumpkinVineRing)"/>
    <path d="M17,48 Q12,46 8,50 Q12,54 17,52 Z" fill="url(#pumpkinVineRing)"/>

    <!-- 3. KLEINER SCHNITZKÜRBIS SITZT FREI OBEN AUF DEM REIF (y=8 bis y=14) -->
    <g transform="translate(50, 12)">
      <ellipse cx="0" cy="0" rx="4.2" ry="3.5" fill="url(#miniPumpkinHead)" stroke="#451a03" stroke-width="0.4"/>
      <!-- Stiel -->
      <path d="M-0.6,-3.5 Q-1.2,-5 0.6,-4.5 L0,-3.5 Z" fill="#65a30d"/>
      <!-- Schnitzaugen -->
      <polygon points="-1.6,-0.8 -1.0,0.3 -2.3,0.3" fill="#fef08a"/>
      <polygon points="1.6,-0.8 2.3,0.3 1.0,0.3" fill="#fef08a"/>
      <!-- Mund -->
      <path d="M-2.0,1.4 L-1.4,2.0 L-0.7,1.4 L0,2.0 L0.7,1.4 L1.4,2.0 L2.0,1.4" stroke="#451a03" stroke-width="0.4"/>

      <!-- PERIODISCHES KERZENLICHT-FLACKERN IN DEN AUGEN (alle 8s) -->
      <circle cx="-1.6" cy="0" r="1.0" fill="#fffbeb" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.9; 0.2; 0.9; 0" keyTimes="0; 0.5; 0.52; 0.54; 0.56; 1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1.6" cy="0" r="1.0" fill="#fffbeb" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.9; 0.2; 0.9; 0" keyTimes="0; 0.5; 0.52; 0.54; 0.56; 1" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
