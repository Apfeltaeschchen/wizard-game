<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pumpkinVineRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291205"/>
    </linearGradient>
    <radialGradient id="miniPumpkinHead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <filter id="pumpkinCalmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f97316" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#pumpkinCalmShadow)">
    <!-- 1. Schlanker Brombeer-Wurzelreif (r=35.5, stroke 1.8px - Innenbereich r < 34.5 vollkommen frei!) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#pumpkinVineRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="4 2"/>

    <!-- 2. ZARTE WURZELN NUR AUSSEN (r=36 bis r=46) -->
    <path d="M66,48 Q76,46 86,50 Q76,54 66,52 Z" fill="url(#pumpkinVineRing)"/>
    <path d="M47,66 Q45,78 50,86 Q55,78 53,66 Z" fill="url(#pumpkinVineRing)"/>
    <path d="M34,48 Q24,46 14,50 Q24,54 34,52 Z" fill="url(#pumpkinVineRing)"/>

    <!-- 3. KLEINER SCHNITZKÜRBIS SITZT FREI OBEN AUF DEM REIF (y=4 bis y=14) -->
    <g transform="translate(50, 9)">
      <ellipse cx="0" cy="0" rx="6" ry="5" fill="url(#miniPumpkinHead)" stroke="#451a03" stroke-width="0.4"/>
      <!-- Stiel -->
      <path d="-1,-5 Q-2,-8 1,-7 L0,-5 Z" fill="#65a30d"/>
      <!-- Schnitzaugen -->
      <polygon points="-2.5,-1 -1.5,0.5 -3.5,0.5" fill="#fef08a"/>
      <polygon points="2.5,-1 3.5,0.5 1.5,0.5" fill="#fef08a"/>
      <!-- Mund -->
      <path d="-3,2 L-2,3 L-1,2 L0,3 L1,2 L2,3 L3,2" stroke="#451a03" stroke-width="0.5"/>

      <!-- PERIODISCHES KERZENLICHT-FLACKERN IN DEN AUGEN (alle 8s) -->
      <circle cx="-2.5" cy="0" r="1.5" fill="#fffbeb" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.9; 0.2; 0.9; 0" keyTimes="0; 0.5; 0.52; 0.54; 0.56; 1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="2.5" cy="0" r="1.5" fill="#fffbeb" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.9; 0.2; 0.9; 0" keyTimes="0; 0.5; 0.52; 0.54; 0.56; 1" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
