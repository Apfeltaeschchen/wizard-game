<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Knorriges Herbstholz & Kürbisfeuer -->
    <linearGradient id="briarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291205"/>
    </linearGradient>
    <radialGradient id="pumpkinLantern" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <filter id="pumpkinAura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f97316" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#pumpkinAura)">
    <!-- 1. Knorriger Rankenfaden (r=35.5, stroke 1.5px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#briarGrad)" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="36.8" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="5 2"/>

    <!-- 2. WEIT NACH AUSSEN KLETTERNDE DORNENWURZELN & KÜRBISKOPF (r=37 bis r=49) -->
    <!-- Kürbiskopf Oben (12 Uhr) sitzt frei auf dem Reif nach außen bis y=12 -->
    <path d="M40,24 C40,14 45,13 50,14 C55,13 60,14 60,24 C60,32 56,35 50,35 C44,35 40,32 40,24 Z" fill="url(#pumpkinLantern)" stroke="#451a03" stroke-width="0.6"/>
    <!-- Kürbisstiel grün -->
    <path d="M49,14 Q48,9 52,10 L51,14 Z" fill="#65a30d"/>
    <!-- Schnitzfratze -->
    <polygon points="45,21 47,23 43,23" fill="#fef08a"/>
    <polygon points="55,21 57,23 53,23" fill="#fef08a"/>
    <path d="M44,27 L46,29 L48,27 L50,29 L52,27 L54,29 L56,27" stroke="#fef08a" stroke-width="0.7"/>

    <!-- Knorrige Wurzeln Flanke Rechts nach außen bis x=88 -->
    <path d="M68,34 Q78,26 86,22 Q78,32 72,38 Z" fill="url(#briarGrad)"/>
    <path d="M72,48 Q82,46 88,50 Q80,54 72,52 Z" fill="url(#briarGrad)"/>
    <path d="M68,66 Q78,74 86,80 Q78,70 72,62 Z" fill="url(#briarGrad)"/>

    <!-- Wurzeln Unten (6 Uhr) nach außen bis y=88 -->
    <path d="M47,65 Q44,78 50,88 Q56,78 53,65 Z" fill="url(#briarGrad)"/>
    <polygon points="50,88 47,80 53,80" fill="#ea580c"/>

    <!-- Knorrige Wurzeln Flanke Links nach außen bis x=12 -->
    <path d="M32,34 Q22,26 14,22 Q22,32 28,38 Z" fill="url(#briarGrad)"/>
    <path d="M28,48 Q18,46 12,50 Q20,54 28,52 Z" fill="url(#briarGrad)"/>
    <path d="M32,66 Q22,74 14,80 Q22,70 28,62 Z" fill="url(#briarGrad)"/>

    <!-- 3. SUBTIL NACH INNEN RAGENDE DORNENSPITZEN (Greifen nur 2.5px bis r=33) -->
    <polygon points="48.5,64.5 50,67.2 51.5,64.5" fill="#f97316"/>
    <polygon points="64.5,48.5 67.2,50 64.5,51.5" fill="#f97316"/>
    <polygon points="35.5,48.5 32.8,50 35.5,51.5" fill="#f97316"/>
  </g>
</svg>
