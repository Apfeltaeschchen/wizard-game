<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Verwittertes Friedhofs-Wurzelholz Gradient -->
    <radialGradient id="gnarledRootWood" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="35%" stop-color="#451a03"/>
      <stop offset="70%" stop-color="#29180c"/>
      <stop offset="100%" stop-color="#0f0702"/>
    </radialGradient>

    <!-- Sattes Jack-o'-Lantern Kürbis-Orange -->
    <radialGradient id="jackPumpkinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="65%" stop-color="#ea580c"/>
      <stop offset="90%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>

    <!-- Unheimliche Kürbis-Kerzenglut -->
    <radialGradient id="pumpkinCandleFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

    <filter id="pumpkinLanternShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.5" flood-color="#ea580c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#pumpkinLanternShadow)">
    <!-- 1. KNORRIGER WURZELKRANZ (r=35.5, Stärke 2.0px) & DORNENÄSTE -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#gnarledRootWood)" stroke-width="2"/>
    <circle cx="50" cy="50" r="37.2" stroke="#ea580c" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. BASIS (6 Uhr): GROSSER GESCHNITZTER JACK-O'-LANTERN (y=80 bis 96) -->
    <g transform="translate(50, 88)">
      <!-- Kürbiskörper gerippt -->
      <ellipse cx="0" cy="0" rx="9" ry="7" fill="url(#jackPumpkinGrad)" stroke="#431407" stroke-width="0.5"/>
      <ellipse cx="-4" cy="0" rx="3.5" ry="6.5" fill="none" stroke="#9a3412" stroke-width="0.4"/>
      <ellipse cx="4" cy="0" rx="3.5" ry="6.5" fill="none" stroke="#9a3412" stroke-width="0.4"/>
      <!-- Grüner Kürbisstiel oben -->
      <path d="M-1,-7 C-1.5,-9 1,-10 1.5,-8 L0.5,-7 Z" fill="#15803d" stroke="#052e16" stroke-width="0.3"/>

      <!-- Geschnitztes diabolisch grinsendes Gesicht -->
      <!-- Dreieckige Augen -->
      <polygon points="-4,-2 -2,-4 -2,-1" fill="url(#pumpkinCandleFire)"/>
      <polygon points="4,-2 2,-4 2,-1" fill="url(#pumpkinCandleFire)"/>
      <!-- Dreieckige Nase -->
      <polygon points="0,-1 -1,1 1,1" fill="url(#pumpkinCandleFire)"/>
      <!-- Gezackter lachender Mund -->
      <polygon points="-6,2 -4,4 -2,2 0,4 2,2 4,4 6,2 4,5 -4,5" fill="url(#pumpkinCandleFire)"/>
    </g>

    <!-- 3. ZWEI KLEINERE KÜRBISSE AN DEN FLANKEN (9 Uhr und 3 Uhr) -->
    <!-- Kürbis Links (9 Uhr, ca. x=13, y=50) -->
    <g transform="translate(13, 50) rotate(-15)">
      <ellipse cx="0" cy="0" rx="4.5" ry="5.5" fill="url(#jackPumpkinGrad)" stroke="#431407" stroke-width="0.4"/>
      <polygon points="-1,-2 1,-2 0,-4" fill="url(#pumpkinCandleFire)"/>
      <polygon points="-2,1 2,1 0,3" fill="url(#pumpkinCandleFire)"/>
    </g>
    <!-- Kürbis Rechts (3 Uhr, ca. x=87, y=50) -->
    <g transform="translate(87, 50) rotate(15)">
      <ellipse cx="0" cy="0" rx="4.5" ry="5.5" fill="url(#jackPumpkinGrad)" stroke="#431407" stroke-width="0.4"/>
      <polygon points="-1,-2 1,-2 0,-4" fill="url(#pumpkinCandleFire)"/>
      <polygon points="-2,1 2,1 0,3" fill="url(#pumpkinCandleFire)"/>
    </g>

    <!-- 4. APEX (12 Uhr): VERKNOTETE KÜRBISRANKE & BLATT (y=6 bis 16) -->
    <path d="M46,16 C44,9 50,6 54,10 C56,12 52,14 48,16" stroke="#15803d" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M54,10 Q58,6 61,8 Q58,12 54,10 Z" fill="#16a34a" stroke="#052e16" stroke-width="0.3"/>

    <!-- 5. HYBRID-ANIMATION (6.5s Zyklus) -->
    <!-- A) Dauer-Mikro: Lebendig flackernde Kerzenglut in den Kürbissen -->
    <circle cx="50" cy="88" r="5" fill="#fef08a" opacity="0.3">
      <animate attributeName="opacity" values="0.25; 0.7; 0.3; 0.65; 0.25" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 6.5s): Diabolisches Aufleuchten & Geisterfeuer-Dampf -->
    <!-- Magisches Aufleuchten des Hauptkürbisses -->
    <circle cx="50" cy="88" r="7" fill="#ffffff" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0.85; 0; 0"
        keyTimes="0; 0.40; 0.45; 0.50; 0.55; 0.62; 1" dur="6.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Aufsteigender Geisterdampf an den Flanken -->
    <circle cx="13" cy="45" r="1.5" fill="#86efac" opacity="0">
      <animate attributeName="cy" values="45; 45; 35; 28; 45"
        keyTimes="0; 0.42; 0.50; 0.58; 1" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 0.8; 0; 0"
        keyTimes="0; 0.42; 0.48; 0.58; 1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="87" cy="45" r="1.5" fill="#86efac" opacity="0">
      <animate attributeName="cy" values="45; 45; 35; 28; 45"
        keyTimes="0; 0.44; 0.52; 0.60; 1" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0; 0.8; 0; 0"
        keyTimes="0; 0.44; 0.50; 0.60; 1" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
