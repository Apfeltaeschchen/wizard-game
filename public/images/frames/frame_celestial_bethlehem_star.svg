<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Himmlisches Lichtgold & Perlmutt Gradienten -->
    <radialGradient id="bethlehemGoldRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="65%" stop-color="#ca8a04"/>
      <stop offset="90%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#3a2203"/>
    </radialGradient>
    <linearGradient id="angelWingFiligree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="starBethlehemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef9c3"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <filter id="bethlehemShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.8" flood-color="#eab308" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#bethlehemShadow)">
    <!-- 1. Erhabener Gold-Zierring (r=35.5, stroke 1.8px) & Arkane Sonnen-Punkte -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#bethlehemGoldRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#fde047" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- 2. Barocke Engelsflügel-Bögen Flanke Links (streng maxR <= 43.8) -->
    <g stroke="url(#angelWingFiligree)" stroke-linecap="round" fill="none">
      <path d="M19,34 C14,29 10,35 8,41 C12,42 14,47 10,53 C14,55 17,60 19,67" stroke-width="1.3"/>
      <!-- Filigranes goldenes Maßwerk & Lilien -->
      <path d="M16,36 C11,40 12,46 15,50" stroke-width="0.7" stroke="#ffffff"/>
      <path d="M14,44 C11,48 12,52 15,56" stroke-width="0.6" stroke="#fef08a"/>
      <polygon points="8,41 12,42 11,38" fill="#fef08a" stroke="none"/>
      <polygon points="10,53 14,54 12,50" fill="#fef08a" stroke="none"/>
    </g>

    <!-- Barocke Engelsflügel-Bögen Flanke Rechts (streng maxR <= 43.8) -->
    <g stroke="url(#angelWingFiligree)" stroke-linecap="round" fill="none">
      <path d="M81,34 C86,29 90,35 92,41 C88,42 86,47 90,53 C86,55 83,60 81,67" stroke-width="1.3"/>
      <!-- Filigranes goldenes Maßwerk & Lilien -->
      <path d="M84,36 C89,40 88,46 85,50" stroke-width="0.7" stroke="#ffffff"/>
      <path d="M86,44 C89,48 88,52 85,56" stroke-width="0.6" stroke="#fef08a"/>
      <polygon points="92,41 88,42 89,38" fill="#fef08a" stroke="none"/>
      <polygon points="90,53 86,54 88,50" fill="#fef08a" stroke="none"/>
    </g>

    <!-- 3. Unten: Barocker Dreipass mit hängendem Perlmutt-Tropfen (y=83 bis y=91) -->
    <polygon points="50,91 46,83 54,83" fill="#3a2203" stroke="#facc15" stroke-width="0.6"/>
    <!-- Glänzendes Lilien-Juwel -->
    <circle cx="50" cy="85.5" r="1.2" fill="#ffffff" stroke="#eab308" stroke-width="0.3"/>
    <circle cx="50" cy="85.5" r="0.4" fill="#fef08a"/>

    <!-- 4. Oben: Majestätischer 8-zackiger Stern von Bethlehem mit Lichtausbruch alle 6s (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Goldene Heiligenschein-Aura im Hintergrund -->
      <circle cx="0" cy="0" r="3.2" stroke="url(#bethlehemGoldRing)" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>

      <!-- 8-zackiger Weihnachtsstern Silhouette -->
      <!-- Lange Hauptstrahlen (Kreuz) -->
      <polygon points="0,-4.8 0.7,-0.7 4.8,0 0.7,0.7 0,4.8 -0.7,0.7 -4.8,0 -0.7,-0.7" fill="url(#starBethlehemAura)" stroke="#713f12" stroke-width="0.3"/>
      <!-- Diagonale Nebenstrahlen -->
      <polygon points="0,-2.5 1.8,-1.8 2.5,0 1.8,1.8 0,2.5 -1.8,1.8 -2.5,0 -1.8,-1.8" fill="#ffffff" opacity="0.85"/>
      <!-- Zentrales Lichtauge -->
      <circle cx="0" cy="0" r="0.8" fill="#ffffff"/>

      <!-- Periodischer himmlischer Lichtausbruch alle 6.0s -->
      <g>
        <path d="M0,-5 L0.8,-0.8 L5,0 L0.8,0.8 L0,5 L-0.8,0.8 L-5,0 L-0.8,-0.8 Z" fill="#ffffff" opacity="0">
          <animate attributeName="opacity" values="0; 0; 0.95; 0.2; 0.85; 0; 0"
            keyTimes="0; 0.45; 0.50; 0.54; 0.58; 0.64; 1" dur="6.0s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="scale"
            values="0.6; 0.6; 1.4; 0.9; 1.35; 0.6; 0.6"
            keyTimes="0; 0.45; 0.50; 0.54; 0.58; 0.64; 1" dur="6.0s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
