<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Göttliches Sakralgold Gradienten -->
    <radialGradient id="bethlehemDivineGold" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="95%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#3a2203"/>
    </radialGradient>

    <!-- Himmlische Seraphim-Schwingen -->
    <linearGradient id="angelWingFeathers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef9c3"/>
      <stop offset="65%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Supernova-Zentrum & Strahlenaura -->
    <radialGradient id="starBethlehemAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef9c3"/>
      <stop offset="65%" stop-color="#fde047"/>
      <stop offset="90%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>

    <filter id="bethlehemShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="3.0" flood-color="#eab308" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#bethlehemShadow)">
    <!-- 1. SAKRALER SONNENREIF MIT ASTRAL-RUNEN (r=35.5, Stärke 1.8px) -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#bethlehemDivineGold)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.4" stroke="#fde047" stroke-width="0.8" stroke-dasharray="2 3"/>

    <!-- 12 feine Sonnenstrahl-Spitzen rund um den Reif (dezent bis r=41) -->
    <g stroke="url(#bethlehemDivineGold)" stroke-width="0.6" stroke-linecap="round">
      <line x1="50" y1="14.5" x2="50" y2="12.5"/>
      <line x1="68" y1="19.5" x2="69" y2="17.8"/>
      <line x1="80.5" y1="32" x2="82.2" y2="31"/>
      <line x1="85.5" y1="50" x2="87.5" y2="50"/>
      <line x1="80.5" y1="68" x2="82.2" y2="69"/>
      <line x1="68" y1="80.5" x2="69" y2="82.2"/>
      <line x1="50" y1="85.5" x2="50" y2="87.5"/>
      <line x1="32" y1="80.5" x2="31" y2="82.2"/>
      <line x1="19.5" y1="68" x2="17.8" y2="69"/>
      <line x1="14.5" y1="50" x2="12.5" y2="50"/>
      <line x1="19.5" y1="32" x2="17.8" y2="31"/>
      <line x1="32" y1="19.5" x2="31" y2="17.8"/>
    </g>

    <!-- 2. BASIS (6 Uhr): BAROCKER WOLKEN-ALTAR & PERLMUTT-RELIQUIE (y=82 bis 95) -->
    <!-- Sakraler Wolken-/Engelsaltar geschwungen -->
    <path d="M38,88 C42,84 46,84 50,87 C54,84 58,84 62,88 C58,94 42,94 38,88 Z"
      fill="url(#bethlehemDivineGold)" stroke="#713f12" stroke-width="0.5"/>
    <circle cx="50" cy="89" r="1.6" fill="#ffffff" stroke="#eab308" stroke-width="0.4"/>
    <circle cx="50" cy="89" r="0.6" fill="#fde047"/>

    <!-- 3. FLANKEN: AUFFÄCHERNDE ENGELSFLÜGEL (Ruhen behütend eingeklappt, fächern sich alle 6s auf!) -->
    <!-- Linker Flügel (Drehpunkt bei Basis x=36, y=82) -->
    <g id="leftAngelWing" transform="translate(36, 82)">
      <g>
        <!-- Flügel fächert sich alle 6s majestätisch nach oben/außen auf (Rotation von 0° auf -11°) -->
        <animateTransform attributeName="transform" type="rotate"
          values="0; 0; -11; -12; -9; 0; 0"
          keyTimes="0; 0.44; 0.50; 0.54; 0.60; 0.68; 1" dur="6.0s" repeatCount="indefinite"/>

        <!-- Dreistufig gefiederte Engelsflügel-Schwinge links -->
        <!-- Äußere Hauptschwungfeder (schmiegt sich von y=82 bis y=18 außen um r=35.5) -->
        <path d="M0,0 C-14,-4 -22,-16 -22,-32 C-22,-44 -14,-56 0,-64 C-28,-57 -32,-42 -31,-32 C-30,-17 -22,-7 0,0 Z"
          fill="url(#angelWingFeathers)" stroke="#713f12" stroke-width="0.4"/>
        <!-- Mittlere Schwungfeder -->
        <path d="M0,-2 C-12,-8 -18,-20 -18,-32 C-18,-42 -12,-50 0,-56 C-22,-50 -26,-38 -25,-30 C-24,-18 -16,-8 0,-2 Z"
          fill="#ffffff" stroke="#ca8a04" stroke-width="0.3"/>
        <!-- Innere Daunenfeder -->
        <path d="M0,-4 C-8,-12 -14,-22 -14,-32 C-14,-40 -8,-46 0,-50 C-16,-44 -18,-34 -17,-28 C-16,-18 -10,-10 0,-4 Z"
          fill="#fef9c3" stroke="#eab308" stroke-width="0.3"/>
      </g>
    </g>

    <!-- Rechter Flügel (Drehpunkt bei Basis x=64, y=82) -->
    <g id="rightAngelWing" transform="translate(64, 82)">
      <g>
        <!-- Flügel fächert sich synchron auf (Rotation von 0° auf +11°) -->
        <animateTransform attributeName="transform" type="rotate"
          values="0; 0; 11; 12; 9; 0; 0"
          keyTimes="0; 0.44; 0.50; 0.54; 0.60; 0.68; 1" dur="6.0s" repeatCount="indefinite"/>

        <!-- Dreistufig gefiederte Engelsflügel-Schwinge rechts -->
        <!-- Äußere Hauptschwungfeder -->
        <path d="M0,0 C14,-4 22,-16 22,-32 C22,-44 14,-56 0,-64 C28,-57 32,-42 31,-32 C30,-17 22,-7 0,0 Z"
          fill="url(#angelWingFeathers)" stroke="#713f12" stroke-width="0.4"/>
        <!-- Mittlere Schwungfeder -->
        <path d="M0,-2 C12,-8 18,-20 18,-32 C18,-42 12,-50 0,-56 C22,-50 26,-38 25,-30 C24,-18 16,-8 0,-2 Z"
          fill="#ffffff" stroke="#ca8a04" stroke-width="0.3"/>
        <!-- Innere Daunenfeder -->
        <path d="M0,-4 C8,-12 14,-22 14,-32 C14,-40 8,-46 0,-50 C16,-44 18,-34 17,-28 C17,-18 10,-10 0,-4 Z"
          fill="#fef9c3" stroke="#eab308" stroke-width="0.3"/>
      </g>
    </g>

    <!-- 4. APEX (12 Uhr): MONUMENTALER 8-ZACKIGER STERN VON BETHLEHEM (y=2 bis 16) -->
    <g transform="translate(50, 10)">
      <!-- Sakrale Heiligenschein-Aura hinter dem Stern -->
      <circle cx="0" cy="0" r="4.2" stroke="url(#bethlehemDivineGold)" stroke-width="0.6" stroke-dasharray="1.5 1.5"/>

      <!-- 8-zackiger Weihnachtsstern Silhouette -->
      <!-- Vertikale & Horizontale Hauptstrahlen (reichen bis y=2 empor) -->
      <polygon points="0,-7 0.9,-1 6.5,0 0.9,1 0,6.5 -0.9,1 -6.5,0 -0.9,-1"
        fill="url(#starBethlehemAura)" stroke="#713f12" stroke-width="0.3"/>
      <!-- Diagonale Nebenstrahlen -->
      <polygon points="0,-3.5 2.5,-2.5 3.5,0 2.5,2.5 0,3.5 -2.5,2.5 -3.5,0 -2.5,-2.5"
        fill="#ffffff" opacity="0.9"/>
      <!-- Zentrales Lichtauge -->
      <circle cx="0" cy="0" r="1.1" fill="#ffffff"/>
      <circle cx="0" cy="0" r="0.4" fill="#fde047"/>
    </g>

    <!-- 5. HYBRID-ANIMATION (6.0s Zyklus) -->
    <!-- A) Dauer-Mikro: Sanftes Atmen der Flügel-Aura & schwebender Sternenstaub -->
    <!-- Aura-Atmung am Stern -->
    <circle cx="50" cy="10" r="3.2" fill="#ffffff" opacity="0.25">
      <animate attributeName="opacity" values="0.25; 0.65; 0.3; 0.7; 0.25" dur="6.0s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.0; 4.2; 3.2; 4.0; 3.0" dur="6.0s" repeatCount="indefinite"/>
    </circle>
    <!-- Schwebender Sternenstaub links -->
    <circle cx="32" cy="45" r="0.6" fill="#fde047" opacity="0.4">
      <animate attributeName="cy" values="45; 41; 45" dur="3.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="3.0s" repeatCount="indefinite"/>
    </circle>
    <!-- Schwebender Sternenstaub rechts -->
    <circle cx="68" cy="48" r="0.6" fill="#fde047" opacity="0.4">
      <animate attributeName="cy" values="48; 44; 48" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2; 0.75; 0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- B) Periodischer Peak (alle 6s): GEWALTIGER HIMMLISCHER LICHTAUSBRUCH (Supernova-Lensflare) -->
    <!-- Synchron zum Auffächern der Flügel -->
    <g transform="translate(50, 10)">
      <!-- Große Supernova-Strahlenkreuz-Explosion -->
      <path d="M0,-8.5 L1.2,-1.2 L8.5,0 L1.2,1.2 L0,8.5 L-1.2,1.2 L-8.5,0 L-1.2,-1.2 Z" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0; 0; 0.95; 0.3; 0.9; 0; 0"
          keyTimes="0; 0.44; 0.49; 0.54; 0.59; 0.66; 1" dur="6.0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale"
          values="0.4; 0.4; 1.5; 0.9; 1.4; 0.4; 0.4"
          keyTimes="0; 0.44; 0.49; 0.54; 0.59; 0.66; 1" dur="6.0s" repeatCount="indefinite"/>
      </path>

      <!-- Expansive Lichtwelle über den Himmel -->
      <circle cx="0" cy="0" r="4" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0">
        <animate attributeName="r" values="4; 4; 22; 34; 38; 4"
          keyTimes="0; 0.46; 0.54; 0.62; 0.68; 1" dur="6.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0; 0; 0.85; 0.3; 0; 0"
          keyTimes="0; 0.46; 0.50; 0.60; 0.68; 1" dur="6.0s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
