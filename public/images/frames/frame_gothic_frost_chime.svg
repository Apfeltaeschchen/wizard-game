<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Tiefes gotisches Frost-Eisblau Gradient -->
    <radialGradient id="frostGothicRing" cx="30%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="frostSpireGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="frostBellGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bae6fd"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="frostGothicShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.88"/>
      <feDropShadow dx="0" dy="1.8" stdDeviation="2.8" flood-color="#0284c7" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#frostGothicShadow)">
    <!-- 1. Gotischer Eisring (r=35.5, stroke 1.8px) & Frost-Zierkreis -->
    <circle cx="50" cy="50" r="35.5" stroke="url(#frostGothicRing)" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="37.2" stroke="#7dd3fc" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- 2. Gotische Eiszapfen-Maßwerk-Flanken Links (maxR <= 43.8) -->
    <g stroke="url(#frostSpireGrad)" stroke-linecap="round" fill="none">
      <path d="M19,34 C14,30 11,36 9,42 C13,43 15,48 11,54 C15,56 18,61 20,67" stroke-width="1.2"/>
      <!-- Filigranes inneres Eis-Gespinst -->
      <path d="M16,38 C12,42 12,48 15,52" stroke-width="0.7" stroke="#e0f2fe"/>
      <polygon points="8,42 12,43 11,40" fill="#bae6fd" stroke="none"/>
      <polygon points="10,54 14,53 12,56" fill="#bae6fd" stroke="none"/>
    </g>

    <!-- Gotische Eiszapfen-Maßwerk-Flanken Rechts -->
    <g stroke="url(#frostSpireGrad)" stroke-linecap="round" fill="none">
      <path d="M81,34 C86,30 89,36 91,42 C87,43 85,48 89,54 C85,56 82,61 80,67" stroke-width="1.2"/>
      <!-- Filigranes inneres Eis-Gespinst -->
      <path d="M84,38 C88,42 88,48 85,52" stroke-width="0.7" stroke="#e0f2fe"/>
      <polygon points="92,42 88,43 89,40" fill="#bae6fd" stroke="none"/>
      <polygon points="90,54 86,53 88,56" fill="#bae6fd" stroke="none"/>
    </g>

    <!-- 3. Unten: Gotischer Dreipass mit hängendem Eiskristall (y=83 bis y=91) -->
    <polygon points="50,91 46,83 54,83" fill="#082f49" stroke="#7dd3fc" stroke-width="0.6"/>
    <!-- Glänzendes Kristall-Juwel -->
    <polygon points="50,89 48,85 50,83 52,85" fill="#f0f9ff" stroke="#38bdf8" stroke-width="0.3"/>
    <circle cx="50" cy="85.5" r="0.6" fill="#ffffff"/>

    <!-- 4. Oben: Schwingende Raureif-Glocke im gotischen Maßwerk (y=7 bis y=15) -->
    <g transform="translate(50, 11)">
      <!-- Zarte Eiskrone über Aufhängung -->
      <path d="M-3,-3.5 C-1.5,-4.5 1.5,-4.5 3,-3.5 C1.5,-2.5 -1.5,-2.5 -3,-3.5 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.4"/>
      
      <!-- Schwingende Frostglocke alle 7.5s -->
      <path d="M-2.5,-2 C-2.5,-3 2.5,-3 2.5,-2 C2.5,0.5 4,2 4.5,3 L-4.5,3 C-4,2 -2.5,0.5 -2.5,-2 Z" fill="url(#frostBellGrad)" stroke="#082f49" stroke-width="0.4"/>
      <line x1="-4.5" y1="3" x2="4.5" y2="3" stroke="#f0f9ff" stroke-width="0.5"/>
      <!-- Klöppel -->
      <circle cx="0" cy="3.7" r="0.8" fill="#bae6fd" stroke="#0284c7" stroke-width="0.3"/>

      <!-- Aufblitzender Eisstern am Scheitelpunkt -->
      <path d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.18; 0.22; 0.28; 1" dur="7.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values="0.5; 0.5; 1.3; 0.5; 0.5" keyTimes="0; 0.18; 0.22; 0.28; 1" dur="7.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
