<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="70%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#050308" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1050" height="1498" rx="42" fill="url(#bgGrad)" />

  <!-- Outer Ornate Frame -->
  <rect x="30" y="30" width="990" height="1438" rx="36" fill="none" stroke="url(#goldBorder)" stroke-width="8" stroke-dasharray="12 4" opacity="0.65" />
  <rect x="52" y="52" width="946" height="1394" rx="28" fill="none" stroke="url(#goldBorder)" stroke-width="4" opacity="0.85" />
  <rect x="68" y="68" width="914" height="1362" rx="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Corner Badges -->
  <!-- Top-Left -->
  <g transform="translate(100, 130)">
    <circle cx="0" cy="0" r="48" fill="#110c1f" stroke="#f59e0b" stroke-width="4" />
    <text x="0" y="20" font-family="'Cinzel', serif, Arial" font-size="54" font-weight="900" fill="#fef08a" text-anchor="middle">L</text>
  </g>
  <!-- Bottom-Right -->
  <g transform="translate(950, 1368)">
    <circle cx="0" cy="0" r="48" fill="#110c1f" stroke="#f59e0b" stroke-width="4" />
    <text x="0" y="20" font-family="'Cinzel', serif, Arial" font-size="54" font-weight="900" fill="#fef08a" text-anchor="middle">L</text>
  </g>

  <!-- Center Artwork Placeholder Box -->
  <rect x="140" y="240" width="770" height="850" rx="24" fill="rgba(0,0,0,0.4)" stroke="#f59e0b" stroke-width="3" opacity="0.8" />
  
  <g transform="translate(525, 620)">
    <!-- Arcane Icon Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 6" opacity="0.7"/>
    <circle cx="0" cy="0" r="110" fill="rgba(255,255,255,0.03)" stroke="#ffd700" stroke-width="2" />
    
    <!-- Big Symbol -->
    <text x="0" y="42" font-family="'Cinzel', serif, Arial" font-size="120" font-weight="900" fill="#fef08a" text-anchor="middle">L</text>
  </g>

  <!-- Title & Lore Banner -->
  <g transform="translate(525, 1170)">
    <rect x="-340" y="-45" width="680" height="90" rx="16" fill="#110c1f" stroke="url(#goldBorder)" stroke-width="3" />
    <text x="0" y="15" font-family="'Cinzel Decorative', 'Cinzel', serif, Arial" font-size="46" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">LINDWURM</text>
  </g>

  <g transform="translate(525, 1290)">
    <text x="0" y="0" font-family="'Crimson Text', serif, Arial" font-size="28" font-style="italic" fill="#cbd5e1" text-anchor="middle">Ältester Schrecken der Ascheberge</text>
    <text x="0" y="45" font-family="'Cinzel', serif, Arial" font-size="18" fill="#d97706" text-anchor="middle" letter-spacing="2">1050 × 1498 PX ARTWORK-SLOT</text>
  </g>
</svg>