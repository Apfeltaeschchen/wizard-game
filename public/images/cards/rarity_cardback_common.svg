<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="slateGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2a3447"/>
      <stop offset="60%" stop-color="#141c28"/>
      <stop offset="100%" stop-color="#090d14"/>
    </radialGradient>
    <linearGradient id="ironBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="runeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadowCommon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Card Background Slate -->
  <rect x="5" y="5" width="290" height="440" rx="14" fill="url(#slateGrad)"/>

  <!-- Weathered Stone Texture Subtlety -->
  <path d="M 15 80 Q 90 60 140 85 T 285 70" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.3"/>
  <path d="M 20 370 Q 110 390 180 365 T 280 380" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.3"/>
  <path d="M 40 210 Q 80 230 130 200 T 260 220" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.4"/>

  <!-- Outer Iron Rim -->
  <rect x="12" y="12" width="276" height="426" rx="10" fill="none" stroke="url(#ironBorder)" stroke-width="4" filter="url(#shadowCommon)"/>
  <!-- Inner Chiseled Inset Line -->
  <rect x="22" y="22" width="256" height="406" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.65"/>

  <!-- Iron Corner Rivets & Brackets -->
  <!-- Top Left -->
  <path d="M 12 40 L 40 12 L 24 12 A 12 12 0 0 0 12 24 Z" fill="#64748b"/>
  <circle cx="28" cy="28" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
  <!-- Top Right -->
  <path d="M 288 40 L 260 12 L 276 12 A 12 12 0 0 1 288 24 Z" fill="#64748b"/>
  <circle cx="272" cy="28" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
  <!-- Bottom Left -->
  <path d="M 12 410 L 40 438 L 24 438 A 12 12 0 0 1 12 426 Z" fill="#64748b"/>
  <circle cx="28" cy="422" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
  <!-- Bottom Right -->
  <path d="M 288 410 L 260 438 L 276 438 A 12 12 0 0 0 288 426 Z" fill="#64748b"/>
  <circle cx="272" cy="422" r="3" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>

  <!-- Etched Geometric Runes Border Accents -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.5">
    <!-- Top & Bottom Diamond Links -->
    <path d="M 135 22 L 150 14 L 165 22 L 150 30 Z"/>
    <path d="M 135 428 L 150 420 L 165 428 L 150 436 Z"/>
    <!-- Left & Right Diamond Links -->
    <path d="M 22 210 L 14 225 L 22 240 L 30 225 Z"/>
    <path d="M 278 210 L 270 225 L 278 240 L 286 225 Z"/>
  </g>

  <!-- Novice Mystic Ring Conduits (Outer Ring) -->
  <circle cx="150" cy="225" r="94" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4"/>
  <circle cx="150" cy="225" r="88" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Central Citadel Slate Medallion -->
  <circle cx="150" cy="225" r="70" fill="#1e293b" stroke="url(#ironBorder)" stroke-width="3" filter="url(#shadowCommon)"/>
  <circle cx="150" cy="225" r="62" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" opacity="0.8"/>

  <!-- Novice 4-Point Runic Star (Apprentice Compass) -->
  <g fill="none" stroke="url(#ironBorder)" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 150 170 L 156 215 L 205 225 L 156 235 L 150 280 L 144 235 L 95 225 L 144 215 Z" fill="#0f172a"/>
  </g>
  <g fill="#94a3b8" opacity="0.7">
    <!-- Star Facets -->
    <path d="M 150 170 L 150 225 L 156 215 Z"/>
    <path d="M 205 225 L 150 225 L 156 235 Z"/>
    <path d="M 150 280 L 150 225 L 144 235 Z"/>
    <path d="M 95 225 L 150 225 L 144 215 Z"/>
  </g>

  <!-- Central Iron Core -->
  <circle cx="150" cy="225" r="10" fill="#334155" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="150" cy="225" r="4" fill="#cbd5e1"/>

  <!-- Four Novitiate Runes around Ring -->
  <!-- Top Rune: Fehu-style -->
  <path d="M 150 142 L 150 156 M 150 146 L 157 141 M 150 151 L 157 146" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom Rune: Algiz-style -->
  <path d="M 150 294 L 150 308 M 150 298 L 144 293 M 150 298 L 156 293" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <!-- Left Rune: Kenaz-style -->
  <path d="M 78 221 L 69 225 L 78 229" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Right Rune: Sowilo-style -->
  <path d="M 222 221 L 227 223 L 224 227 L 229 229" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>