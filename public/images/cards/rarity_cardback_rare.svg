<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="sapphireGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#0369a1"/>
      <stop offset="70%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#021220"/>
    </radialGradient>
    <linearGradient id="frostBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="manaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer Mana Glow -->
    <filter id="manaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="290" height="440" rx="14" fill="url(#sapphireGrad)"/>

  <!-- Arcane Mana Conduits (Ley Lines Pattern) -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.3" fill="none">
    <path d="M 15 45 L 75 105 L 75 345 L 15 405"/>
    <path d="M 285 45 L 225 105 L 225 345 L 285 405"/>
    <path d="M 60 15 L 110 65 L 190 65 L 240 15"/>
    <path d="M 60 435 L 110 385 L 190 385 L 240 435"/>
    <line x1="75" y1="225" x2="225" y2="225"/>
    <line x1="150" y1="105" x2="150" y2="345"/>
  </g>

  <!-- Outer Sapphire Crystal Border -->
  <rect x="12" y="12" width="276" height="426" rx="10" fill="none" stroke="url(#frostBorder)" stroke-width="3.5" filter="url(#manaGlow)"/>
  <!-- Inset Filigree Border -->
  <rect x="20" y="20" width="260" height="410" rx="7" fill="none" stroke="#7dd3fc" stroke-width="1.2" stroke-dasharray="14 6" opacity="0.75"/>

  <!-- Ornate Ice-Crystal Corners -->
  <!-- Top Left -->
  <g transform="translate(12, 12)">
    <path d="M 0 36 L 16 28 L 28 16 L 36 0 L 26 0 L 0 26 Z" fill="#38bdf8"/>
    <polygon points="12,12 24,18 18,24" fill="#e0f2fe"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(288, 12) scale(-1, 1)">
    <path d="M 0 36 L 16 28 L 28 16 L 36 0 L 26 0 L 0 26 Z" fill="#38bdf8"/>
    <polygon points="12,12 24,18 18,24" fill="#e0f2fe"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(12, 438) scale(1, -1)">
    <path d="M 0 36 L 16 28 L 28 16 L 36 0 L 26 0 L 0 26 Z" fill="#38bdf8"/>
    <polygon points="12,12 24,18 18,24" fill="#e0f2fe"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(288, 438) scale(-1, -1)">
    <path d="M 0 36 L 16 28 L 28 16 L 36 0 L 26 0 L 0 26 Z" fill="#38bdf8"/>
    <polygon points="12,12 24,18 18,24" fill="#e0f2fe"/>
  </g>

  <!-- Arcane Concentric Circles & Astrolabe Dial -->
  <circle cx="150" cy="225" r="98" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6"/>
  <circle cx="150" cy="225" r="90" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" filter="url(#manaGlow)"/>
  <circle cx="150" cy="225" r="76" fill="#082f49" stroke="#7dd3fc" stroke-width="1.8"/>

  <!-- Astrolabe Coordinate Ticks -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.8">
    <line x1="150" y1="139" x2="150" y2="149"/>
    <line x1="150" y1="301" x2="150" y2="311"/>
    <line x1="64" y1="225" x2="74" y2="225"/>
    <line x1="226" y1="225" x2="236" y2="225"/>
    <!-- Diagonals -->
    <line x1="89" y1="164" x2="97" y2="172"/>
    <line x1="211" y1="164" x2="203" y2="172"/>
    <line x1="89" y1="286" x2="97" y2="278"/>
    <line x1="211" y1="286" x2="203" y2="278"/>
  </g>

  <!-- Glowing Mana Center Aura -->
  <circle cx="150" cy="225" r="54" fill="url(#manaCore)"/>

  <!-- Mystic Hexagram / 6-Pointed Arcane Crystal -->
  <g fill="none" stroke="url(#frostBorder)" stroke-width="2.2" stroke-linejoin="round" filter="url(#manaGlow)">
    <polygon points="150,172 188,246 112,246"/>
    <polygon points="150,278 188,204 112,204"/>
  </g>

  <!-- Central Diamond Crystal Core -->
  <g filter="url(#manaGlow)">
    <polygon points="150,198 170,225 150,252 130,225" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.5"/>
    <polygon points="150,205 164,225 150,245 136,225" fill="#bae6fd"/>
    <!-- Crystal Facet Shading -->
    <polygon points="150,198 150,252 130,225" fill="#0284c7" opacity="0.4"/>
    <polygon points="150,205 150,245 136,225" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Ambient Light Sparks -->
  <circle cx="150" cy="115" r="2.5" fill="#e0f2fe" filter="url(#manaGlow)"/>
  <circle cx="150" cy="335" r="2.5" fill="#e0f2fe" filter="url(#manaGlow)"/>
  <circle cx="48" cy="225" r="2" fill="#7dd3fc"/>
  <circle cx="252" cy="225" r="2" fill="#7dd3fc"/>
</svg>