<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <!-- Background Velvet Gradients -->
    <radialGradient id="royalVelvet" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#2d0a00"/>
      <stop offset="70%" stop-color="#190400"/>
      <stop offset="100%" stop-color="#0a0200"/>
    </radialGradient>
    <!-- Rich Baroque Gold Metallic Gradient -->
    <linearGradient id="baroqueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="sunburstCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <!-- Radiant Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Card Background Deep Velvet -->
  <rect x="5" y="5" width="290" height="440" rx="14" fill="url(#royalVelvet)"/>

  <!-- Celestial Sun Rays Rays Fan Background -->
  <g stroke="#f59e0b" stroke-width="1.2" opacity="0.18">
    <line x1="150" y1="225" x2="0" y2="0"/>
    <line x1="150" y1="225" x2="75" y2="0"/>
    <line x1="150" y1="225" x2="150" y2="0"/>
    <line x1="150" y1="225" x2="225" y2="0"/>
    <line x1="150" y1="225" x2="300" y2="0"/>
    <line x1="150" y1="225" x2="300" y2="112"/>
    <line x1="150" y1="225" x2="300" y2="225"/>
    <line x1="150" y1="225" x2="300" y2="338"/>
    <line x1="150" y1="225" x2="300" y2="450"/>
    <line x1="150" y1="225" x2="225" y2="450"/>
    <line x1="150" y1="225" x2="150" y2="450"/>
    <line x1="150" y1="225" x2="75" y2="450"/>
    <line x1="150" y1="225" x2="0" y2="450"/>
    <line x1="150" y1="225" x2="0" y2="338"/>
    <line x1="150" y1="225" x2="0" y2="225"/>
    <line x1="150" y1="225" x2="0" y2="112"/>
  </g>

  <!-- Heavy Baroque Gold Outer Bezel -->
  <rect x="12" y="12" width="276" height="426" rx="11" fill="none" stroke="url(#baroqueGold)" stroke-width="5" filter="url(#dropShadow)"/>
  <rect x="18" y="18" width="264" height="414" rx="8" fill="none" stroke="#78350f" stroke-width="1.8"/>
  <rect x="23" y="23" width="254" height="404" rx="6" fill="none" stroke="url(#baroqueGold)" stroke-width="1.6" stroke-dasharray="12 4" opacity="0.9"/>

  <!-- Ornate Royal Corner Filigree & Gemstones -->
  <!-- Top Left Corner -->
  <g transform="translate(12, 12)">
    <path d="M 0 54 Q 14 36 36 14 Q 54 0 54 0 Q 36 4 24 16 Q 16 24 4 36 Q 0 54 0 54 Z" fill="url(#baroqueGold)" filter="url(#goldGlow)"/>
    <!-- Ruby Gemstone -->
    <polygon points="24,24 30,16 38,24 30,32" fill="#dc2626" stroke="#fef08a" stroke-width="1.2" filter="url(#goldGlow)"/>
    <circle cx="28" cy="22" r="1.5" fill="#ffffff"/>
  </g>
  <!-- Top Right Corner -->
  <g transform="translate(288, 12) scale(-1, 1)">
    <path d="M 0 54 Q 14 36 36 14 Q 54 0 54 0 Q 36 4 24 16 Q 16 24 4 36 Q 0 54 0 54 Z" fill="url(#baroqueGold)" filter="url(#goldGlow)"/>
    <polygon points="24,24 30,16 38,24 30,32" fill="#dc2626" stroke="#fef08a" stroke-width="1.2" filter="url(#goldGlow)"/>
    <circle cx="28" cy="22" r="1.5" fill="#ffffff"/>
  </g>
  <!-- Bottom Left Corner -->
  <g transform="translate(12, 438) scale(1, -1)">
    <path d="M 0 54 Q 14 36 36 14 Q 54 0 54 0 Q 36 4 24 16 Q 16 24 4 36 Q 0 54 0 54 Z" fill="url(#baroqueGold)" filter="url(#goldGlow)"/>
    <polygon points="24,24 30,16 38,24 30,32" fill="#dc2626" stroke="#fef08a" stroke-width="1.2" filter="url(#goldGlow)"/>
    <circle cx="28" cy="22" r="1.5" fill="#ffffff"/>
  </g>
  <!-- Bottom Right Corner -->
  <g transform="translate(288, 438) scale(-1, -1)">
    <path d="M 0 54 Q 14 36 36 14 Q 54 0 54 0 Q 36 4 24 16 Q 16 24 4 36 Q 0 54 0 54 Z" fill="url(#baroqueGold)" filter="url(#goldGlow)"/>
    <polygon points="24,24 30,16 38,24 30,32" fill="#dc2626" stroke="#fef08a" stroke-width="1.2" filter="url(#goldGlow)"/>
    <circle cx="28" cy="22" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Royal Archmage Crown Crest Top -->
  <g transform="translate(150, 42)" filter="url(#goldGlow)">
    <path d="M -30 10 L -25 -10 L -12 2 L 0 -16 L 12 2 L 25 -10 L 30 10 Z" fill="url(#baroqueGold)" stroke="#78350f" stroke-width="1"/>
    <circle cx="0" cy="-16" r="3" fill="#ffffff"/>
    <circle cx="-25" cy="-10" r="2.5" fill="#dc2626"/>
    <circle cx="25" cy="-10" r="2.5" fill="#dc2626"/>
    <rect x="-24" y="6" width="48" height="4" rx="2" fill="#78350f"/>
  </g>
  <!-- Bottom Fleur-de-lis / Royal Seal -->
  <g transform="translate(150, 408) scale(1, -1)" filter="url(#goldGlow)">
    <path d="M -30 10 L -25 -10 L -12 2 L 0 -16 L 12 2 L 25 -10 L 30 10 Z" fill="url(#baroqueGold)" stroke="#78350f" stroke-width="1"/>
    <circle cx="0" cy="-16" r="3" fill="#ffffff"/>
    <circle cx="-25" cy="-10" r="2.5" fill="#dc2626"/>
    <circle cx="25" cy="-10" r="2.5" fill="#dc2626"/>
  </g>

  <!-- Golden Concentric Solar Dials -->
  <circle cx="150" cy="225" r="102" fill="none" stroke="#b45309" stroke-width="2" opacity="0.7"/>
  <circle cx="150" cy="225" r="95" fill="none" stroke="url(#baroqueGold)" stroke-width="3" stroke-dasharray="14 4" filter="url(#goldGlow)"/>
  <circle cx="150" cy="225" r="80" fill="#2d0a00" stroke="url(#baroqueGold)" stroke-width="2"/>

  <!-- Radial Sunburst Core Glow -->
  <circle cx="150" cy="225" r="62" fill="url(#sunburstCore)"/>

  <!-- 12 Majestic Solar Flare Rays -->
  <g fill="url(#baroqueGold)" filter="url(#goldGlow)">
    <!-- Cardinal 4 -->
    <polygon points="150,146 156,210 150,225 144,210"/>
    <polygon points="150,304 156,240 150,225 144,240"/>
    <polygon points="71,225 135,219 150,225 135,231"/>
    <polygon points="229,225 165,219 150,225 165,231"/>
    <!-- Diagonal 4 -->
    <polygon points="94,169 140,214 150,225 134,220"/>
    <polygon points="206,169 160,214 150,225 166,220"/>
    <polygon points="94,281 140,236 150,225 134,230"/>
    <polygon points="206,281 160,236 150,225 166,230"/>
  </g>

  <!-- Archmage Central Phoenix / Dragon Emblem -->
  <!-- Outer Ring with Jewels -->
  <circle cx="150" cy="225" r="38" fill="#451a03" stroke="url(#baroqueGold)" stroke-width="2.5" filter="url(#goldGlow)"/>
  <circle cx="150" cy="225" r="30" fill="#78350f" stroke="#fef08a" stroke-width="1.5"/>

  <!-- Imperial Phoenix/Dragon Crest -->
  <path d="M 150 202 Q 162 216 166 226 Q 160 228 150 224 Q 140 228 134 226 Q 138 216 150 202 Z" fill="#fde047" filter="url(#goldGlow)"/>
  <path d="M 150 224 Q 158 238 150 248 Q 142 238 150 224 Z" fill="#f59e0b"/>
  <!-- Ruby Heart Center -->
  <circle cx="150" cy="225" r="5" fill="#dc2626" stroke="#fffbeb" stroke-width="1.2" filter="url(#goldGlow)"/>
  <circle cx="148.5" cy="223.5" r="1.2" fill="#ffffff"/>
</svg>