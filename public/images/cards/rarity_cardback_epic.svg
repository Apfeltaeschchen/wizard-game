<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="obsidianGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="35%" stop-color="#3b0764"/>
      <stop offset="70%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#090111"/>
    </radialGradient>
    <linearGradient id="amethystGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="65%" stop-color="#7e22ce"/>
      <stop offset="85%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="voidCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="25%" stop-color="#e879f9"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <!-- Violet Eldritch Glow -->
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background Obsidian -->
  <rect x="5" y="5" width="290" height="440" rx="14" fill="url(#obsidianGrad)"/>

  <!-- Swirling Shadowflame Smoke Background Trails -->
  <g stroke="#9333ea" stroke-width="2" fill="none" opacity="0.25">
    <path d="M 30 420 C 50 320 120 300 110 210 C 100 120 40 100 70 30"/>
    <path d="M 270 420 C 250 320 180 300 190 210 C 200 120 260 100 230 30"/>
    <path d="M 30 225 Q 150 140 270 225"/>
    <path d="M 30 225 Q 150 310 270 225"/>
  </g>

  <!-- Outer Gilded Amethyst Frame -->
  <rect x="12" y="12" width="276" height="426" rx="10" fill="none" stroke="url(#amethystGoldBorder)" stroke-width="4" filter="url(#epicGlow)"/>
  <!-- Inset Runed Filigree Line -->
  <rect x="21" y="21" width="258" height="408" rx="7" fill="none" stroke="#d8b4fe" stroke-width="1.5" stroke-dasharray="16 8 4 8" opacity="0.8"/>

  <!-- Ornate Eldritch Thorn Corners -->
  <!-- Top Left -->
  <g transform="translate(12, 12)">
    <path d="M 0 42 Q 10 22 22 10 Q 42 0 42 0 Q 24 14 14 24 Q 0 42 0 42 Z" fill="#c084fc"/>
    <circle cx="20" cy="20" r="4" fill="#f5d0fe" filter="url(#epicGlow)"/>
    <polygon points="6,6 16,3 13,13" fill="#a855f7"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(288, 12) scale(-1, 1)">
    <path d="M 0 42 Q 10 22 22 10 Q 42 0 42 0 Q 24 14 14 24 Q 0 42 0 42 Z" fill="#c084fc"/>
    <circle cx="20" cy="20" r="4" fill="#f5d0fe" filter="url(#epicGlow)"/>
    <polygon points="6,6 16,3 13,13" fill="#a855f7"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(12, 438) scale(1, -1)">
    <path d="M 0 42 Q 10 22 22 10 Q 42 0 42 0 Q 24 14 14 24 Q 0 42 0 42 Z" fill="#c084fc"/>
    <circle cx="20" cy="20" r="4" fill="#f5d0fe" filter="url(#epicGlow)"/>
    <polygon points="6,6 16,3 13,13" fill="#a855f7"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(288, 438) scale(-1, -1)">
    <path d="M 0 42 Q 10 22 22 10 Q 42 0 42 0 Q 24 14 14 24 Q 0 42 0 42 Z" fill="#c084fc"/>
    <circle cx="20" cy="20" r="4" fill="#f5d0fe" filter="url(#epicGlow)"/>
    <polygon points="6,6 16,3 13,13" fill="#a855f7"/>
  </g>

  <!-- Arcane Dial & Dragon Claw Sigils -->
  <circle cx="150" cy="225" r="100" fill="none" stroke="#7e22ce" stroke-width="1.8" opacity="0.6"/>
  <circle cx="150" cy="225" r="92" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-dasharray="10 5" filter="url(#epicGlow)"/>
  <circle cx="150" cy="225" r="76" fill="#1e0538" stroke="#a855f7" stroke-width="2"/>

  <!-- 8 Dragon Wings / Eldritch Petals -->
  <g fill="#581c87" stroke="#c084fc" stroke-width="1.2" opacity="0.75">
    <path d="M 150 148 Q 160 180 150 200 Q 140 180 150 148 Z"/>
    <path d="M 150 302 Q 160 270 150 250 Q 140 270 150 302 Z"/>
    <path d="M 73 225 Q 105 215 125 225 Q 105 235 73 225 Z"/>
    <path d="M 227 225 Q 195 215 175 225 Q 195 235 227 225 Z"/>
    <path d="M 96 171 Q 120 188 132 207 Q 113 207 96 171 Z"/>
    <path d="M 204 171 Q 180 188 168 207 Q 187 207 204 171 Z"/>
    <path d="M 96 279 Q 120 262 132 243 Q 113 243 96 279 Z"/>
    <path d="M 204 279 Q 180 262 168 243 Q 187 243 204 279 Z"/>
  </g>

  <!-- Glowing Void Flare -->
  <circle cx="150" cy="225" r="56" fill="url(#voidCore)"/>

  <!-- Central Eldritch Eye / Amethyst Relic -->
  <!-- Outer Eye Shape -->
  <path d="M 112 225 Q 150 188 188 225 Q 150 262 112 225 Z" fill="#2e1065" stroke="#f5d0fe" stroke-width="2" filter="url(#epicGlow)"/>
  <!-- Glowing Eye Core -->
  <circle cx="150" cy="225" r="22" fill="#c084fc" stroke="#fdf4ff" stroke-width="2" filter="url(#epicGlow)"/>
  <!-- Slit Pupil (Dragon / Demon) -->
  <path d="M 150 205 Q 156 225 150 245 Q 144 225 150 205 Z" fill="#090111"/>
  <!-- Sparkles -->
  <circle cx="147" cy="220" r="3" fill="#ffffff"/>

  <!-- Top and Bottom Occult Crescent Horns -->
  <path d="M 130 92 Q 150 115 170 92 Q 150 102 130 92 Z" fill="#c084fc" filter="url(#epicGlow)"/>
  <path d="M 130 358 Q 150 335 170 358 Q 150 348 130 358 Z" fill="#c084fc" filter="url(#epicGlow)"/>
</svg>