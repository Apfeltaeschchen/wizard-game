<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Tiefer Raumgradient der Ratskammer -->
    <radialGradient id="chamberGaze" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e130a" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#100b14" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050308" stop-opacity="1" />
    </radialGradient>

    <!-- Zentraler Kerzenschein des Ratsrunds -->
    <radialGradient id="councilFire" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Die 4 Elementar-Edelstein-Nischen -->
    <radialGradient id="gemRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gemBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gemGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#14532d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gemYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#a16207" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Basis & Raumatmosphäre -->
  <rect width="1920" height="1080" fill="url(#chamberGaze)" />
  <circle cx="960" cy="540" r="650" fill="url(#councilFire)" />

  <!-- 4 Elementar-Edelsteine in den Wandnischen -->
  <!-- Oben Links: Feuer/Rubin -->
  <circle cx="320" cy="220" r="160" fill="url(#gemRed)" />
  <circle cx="320" cy="220" r="12" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />

  <!-- Oben Rechts: Saphir/Wasser -->
  <circle cx="1600" cy="220" r="160" fill="url(#gemBlue)" />
  <circle cx="1600" cy="220" r="12" fill="#38bdf8" stroke="#bae6fd" stroke-width="2" />

  <!-- Unten Links: Smaragd/Erde -->
  <circle cx="320" cy="860" r="160" fill="url(#gemGreen)" />
  <circle cx="320" cy="860" r="12" fill="#22c55e" stroke="#86efac" stroke-width="2" />

  <!-- Unten Rechts: Topas/Sonne -->
  <circle cx="1600" cy="860" r="160" fill="url(#gemYellow)" />
  <circle cx="1600" cy="860" r="12" fill="#fde047" stroke="#fef08a" stroke-width="2" />

  <!-- Mystischer Ratssiegel-Kreis im Steinboden -->
  <g transform="translate(960, 540)" stroke="#c89a38" stroke-opacity="0.2" fill="none" stroke-width="1.8">
    <circle r="460" stroke-dasharray="8 8" stroke-width="2.5" />
    <circle r="420" />
    <circle r="380" stroke-dasharray="16 8" />
    <circle r="280" stroke-width="1.5" />
    <circle r="150" stroke-dasharray="6 6" />

    <!-- Verbindungsachsen der 6 Ratsstühle -->
    <line x1="-420" y1="0" x2="420" y2="0" stroke-dasharray="6 6" />
    <line x1="-210" y1="-363" x2="210" y2="363" stroke-dasharray="6 6" />
    <line x1="-210" y1="363" x2="210" y2="-363" stroke-dasharray="6 6" />

    <!-- 6 Ratsherren-Siegelpositionen -->
    <g fill="#1f140b" stroke="#f0c355" stroke-width="2" stroke-opacity="0.45">
      <circle cx="-420" cy="0" r="22" />
      <circle cx="420" cy="0" r="22" />
      <circle cx="-210" cy="-363" r="22" />
      <circle cx="210" cy="-363" r="22" />
      <circle cx="-210" cy="363" r="22" />
      <circle cx="210" cy="363" r="22" />
    </g>
  </g>
</svg>
