<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Smaragd & Urwald Basis -->
    <radialGradient id="forestBase" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#09432f"/>
      <stop offset="45%" stop-color="#04271c"/>
      <stop offset="80%" stop-color="#021711"/>
      <stop offset="100%" stop-color="#010c08"/>
    </radialGradient>
    <linearGradient id="fairyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="25%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="woodBark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a1f"/>
      <stop offset="50%" stop-color="#3b5e30"/>
      <stop offset="100%" stop-color="#152915"/>
    </linearGradient>
    <radialGradient id="gemEmerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <filter id="forestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Magischer Elfenholzkörper mit tiefem Smaragd-Dunkel -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#forestBase)" stroke="#02140e" stroke-width="8"/>

  <!-- Äußerer Holzrahmen mit Moos- und Ranken-Gravur -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#woodBark)" stroke-width="18"/>
  <rect x="62" y="62" width="926" height="1374" rx="22" fill="none" stroke="url(#fairyGold)" stroke-width="4" stroke-dasharray="16 8"/>

  <!-- Organisch verschlungene Efeuranken an den Ecken & Rändern -->
  <!-- Ranken Oben Links -->
  <g stroke="url(#fairyGold)" stroke-width="4" fill="none" filter="url(#forestGlow)">
    <path d="M 60 220 Q 80 120 180 80 Q 280 60 380 60"/>
    <path d="M 60 380 Q 80 280 80 180"/>
    <!-- Blätter -->
    <path d="M 120 130 C 135 110 165 110 170 135 C 155 155 125 155 120 130 Z" fill="#10b981"/>
    <path d="M 230 75 C 255 60 285 70 280 95 C 255 110 225 100 230 75 Z" fill="#10b981"/>
    <path d="M 75 240 C 60 265 70 295 95 290 C 110 265 100 235 75 240 Z" fill="#10b981"/>
  </g>
  <!-- Ranken Oben Rechts (gespiegelt) -->
  <g transform="translate(1050, 0) scale(-1, 1)" stroke="url(#fairyGold)" stroke-width="4" fill="none" filter="url(#forestGlow)">
    <path d="M 60 220 Q 80 120 180 80 Q 280 60 380 60"/>
    <path d="M 60 380 Q 80 280 80 180"/>
    <path d="M 120 130 C 135 110 165 110 170 135 C 155 155 125 155 120 130 Z" fill="#10b981"/>
    <path d="M 230 75 C 255 60 285 70 280 95 C 255 110 225 100 230 75 Z" fill="#10b981"/>
  </g>
  <!-- Ranken Unten Links -->
  <g transform="translate(0, 1498) scale(1, -1)" stroke="url(#fairyGold)" stroke-width="4" fill="none" filter="url(#forestGlow)">
    <path d="M 60 220 Q 80 120 180 80 Q 280 60 380 60"/>
    <path d="M 60 380 Q 80 280 80 180"/>
    <path d="M 120 130 C 135 110 165 110 170 135 C 155 155 125 155 120 130 Z" fill="#10b981"/>
  </g>
  <!-- Ranken Unten Rechts -->
  <g transform="translate(1050, 1498) scale(-1, -1)" stroke="url(#fairyGold)" stroke-width="4" fill="none" filter="url(#forestGlow)">
    <path d="M 60 220 Q 80 120 180 80 Q 280 60 380 60"/>
    <path d="M 60 380 Q 80 280 80 180"/>
    <path d="M 120 130 C 135 110 165 110 170 135 C 155 155 125 155 120 130 Z" fill="#10b981"/>
  </g>

  <!-- Ätherisches Natur-Mandala (Lebensbaum & Wurzelgeometrie) -->
  <g stroke="#34d399" stroke-width="2" fill="none" opacity="0.35">
    <circle cx="525" cy="749" r="430"/>
    <circle cx="525" cy="749" r="390" stroke-dasharray="8 12"/>
    <circle cx="525" cy="749" r="350"/>
    <!-- Keltische Dreiecks-Schleife (Triquetra im Hintergrund) -->
    <path d="M 525 360 C 680 500 780 680 525 980 C 270 680 370 500 525 360 Z" stroke-width="3"/>
    <path d="M 525 1138 C 370 998 270 818 525 518 C 780 818 680 998 525 1138 Z" stroke-width="3"/>
  </g>

  <!-- Zentrum: Blühende Lotus-/Lilien-Fassung der Waldnymphen -->
  <circle cx="525" cy="749" r="210" fill="#022117" stroke="url(#fairyGold)" stroke-width="8"/>
  <circle cx="525" cy="749" r="190" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- 8 Feen-Blütenblätter -->
  <g fill="none" stroke="url(#fairyGold)" stroke-width="5" filter="url(#forestGlow)">
    <!-- Oben / Unten / Rechts / Links -->
    <path d="M 525 749 C 480 640 480 570 525 545 C 570 570 570 640 525 749 Z" fill="#064e3b" opacity="0.8"/>
    <path d="M 525 749 C 480 858 480 928 525 953 C 570 928 570 858 525 749 Z" fill="#064e3b" opacity="0.8"/>
    <path d="M 525 749 C 634 704 704 704 729 749 C 704 794 634 794 525 749 Z" fill="#064e3b" opacity="0.8"/>
    <path d="M 525 749 C 416 704 346 704 321 749 C 346 794 416 794 525 749 Z" fill="#064e3b" opacity="0.8"/>
    <!-- Diagonalen -->
    <path d="M 525 749 C 480 670 450 630 435 659 C 450 695 490 735 525 749 Z" fill="#047857" opacity="0.6"/>
    <path d="M 525 749 C 570 670 600 630 615 659 C 600 695 560 735 525 749 Z" fill="#047857" opacity="0.6"/>
    <path d="M 525 749 C 480 828 450 868 435 839 C 450 803 490 763 525 749 Z" fill="#047857" opacity="0.6"/>
    <path d="M 525 749 C 570 828 600 868 615 839 C 600 803 560 763 525 749 Z" fill="#047857" opacity="0.6"/>
  </g>

  <!-- Zentraler Smaragdkristall (Gefasst in Elfengold) -->
  <polygon points="525,659 589,719 589,779 525,839 461,779 461,719" fill="url(#gemEmerald)" stroke="url(#fairyGold)" stroke-width="6"/>
  <!-- Facettenschliffe -->
  <line x1="525" y1="659" x2="525" y2="839" stroke="#d1fae5" stroke-width="3" opacity="0.6"/>
  <line x1="461" y1="719" x2="589" y2="779" stroke="#d1fae5" stroke-width="2" opacity="0.5"/>
  <line x1="461" y1="779" x2="589" y2="719" stroke="#d1fae5" stroke-width="2" opacity="0.5"/>
  <!-- Glanzpunkt -->
  <circle cx="505" cy="710" r="10" fill="#fff" opacity="0.85"/>
</svg>
