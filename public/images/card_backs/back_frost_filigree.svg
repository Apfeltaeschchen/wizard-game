      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="cardShadow_frost_filigree"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/></filter>
  </defs>
  <!-- Card Back Exterior Rim -->
  <rect x="25" y="25" width="1000" height="1448" rx="65" fill="#0f172a" stroke="#94a3b8" stroke-width="18" filter="url(#cardShadow_frost_filigree)"/>
