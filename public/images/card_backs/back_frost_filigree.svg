  <text x="525" y="785" font-family="'Cinzel Decorative', 'Times New Roman', serif" font-size="110" font-weight="bold" fill="#94a3b8" text-anchor="middle">🧊</text>
  <!-- Corner Ornaments -->
  <circle cx="130" cy="130" r="20" fill="none" stroke="#94a3b8" stroke-width="3"/>
