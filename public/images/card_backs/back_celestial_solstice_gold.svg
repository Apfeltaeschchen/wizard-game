<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Kosmischer Mitternachts-Saphir -->
    <radialGradient id="celestialSpace" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <!-- Göttliches 24k Sonnenwend-Gold -->
    <linearGradient id="divineGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="88%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Schimmernder Polarlicht-Smaragd & Cyan -->
    <linearGradient id="auroraLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.35"/>
    </linearGradient>
    <!-- Diamant-Kern der Ewigkeit -->
    <radialGradient id="starDiamond" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="celestialAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="divineShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Kartenkörper aus endlosem Kosmos-Saphir -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#celestialSpace)" stroke="#030712" stroke-width="8"/>

  <!-- Wogende Polarlicht-Schleier (Aurora Borealis) -->
  <g fill="url(#auroraLight)" opacity="0.65">
    <path d="M 40 350 Q 300 200 600 380 T 1010 320 L 1010 650 Q 700 800 400 620 T 40 700 Z"/>
    <path d="M 40 850 Q 300 700 600 880 T 1010 820 L 1010 1150 Q 700 1300 400 1120 T 40 1200 Z"/>
  </g>

  <!-- Sternenstaub & Magische Sternbilder -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="200" cy="300" r="2.5"/><circle cx="280" cy="240" r="3"/><circle cx="340" cy="320" r="2"/>
    <circle cx="850" cy="300" r="2.5"/><circle cx="770" cy="240" r="3"/><circle cx="710" cy="320" r="2"/>
    <circle cx="200" cy="1200" r="2.5"/><circle cx="280" cy="1260" r="3"/><circle cx="340" cy="1180" r="2"/>
    <circle cx="850" cy="1200" r="2.5"/><circle cx="770" cy="1260" r="3"/><circle cx="710" cy="1180" r="2"/>
  </g>

  <!-- Äußere Dreifache Meisterwerk-Goldbordüre (Gotisches Kathedralmaßwerk) -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#divineGold)" stroke-width="18" filter="url(#divineShadow)"/>
  <rect x="68" y="68" width="914" height="1362" rx="20" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.95"/>
  <rect x="84" y="84" width="882" height="1330" rx="14" fill="none" stroke="url(#divineGold)" stroke-width="4" stroke-dasharray="16 10"/>

  <!-- Gotische Kathedral-Fialen Oben & Unten -->
  <g fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2.5" filter="url(#celestialAura)">
    <!-- Oben Zentrum -->
    <g transform="translate(525, 110)">
      <polygon points="0,-60 18,-15 30,-35 24,15 -24,15 -30,-35 -18,-15"/>
      <!-- Schwebende Engelsflügel Oben -->
      <path d="M -25 10 Q -80 -20 -120 15 Q -60 30 -20 15 Z" fill="url(#divineGold)"/>
      <path d="M 25 10 Q 80 -20 120 15 Q 60 30 20 15 Z" fill="url(#divineGold)"/>
      <circle cx="0" cy="-60" r="7" fill="#ffffff"/>
      <circle cx="0" cy="5" r="8" fill="#1e3a8a"/>
    </g>
    <!-- Unten Zentrum (Gespiegelt) -->
    <g transform="translate(525, 1388)">
      <polygon points="0,60 18,15 30,35 24,-15 -24,-15 -30,35 -18,15"/>
      <path d="M -25 -10 Q -80 20 -120 -15 Q -60 -30 -20 -15 Z" fill="url(#divineGold)"/>
      <path d="M 25 -10 Q 80 20 120 -15 Q 60 -30 20 -15 Z" fill="url(#divineGold)"/>
      <circle cx="0" cy="60" r="7" fill="#ffffff"/>
      <circle cx="0" cy="-5" r="8" fill="#1e3a8a"/>
    </g>
  </g>

  <!-- 4 Himmlische Seraphim-Schwingen an den Ecken mit Leucht-Sphären -->
  <g filter="url(#celestialAura)">
    <!-- Oben Links -->
    <g transform="translate(130, 130)">
      <path d="M 0 0 Q -40 -60 20 -90 Q 50 -40 0 0 Z" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#starDiamond)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-4" cy="-5" r="5" fill="#fff" opacity="0.95"/>
    </g>
    <!-- Oben Rechts -->
    <g transform="translate(920, 130)">
      <path d="M 0 0 Q 40 -60 -20 -90 Q -50 -40 0 0 Z" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#starDiamond)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-4" cy="-5" r="5" fill="#fff" opacity="0.95"/>
    </g>
    <!-- Unten Links -->
    <g transform="translate(130, 1368)">
      <path d="M 0 0 Q -40 60 20 90 Q 50 40 0 0 Z" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#starDiamond)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-4" cy="-5" r="5" fill="#fff" opacity="0.95"/>
    </g>
    <!-- Unten Rechts -->
    <g transform="translate(920, 1368)">
      <path d="M 0 0 Q 40 60 -20 90 Q -50 40 0 0 Z" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="16" fill="url(#starDiamond)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-4" cy="-5" r="5" fill="#fff" opacity="0.95"/>
    </g>
  </g>

  <!-- Großes Kosmisches Sonnenwend-Astrolabium (Zentrum) -->
  <circle cx="525" cy="749" r="330" fill="#0b132b" stroke="url(#divineGold)" stroke-width="14" filter="url(#divineShadow)"/>
  <circle cx="525" cy="749" r="295" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="16 10"/>
  <circle cx="525" cy="749" r="265" fill="#060c1c" stroke="url(#divineGold)" stroke-width="6"/>

  <!-- Planetenbahnen & Kosmische Runenkreise -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75">
    <ellipse cx="525" cy="749" rx="250" ry="120" transform="rotate(30 525 749)"/>
    <ellipse cx="525" cy="749" rx="250" ry="120" transform="rotate(-30 525 749)"/>
    <circle cx="525" cy="749" r="210" stroke-dasharray="6 6"/>
  </g>

  <!-- Der Erhabene 8-zackige Stern von Bethlehem -->
  <g filter="url(#divineShadow)">
    <!-- 4 Große Hauptstrahlen (Kardinal) -->
    <g fill="url(#divineGold)" stroke="#3b1f08" stroke-width="3">
      <polygon points="525,430 550,715 525,749 500,715"/>
      <polygon points="525,1068 550,783 525,749 500,783"/>
      <polygon points="844,749 559,774 525,749 559,724"/>
      <polygon points="206,749 491,774 525,749 491,724"/>
    </g>
    <!-- 4 Diagonale Sonnenwendstrahlen -->
    <g fill="url(#divineGold)" stroke="#3b1f08" stroke-width="2.5">
      <polygon points="750,524 550,724 525,749 540,714"/>
      <polygon points="750,974 540,784 525,749 550,774"/>
      <polygon points="300,974 500,774 525,749 510,784"/>
      <polygon points="300,524 510,714 525,749 500,724"/>
    </g>
  </g>

  <!-- Göttlicher Lichtausbruch aus dem Zentrum -->
  <circle cx="525" cy="749" r="120" fill="url(#divineGold)" opacity="0.25" filter="url(#celestialAura)"/>
  <circle cx="525" cy="749" r="70" fill="url(#divineGold)" stroke="#ffffff" stroke-width="5" filter="url(#celestialAura)"/>

  <!-- Zentraler Diamant-Brillant (Sternenherz) -->
  <polygon points="525,695 565,749 525,803 485,749" fill="url(#starDiamond)" stroke="#ffffff" stroke-width="4" filter="url(#celestialAura)"/>
  <circle cx="516" cy="738" r="9" fill="#ffffff" opacity="0.95"/>
</svg>
