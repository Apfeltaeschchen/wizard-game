<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Verkohltes Kürbisholz & Bernstein -->
    <radialGradient id="pumpkinBase" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="45%" stop-color="#431407"/>
      <stop offset="80%" stop-color="#1f0602"/>
      <stop offset="100%" stop-color="#0a0201"/>
    </radialGradient>
    <linearGradient id="autumnCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="fireJack" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dunkel gebrannter Kürbisrindekörper -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#pumpkinBase)" stroke="#1a0401" stroke-width="8"/>

  <!-- Äußerer geschmiedeter Kupferrahmen mit Herbstlaubornamenten -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#autumnCopper)" stroke-width="16"/>
  <rect x="65" y="65" width="920" height="1368" rx="20" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="14 8"/>

  <!-- Schnitzrillen & Kürbis-Rippen (Strukturierung des Hintergrunds) -->
  <g stroke="#9a3412" stroke-width="3.5" fill="none" opacity="0.45">
    <path d="M 525 65 Q 325 350 325 749 Q 325 1148 525 1433"/>
    <path d="M 525 65 Q 725 350 725 749 Q 725 1148 525 1433"/>
    <path d="M 525 65 Q 185 380 185 749 Q 185 1118 525 1433"/>
    <path d="M 525 65 Q 865 380 865 749 Q 865 1118 525 1433"/>
  </g>

  <!-- 4 Eckspangen: Geschmiedete Herbst-Eichenblätter mit Eicheln -->
  <g fill="url(#autumnCopper)" stroke="#431407" stroke-width="3">
    <!-- Oben Links -->
    <path d="M 65 160 C 85 140 110 145 130 130 C 145 110 140 85 160 65 L 65 65 Z"/>
    <circle cx="125" cy="125" r="10" fill="#fde047"/>
    <!-- Oben Rechts -->
    <path d="M 985 160 C 965 140 940 145 920 130 C 905 110 910 85 890 65 L 985 65 Z"/>
    <circle cx="925" cy="125" r="10" fill="#fde047"/>
    <!-- Unten Links -->
    <path d="M 65 1338 C 85 1358 110 1353 130 1368 C 145 1388 140 1413 160 1433 L 65 1433 Z"/>
    <circle cx="125" cy="1373" r="10" fill="#fde047"/>
    <!-- Unten Rechts -->
    <path d="M 985 1338 C 965 1358 940 1353 920 1368 C 905 1388 910 1413 890 1433 L 985 1433 Z"/>
    <circle cx="925" cy="1373" r="10" fill="#fde047"/>
  </g>

  <!-- Mittlere glühende Feuerkammer -->
  <circle cx="525" cy="749" r="300" fill="url(#pumpkinBase)" stroke="url(#autumnCopper)" stroke-width="10"/>
  <circle cx="525" cy="749" r="275" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- Großes Furchterregendes Jack-O'-Lantern Fratzengesicht (Kürbiskönig) -->
  <g transform="translate(525, 749)" filter="url(#fireGlow)">
    <!-- Glühende dreieckige Augen (Teuflisch geschlitzt) -->
    <!-- Linkes Auge -->
    <polygon points="-120,-60 -50,-30 -80,-110" fill="url(#fireJack)" stroke="#450a0a" stroke-width="4"/>
    <!-- Rechtes Auge -->
    <polygon points="120,-60 50,-30 80,-110" fill="url(#fireJack)" stroke="#450a0a" stroke-width="4"/>
    
    <!-- Gezackte Schnitznase -->
    <polygon points="0,-40 -25,10 25,10" fill="url(#fireJack)" stroke="#450a0a" stroke-width="3"/>

    <!-- Breites, grinsendes Teufelsgebiss mit Reißzähnen -->
    <path d="M -160 50 C -100 130 100 130 160 50 L 130 50 L 105 85 L 80 50 L 55 85 L 30 50 L 0 85 L -30 50 L -55 85 L -80 50 L -105 85 L -130 50 Z" fill="url(#fireJack)" stroke="#450a0a" stroke-width="5"/>
    <!-- Untere Zähne -->
    <path d="M -130 75 L -110 110 L -90 85 L -70 115 L -50 90 L -25 120 L 0 95 L 25 120 L 50 90 L 70 115 L 90 85 L 110 110 L 130 75" stroke="#fde047" stroke-width="4" fill="none"/>
  </g>

  <!-- Krone des Kürbiskönigs (Dornige Herbstkrone) -->
  <g transform="translate(525, 539)" fill="url(#autumnCopper)" stroke="#431407" stroke-width="4" filter="url(#fireGlow)">
    <polygon points="0,-45 40,25 90,-25 70,45 -70,45 -90,-25 -40,25"/>
    <circle cx="0" cy="-45" r="8" fill="#fde047"/>
    <circle cx="90" cy="-25" r="7" fill="#fde047"/>
    <circle cx="-90" cy="-25" r="7" fill="#fde047"/>
  </g>
</svg>
