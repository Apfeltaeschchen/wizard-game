<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Tiefes Mahagoni & Obsidianglanz -->
    <radialGradient id="mahoganyBase" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#270e02"/>
      <stop offset="75%" stop-color="#120601"/>
      <stop offset="100%" stop-color="#050100"/>
    </radialGradient>
    <!-- Antik-Messing & Barockgold -->
    <linearGradient id="antiqueBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="55%" stop-color="#ca8a04"/>
      <stop offset="85%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- Kerzenwachs (Elfenbein / Bienenwachs) -->
    <linearGradient id="waxPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Kerzenflamme (Warmes Schichtfeuer) -->
    <radialGradient id="flameGlow" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <!-- Schimmernde Perlenbeeren -->
    <radialGradient id="pearlBerry" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <filter id="candleAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="candleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Kartenkörper aus tiefem Mahagoniholz -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#mahoganyBase)" stroke="#050100" stroke-width="8"/>

  <!-- Jahresringe & feine Holzmaserung im Hintergrund -->
  <g stroke="#78350f" stroke-width="1.2" opacity="0.3" fill="none">
    <ellipse cx="525" cy="749" rx="450" ry="650"/>
    <ellipse cx="525" cy="749" rx="370" ry="540"/>
    <ellipse cx="525" cy="749" rx="290" ry="430"/>
    <ellipse cx="525" cy="749" rx="210" ry="320"/>
  </g>

  <!-- Äußerer Rahmen aus antikem Barock-Messing -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#antiqueBrass)" stroke-width="14" filter="url(#candleShadow)"/>
  <rect x="66" y="66" width="918" height="1366" rx="20" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.85"/>
  <rect x="80" y="80" width="890" height="1338" rx="14" fill="none" stroke="url(#antiqueBrass)" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- Geschwungene Mistelranken entlang der Bordüre -->
  <g fill="none" stroke="url(#antiqueBrass)" stroke-width="6" stroke-linecap="round">
    <path d="M 85 240 Q 180 180 200 85 M 120 150 Q 210 130 250 85"/>
    <path d="M 965 240 Q 870 180 850 85 M 930 150 Q 840 130 800 85"/>
    <path d="M 85 1258 Q 180 1318 200 1413 M 120 1348 Q 210 1368 250 1413"/>
    <path d="M 965 1258 Q 870 1318 850 1413 M 930 1348 Q 840 1368 800 1413"/>
  </g>

  <!-- Mistel-Perlenbeeren -->
  <g fill="url(#pearlBerry)" stroke="#334155" stroke-width="1.5">
    <circle cx="150" cy="140" r="10"/><circle cx="170" cy="120" r="9"/><circle cx="135" cy="165" r="9"/>
    <circle cx="900" cy="140" r="10"/><circle cx="880" cy="120" r="9"/><circle cx="915" cy="165" r="9"/>
    <circle cx="150" cy="1358" r="10"/><circle cx="170" cy="1378" r="9"/><circle cx="135" cy="1333" r="9"/>
    <circle cx="900" cy="1358" r="10"/><circle cx="880" cy="1378" r="9"/><circle cx="915" cy="1333" r="9"/>
  </g>

  <!-- 4 Voll Ausmodellierte Geweihte Altarkerzen ("wenn du eine Kerze siehst, dann mach eine Kerze") -->
  <!-- Kerze 1: Oben Links -->
  <g transform="translate(140, 230)" filter="url(#candleShadow)">
    <!-- Messingleuchter-Wandarm -->
    <path d="M -25 70 Q 0 85 0 110" fill="none" stroke="url(#antiqueBrass)" stroke-width="8"/>
    <!-- Tropfteller & Kerzenhalterung -->
    <ellipse cx="0" cy="70" rx="26" ry="8" fill="url(#antiqueBrass)" stroke="#451a03" stroke-width="2"/>
    <polygon points="-16,70 16,70 12,85 -12,85" fill="url(#antiqueBrass)"/>
    <!-- Wachszylinder mit weichem Schatten -->
    <rect x="-14" y="-30" width="28" height="100" rx="4" fill="url(#waxPillar)" stroke="#b45309" stroke-width="2"/>
    <!-- Wachsmulde & Tropfrand -->
    <ellipse cx="0" cy="-30" rx="14" ry="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <!-- Seitlicher Wachstropfen -->
    <path d="M -14 -10 Q -18 5 -14 20" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <!-- Docht -->
    <path d="M 0 -30 Q 3 -38 0 -44" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Weicher Kerzenschein & Flamme -->
    <circle cx="0" cy="-65" r="45" fill="#f97316" opacity="0.25" filter="url(#candleAura)"/>
    <path d="M 0 -88 C 16 -65 14 -46 0 -44 C -14 -46 -16 -65 0 -88 Z" fill="url(#flameGlow)" filter="url(#candleAura)"/>
    <!-- Innerer weißer Lichtkern & blauer Fußpunkt -->
    <path d="M 0 -72 C 8 -56 7 -46 0 -44 C -7 -46 -8 -56 0 -72 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="-44" rx="4" ry="2" fill="#38bdf8"/>
  </g>

  <!-- Kerze 2: Oben Rechts -->
  <g transform="translate(910, 230)" filter="url(#candleShadow)">
    <path d="M 25 70 Q 0 85 0 110" fill="none" stroke="url(#antiqueBrass)" stroke-width="8"/>
    <ellipse cx="0" cy="70" rx="26" ry="8" fill="url(#antiqueBrass)" stroke="#451a03" stroke-width="2"/>
    <polygon points="-16,70 16,70 12,85 -12,85" fill="url(#antiqueBrass)"/>
    <rect x="-14" y="-30" width="28" height="100" rx="4" fill="url(#waxPillar)" stroke="#b45309" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="14" ry="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 14 -10 Q 18 5 14 20" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -30 Q -3 -38 0 -44" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-65" r="45" fill="#f97316" opacity="0.25" filter="url(#candleAura)"/>
    <path d="M 0 -88 C 16 -65 14 -46 0 -44 C -14 -46 -16 -65 0 -88 Z" fill="url(#flameGlow)" filter="url(#candleAura)"/>
    <path d="M 0 -72 C 8 -56 7 -46 0 -44 C -7 -46 -8 -56 0 -72 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="-44" rx="4" ry="2" fill="#38bdf8"/>
  </g>

  <!-- Kerze 3: Unten Links -->
  <g transform="translate(140, 1268)" filter="url(#candleShadow)">
    <path d="M -25 -70 Q 0 -85 0 -110" fill="none" stroke="url(#antiqueBrass)" stroke-width="8"/>
    <ellipse cx="0" cy="-70" rx="26" ry="8" fill="url(#antiqueBrass)" stroke="#451a03" stroke-width="2"/>
    <polygon points="-16,-70 16,-70 12,-85 -12,-85" fill="url(#antiqueBrass)"/>
    <rect x="-14" y="-70" width="28" height="100" rx="4" fill="url(#waxPillar)" stroke="#b45309" stroke-width="2"/>
    <ellipse cx="0" cy="30" rx="14" ry="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <path d="M -14 10 Q -18 -5 -14 -20" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 30 Q 3 38 0 44" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="65" r="45" fill="#f97316" opacity="0.25" filter="url(#candleAura)"/>
    <path d="M 0 88 C 16 65 14 46 0 44 C -14 46 -16 65 0 88 Z" fill="url(#flameGlow)" filter="url(#candleAura)"/>
    <path d="M 0 72 C 8 56 7 46 0 44 C -7 46 -8 56 0 72 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="44" rx="4" ry="2" fill="#38bdf8"/>
  </g>

  <!-- Kerze 4: Unten Rechts -->
  <g transform="translate(910, 1268)" filter="url(#candleShadow)">
    <path d="M 25 -70 Q 0 -85 0 -110" fill="none" stroke="url(#antiqueBrass)" stroke-width="8"/>
    <ellipse cx="0" cy="-70" rx="26" ry="8" fill="url(#antiqueBrass)" stroke="#451a03" stroke-width="2"/>
    <polygon points="-16,-70 16,-70 12,-85 -12,-85" fill="url(#antiqueBrass)"/>
    <rect x="-14" y="-70" width="28" height="100" rx="4" fill="url(#waxPillar)" stroke="#b45309" stroke-width="2"/>
    <ellipse cx="0" cy="30" rx="14" ry="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <path d="M 14 10 Q 18 -5 14 -20" fill="none" stroke="#fef3c7" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 30 Q -3 38 0 44" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="65" r="45" fill="#f97316" opacity="0.25" filter="url(#candleAura)"/>
    <path d="M 0 88 C 16 65 14 46 0 44 C -14 46 -16 65 0 88 Z" fill="url(#flameGlow)" filter="url(#candleAura)"/>
    <path d="M 0 72 C 8 56 7 46 0 44 C -7 46 -8 56 0 72 Z" fill="#ffffff"/>
    <ellipse cx="0" cy="44" rx="4" ry="2" fill="#38bdf8"/>
  </g>

  <!-- Großes Zentrum: Geometrisches Sonnenwend-Astrolabium -->
  <circle cx="525" cy="749" r="310" fill="none" stroke="url(#antiqueBrass)" stroke-width="14" filter="url(#candleShadow)"/>
  <circle cx="525" cy="749" r="280" fill="none" stroke="#fde047" stroke-width="3" stroke-dasharray="16 10"/>
  <circle cx="525" cy="749" r="255" fill="#200b03" stroke="url(#antiqueBrass)" stroke-width="6"/>

  <!-- 12 Präzise Speichen des Sonnenwend-Astrolabiums -->
  <g stroke="url(#antiqueBrass)" stroke-width="4" opacity="0.8">
    <line x1="525" y1="494" x2="525" y2="1004"/>
    <line x1="270" y1="749" x2="780" y2="749"/>
    <line x1="345" y1="569" x2="705" y2="929"/>
    <line x1="345" y1="929" x2="705" y2="569"/>
  </g>

  <!-- Heilige Opferschale & Lodernde Sonnenwendflamme im Zentrum -->
  <circle cx="525" cy="749" r="160" fill="url(#mahoganyBase)" stroke="url(#antiqueBrass)" stroke-width="8"/>
  <circle cx="525" cy="749" r="130" fill="#f97316" opacity="0.3" filter="url(#candleAura)"/>

  <!-- Große Zentralflamme -->
  <g filter="url(#candleAura)">
    <!-- Äußere Flamme -->
    <path d="M 525 615 C 575 665 590 735 560 790 C 530 835 470 830 460 770 C 455 735 480 705 485 675 C 495 645 515 625 525 615 Z" fill="url(#flameGlow)"/>
    <!-- Heller Kern -->
    <path d="M 525 655 C 555 695 565 745 540 780 C 520 805 490 800 485 765 C 480 745 500 720 505 695 C 510 675 520 660 525 655 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="525" cy="755" r="16" fill="#fef08a"/>
  </g>
</svg>
