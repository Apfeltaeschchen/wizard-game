<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Tannengrün & Festtags-Schattierung -->
    <radialGradient id="pineVelvet" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="40%" stop-color="#14532d"/>
      <stop offset="75%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#02140a"/>
    </radialGradient>
    <!-- Poliertes Messing & Festtags-Gold -->
    <linearGradient id="brassOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="75%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <!-- Tiefroter kaiserlicher Siegellack -->
    <radialGradient id="waxSeal" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="65%" stop-color="#991b1b"/>
      <stop offset="90%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <!-- Rubinrotes Samtband -->
    <linearGradient id="rubyRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="30%" stop-color="#b91c1c"/>
      <stop offset="70%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <!-- Siegel-Schlagschatten -->
    <filter id="sealShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Kartenkörper aus tannengrünem Königssamt -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#pineVelvet)" stroke="#02140a" stroke-width="8"/>

  <!-- Geometrische Rauten-Steppung im Hintergrund -->
  <g stroke="#166534" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M 525 60 L 975 749 L 525 1438 L 75 749 Z"/>
    <path d="M 525 150 L 885 749 L 525 1348 L 165 749 Z"/>
    <path d="M 525 240 L 795 749 L 525 1258 L 255 749 Z"/>
    <path d="M 525 330 L 705 749 L 525 1168 L 345 749 Z"/>
    <circle cx="525" cy="749" r="540"/>
    <circle cx="525" cy="749" r="460" stroke-dasharray="10 8"/>
  </g>

  <!-- Äußerer gravierter Messingrahmen -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#brassOuter)" stroke-width="14" filter="url(#sealShadow)"/>
  <rect x="66" y="66" width="918" height="1366" rx="20" fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.85"/>
  <rect x="80" y="80" width="890" height="1338" rx="14" fill="none" stroke="url(#brassOuter)" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Symmetrisch gekreuzte rote Festtagsbänder (Über alle 4 Ecken) -->
  <g fill="none" stroke="url(#rubyRibbon)" stroke-width="32" filter="url(#sealShadow)">
    <line x1="45" y1="280" x2="280" y2="45"/>
    <line x1="1005" y1="280" x2="770" y2="45"/>
    <line x1="45" y1="1218" x2="280" y2="1453"/>
    <line x1="1005" y1="1218" x2="770" y2="1453"/>
  </g>
  <!-- Ziernaht auf den Bändern -->
  <g fill="none" stroke="#fef08a" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.8">
    <line x1="45" y1="280" x2="280" y2="45"/>
    <line x1="1005" y1="280" x2="770" y2="45"/>
    <line x1="45" y1="1218" x2="280" y2="1453"/>
    <line x1="1005" y1="1218" x2="770" y2="1453"/>
  </g>
  <!-- Messing-Eckrosetten & Goldnieten an den Bändern -->
  <g fill="url(#brassOuter)" stroke="#451a03" stroke-width="2.5" filter="url(#sealShadow)">
    <!-- Oben Links -->
    <circle cx="70" cy="255" r="14"/><circle cx="255" cy="70" r="14"/>
    <!-- Oben Rechts -->
    <circle cx="980" cy="255" r="14"/><circle cx="795" cy="70" r="14"/>
    <!-- Unten Links -->
    <circle cx="70" cy="1243" r="14"/><circle cx="255" cy="1428" r="14"/>
    <!-- Unten Rechts -->
    <circle cx="980" cy="1243" r="14"/><circle cx="795" cy="1428" r="14"/>
  </g>

  <!-- Tannenzweig-Bögen & Beeren (4 Ecken, spiegelbildlich) -->
  <g stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Oben Links -->
    <path d="M 110 110 Q 180 130 240 100 M 130 150 Q 170 190 200 230"/>
    <!-- Oben Rechts -->
    <path d="M 940 110 Q 870 130 810 100 M 920 150 Q 880 190 850 230"/>
    <!-- Unten Links -->
    <path d="M 110 1388 Q 180 1368 240 1398 M 130 1348 Q 170 1308 200 1268"/>
    <!-- Unten Rechts -->
    <path d="M 940 1388 Q 870 1368 810 1398 M 920 1348 Q 880 1308 850 1268"/>
  </g>
  <!-- Festtagsbeeren (Rubinrot & Gold) -->
  <g fill="#dc2626" stroke="#450a0a" stroke-width="1.5">
    <circle cx="160" cy="120" r="8"/><circle cx="180" cy="135" r="7"/><circle cx="145" cy="140" r="7"/>
    <circle cx="890" cy="120" r="8"/><circle cx="870" cy="135" r="7"/><circle cx="905" cy="140" r="7"/>
    <circle cx="160" cy="1378" r="8"/><circle cx="180" cy="1363" r="7"/><circle cx="145" cy="1358" r="7"/>
    <circle cx="890" cy="1378" r="8"/><circle cx="870" cy="1363" r="7"/><circle cx="905" cy="1358" r="7"/>
  </g>

  <!-- Großes geometrisches Zentrum: Makelloser Kreis-Siegellack -->
  <!-- Äußerer konzentrischer Goldreif -->
  <circle cx="525" cy="749" r="320" fill="none" stroke="url(#brassOuter)" stroke-width="10" filter="url(#sealShadow)"/>
  <circle cx="525" cy="749" r="290" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="14 10"/>

  <!-- Das Echte Wachssiegel: Makelloser, kreisrunder Körper mit konzentrischer Prägung -->
  <circle cx="525" cy="749" r="240" fill="url(#waxSeal)" stroke="#450a0a" stroke-width="8" filter="url(#sealShadow)"/>
  <circle cx="525" cy="749" r="215" fill="none" stroke="#dc2626" stroke-width="4" opacity="0.8"/>
  <circle cx="525" cy="749" r="185" fill="none" stroke="#7f1d1d" stroke-width="5"/>

  <!-- 12 Konzentrische Prägepunkte im 30°-Abstand auf dem Siegelrand -->
  <g fill="url(#brassOuter)" stroke="#450a0a" stroke-width="1.5">
    <circle cx="525" cy="549" r="8"/>
    <circle cx="625" cy="576" r="8"/>
    <circle cx="698" cy="649" r="8"/>
    <circle cx="725" cy="749" r="8"/>
    <circle cx="698" cy="849" r="8"/>
    <circle cx="625" cy="922" r="8"/>
    <circle cx="525" cy="949" r="8"/>
    <circle cx="425" cy="922" r="8"/>
    <circle cx="352" cy="849" r="8"/>
    <circle cx="325" cy="749" r="8"/>
    <circle cx="352" cy="649" r="8"/>
    <circle cx="425" cy="576" r="8"/>
  </g>

  <!-- Erhabene 6-strahlige Gold-Schneeflocke im Siegel (Mathematisch exakt, 60°-Winkel) -->
  <g stroke="url(#brassOuter)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#softGlow)">
    <!-- 3 Hauptachsen (0°, 60°, 120°) -->
    <line x1="525" y1="609" x2="525" y2="889"/>
    <line x1="404" y1="679" x2="646" y2="819"/>
    <line x1="404" y1="819" x2="646" y2="679"/>

    <!-- Symmetrische V-Verzweigungen an allen 6 Enden -->
    <!-- Oben / Unten -->
    <path d="M 525 649 L 500 629 M 525 649 L 550 629"/>
    <path d="M 525 849 L 500 869 M 525 849 L 550 869"/>
    <!-- Oben-Rechts / Unten-Links -->
    <path d="M 611 699 L 626 674 M 611 699 L 606 724"/>
    <path d="M 439 799 L 424 824 M 439 799 L 444 774"/>
    <!-- Unten-Rechts / Oben-Links -->
    <path d="M 611 799 L 626 824 M 611 799 L 606 774"/>
    <path d="M 439 699 L 424 674 M 439 699 L 444 724"/>
  </g>

  <!-- Zentraler diamantener Reingold-Knopf -->
  <circle cx="525" cy="749" r="28" fill="url(#brassOuter)" stroke="#451a03" stroke-width="4"/>
  <circle cx="525" cy="749" r="16" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="520" cy="744" r="6" fill="#ffffff"/>
</svg>
