<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Gletschertiefe & Mitternachtsblau -->
    <radialGradient id="glacierDepth" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <!-- Sterlingsilber & Platin -->
    <linearGradient id="frostSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Leuchtendes Frost-Cyan -->
    <radialGradient id="frostGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#bae6fd"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="silverDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Kartenkörper aus tiefem Gletschereis -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#glacierDepth)" stroke="#030712" stroke-width="8"/>

  <!-- Subtiles Fraktales Eiskristall-Muster im Hintergrund -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.18" fill="none">
    <path d="M 525 80 L 970 749 L 525 1418 L 80 749 Z"/>
    <circle cx="525" cy="749" r="540"/>
    <circle cx="525" cy="749" r="480" stroke-dasharray="10 8"/>
    <line x1="525" y1="80" x2="525" y2="1418"/>
    <line x1="80" y1="749" x2="970" y2="749"/>
    <line x1="210" y1="210" x2="840" y2="1288"/>
    <line x1="210" y1="1288" x2="840" y2="210"/>
  </g>

  <!-- Äußere Prunkbordüre aus Sterlingsilber -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#frostSilver)" stroke-width="14" filter="url(#silverDrop)"/>
  <rect x="66" y="66" width="918" height="1366" rx="20" fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.8"/>
  <rect x="80" y="80" width="890" height="1338" rx="14" fill="none" stroke="url(#frostSilver)" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Gotische Fialen & Eiszapfen-Maßwerk (Oben & Unten) -->
  <g fill="url(#frostSilver)" stroke="#0f172a" stroke-width="2" filter="url(#silverDrop)">
    <!-- Eiszapfen Oben -->
    <polygon points="525,80 540,190 525,230 510,190"/>
    <polygon points="460,80 472,170 460,195 448,170"/>
    <polygon points="590,80 602,170 590,195 578,170"/>
    <polygon points="395,80 405,150 395,170 385,150"/>
    <polygon points="655,80 665,150 655,170 645,150"/>

    <!-- Eiszapfen Unten (gespiegelt) -->
    <polygon points="525,1418 540,1308 525,1268 510,1308"/>
    <polygon points="460,1418 472,1328 460,1303 448,1328"/>
    <polygon points="590,1418 602,1328 590,1303 578,1328"/>
    <polygon points="395,1418 405,1348 395,1328 385,1348"/>
    <polygon points="655,1418 665,1348 655,1328 645,1348"/>
  </g>

  <!-- 4 Eck-Eiskristalle in Silberfassung -->
  <g fill="url(#frostGlow)" stroke="url(#frostSilver)" stroke-width="3" filter="url(#iceGlow)">
    <!-- Oben Links -->
    <g transform="translate(135, 135)">
      <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10"/>
      <circle cx="0" cy="0" r="8" fill="#fff"/>
    </g>
    <!-- Oben Rechts -->
    <g transform="translate(915, 135)">
      <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10"/>
      <circle cx="0" cy="0" r="8" fill="#fff"/>
    </g>
    <!-- Unten Links -->
    <g transform="translate(135, 1363)">
      <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10"/>
      <circle cx="0" cy="0" r="8" fill="#fff"/>
    </g>
    <!-- Unten Rechts -->
    <g transform="translate(915, 1363)">
      <polygon points="0,-40 10,-10 40,0 10,10 0,40 -10,10 -40,0 -10,-10"/>
      <circle cx="0" cy="0" r="8" fill="#fff"/>
    </g>
  </g>

  <!-- Äußerer Silberring um das Mandala -->
  <circle cx="525" cy="749" r="330" fill="none" stroke="url(#frostSilver)" stroke-width="12" filter="url(#silverDrop)"/>
  <circle cx="525" cy="749" r="305" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 10" opacity="0.8"/>
  <circle cx="525" cy="749" r="285" fill="#09142e" stroke="url(#frostSilver)" stroke-width="5"/>

  <!-- Großes 12-strahliges Eiskristall-Mandala -->
  <!-- 12 Primär-Eisspeere -->
  <g fill="url(#frostGlow)" stroke="url(#frostSilver)" stroke-width="3" filter="url(#iceGlow)">
    <!-- 0 Grad (Oben) -->
    <polygon points="525,480 542,700 525,749 508,700"/>
    <!-- 180 Grad (Unten) -->
    <polygon points="525,1018 542,798 525,749 508,798"/>
    <!-- 90 Grad (Rechts) -->
    <polygon points="794,749 574,766 525,749 574,732"/>
    <!-- 270 Grad (Links) -->
    <polygon points="256,749 476,766 525,749 476,732"/>

    <!-- 30 Grad -->
    <polygon points="659,516 564,710 525,749 539,696"/>
    <!-- 60 Grad -->
    <polygon points="758,615 578,735 525,749 564,710"/>
    <!-- 120 Grad -->
    <polygon points="758,883 564,788 525,749 578,763"/>
    <!-- 150 Grad -->
    <polygon points="659,982 539,802 525,749 564,788"/>
    <!-- 210 Grad -->
    <polygon points="391,982 486,788 525,749 511,802"/>
    <!-- 240 Grad -->
    <polygon points="292,883 472,763 525,749 486,788"/>
    <!-- 300 Grad -->
    <polygon points="292,615 486,710 525,749 472,735"/>
    <!-- 330 Grad -->
    <polygon points="391,516 511,696 525,749 486,710"/>
  </g>

  <!-- 12 Sekundäre silberne Eiskronen-Spitzen -->
  <g fill="url(#frostSilver)" stroke="#09142e" stroke-width="2">
    <!-- Diagonalen 45, 135, 225, 315 -->
    <polygon points="695,579 560,725 525,749 540,714"/>
    <polygon points="695,919 540,784 525,749 560,773"/>
    <polygon points="355,919 490,773 525,749 510,784"/>
    <polygon points="355,579 510,714 525,749 490,725"/>
  </g>

  <!-- Innerer azurblauer Eiskern -->
  <circle cx="525" cy="749" r="110" fill="url(#glacierDepth)" stroke="url(#frostSilver)" stroke-width="7"/>
  <circle cx="525" cy="749" r="85" fill="none" stroke="#bae6fd" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Zentraler Raureif-Brillant -->
  <polygon points="525,690 567,749 525,808 483,749" fill="url(#frostGlow)" stroke="#ffffff" stroke-width="3.5" filter="url(#iceGlow)"/>
  <circle cx="516" cy="738" r="9" fill="#ffffff" opacity="0.95"/>
</svg>
