<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Tiefes Gletschereis & Mitternachtsblau -->
    <radialGradient id="frostIceBase" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <!-- Sterlingsilber & Platin -->
    <linearGradient id="sterlingSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Leuchtendes Eis-Cyan -->
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#bae6fd"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="silverShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Kartenkörper aus spiegelglattem Gletschereis -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#frostIceBase)" stroke="#030712" stroke-width="8"/>

  <!-- Geometrisches Sternennetz im Hintergrund -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.22" fill="none">
    <path d="M 525 80 L 970 749 L 525 1418 L 80 749 Z"/>
    <circle cx="525" cy="749" r="540"/>
    <circle cx="525" cy="749" r="480" stroke-dasharray="10 8"/>
    <line x1="525" y1="80" x2="525" y2="1418"/>
    <line x1="80" y1="749" x2="970" y2="749"/>
  </g>

  <!-- Äußerer Rahmen aus geschlagenem Sterlingsilber -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#sterlingSilver)" stroke-width="14" filter="url(#silverShadow)"/>
  <rect x="66" y="66" width="918" height="1366" rx="20" fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.85"/>
  <rect x="80" y="80" width="890" height="1338" rx="14" fill="none" stroke="url(#sterlingSilver)" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Gotische Fialenspitzen (Oben & Unten, exakt zentriert) -->
  <g fill="url(#sterlingSilver)" stroke="#090d16" stroke-width="2" filter="url(#silverShadow)">
    <!-- Oben -->
    <polygon points="525,80 540,180 525,220 510,180"/>
    <polygon points="460,80 472,165 460,195 448,165"/>
    <polygon points="590,80 602,165 590,195 578,165"/>
    <polygon points="395,80 405,145 395,170 385,145"/>
    <polygon points="655,80 665,145 655,170 645,145"/>
    <!-- Unten (gespiegelt) -->
    <polygon points="525,1418 540,1318 525,1278 510,1318"/>
    <polygon points="460,1418 472,1333 460,1303 448,1333"/>
    <polygon points="590,1418 602,1333 590,1303 578,1333"/>
    <polygon points="395,1418 405,1353 395,1328 385,1353"/>
    <polygon points="655,1418 665,1353 655,1328 645,1353"/>
  </g>

  <!-- 4 Eck-Ornamente: Silberne Eiskristall-Medaillons -->
  <g filter="url(#iceGlow)">
    <!-- Oben Links -->
    <g transform="translate(130, 130)">
      <polygon points="0,-45 12,-12 45,0 12,12 0,45 -12,12 -45,0 -12,-12" fill="url(#sterlingSilver)" stroke="#0f172a" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="url(#cyanCore)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="5" fill="#ffffff"/>
    </g>
    <!-- Oben Rechts -->
    <g transform="translate(920, 130)">
      <polygon points="0,-45 12,-12 45,0 12,12 0,45 -12,12 -45,0 -12,-12" fill="url(#sterlingSilver)" stroke="#0f172a" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="url(#cyanCore)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="5" fill="#ffffff"/>
    </g>
    <!-- Unten Links -->
    <g transform="translate(130, 1368)">
      <polygon points="0,-45 12,-12 45,0 12,12 0,45 -12,12 -45,0 -12,-12" fill="url(#sterlingSilver)" stroke="#0f172a" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="url(#cyanCore)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="5" fill="#ffffff"/>
    </g>
    <!-- Unten Rechts -->
    <g transform="translate(920, 1368)">
      <polygon points="0,-45 12,-12 45,0 12,12 0,45 -12,12 -45,0 -12,-12" fill="url(#sterlingSilver)" stroke="#0f172a" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="url(#cyanCore)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-3" cy="-3" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Großes Zentrales 12-strahliges Eiskristall-Mandala -->
  <!-- Äußerer Silberring mit Skalenteilung -->
  <circle cx="525" cy="749" r="330" fill="none" stroke="url(#sterlingSilver)" stroke-width="12" filter="url(#silverShadow)"/>
  <circle cx="525" cy="749" r="305" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="14 10"/>
  <circle cx="525" cy="749" r="285" fill="#09142e" stroke="url(#sterlingSilver)" stroke-width="6"/>

  <!-- Die 12 Primär-Speere aus leuchtendem Eis-Cyan (Exakt 30°-Schritte) -->
  <g fill="url(#cyanCore)" stroke="url(#sterlingSilver)" stroke-width="3" filter="url(#iceGlow)">
    <!-- 0° (Oben) -->
    <polygon points="525,479 542,709 525,749 508,709"/>
    <!-- 30° -->
    <polygon points="660,515 565,710 525,749 539,696"/>
    <!-- 60° -->
    <polygon points="759,614 579,735 525,749 565,710"/>
    <!-- 90° (Rechts) -->
    <polygon points="795,749 575,766 525,749 575,732"/>
    <!-- 120° -->
    <polygon points="759,884 565,788 525,749 579,763"/>
    <!-- 150° -->
    <polygon points="660,983 539,802 525,749 565,788"/>
    <!-- 180° (Unten) -->
    <polygon points="525,1019 542,789 525,749 508,789"/>
    <!-- 210° -->
    <polygon points="390,983 485,788 525,749 511,802"/>
    <!-- 240° -->
    <polygon points="291,884 471,763 525,749 485,788"/>
    <!-- 270° (Links) -->
    <polygon points="255,749 475,766 525,749 475,732"/>
    <!-- 300° -->
    <polygon points="291,614 485,710 525,749 471,735"/>
    <!-- 330° -->
    <polygon points="390,515 511,696 525,749 485,710"/>
  </g>

  <!-- 12 Sekundäre silberne Eiskristallspitzen (Diagonal versetzt) -->
  <g fill="url(#sterlingSilver)" stroke="#09142e" stroke-width="2">
    <polygon points="695,579 560,725 525,749 540,714"/>
    <polygon points="695,919 540,784 525,749 560,773"/>
    <polygon points="355,919 490,773 525,749 510,784"/>
    <polygon points="355,579 510,714 525,749 490,725"/>
  </g>

  <!-- Innerer azurblauer Eiskern -->
  <circle cx="525" cy="749" r="120" fill="url(#frostIceBase)" stroke="url(#sterlingSilver)" stroke-width="8"/>
  <circle cx="525" cy="749" r="95" fill="none" stroke="#bae6fd" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Zentraler 8-zackiger Raureif-Brillant -->
  <g fill="url(#cyanCore)" stroke="#ffffff" stroke-width="3" filter="url(#iceGlow)">
    <polygon points="525,679 540,734 595,749 540,764 525,819 510,764 455,749 510,734"/>
    <polygon points="574,700 536,739 574,798 514,760 476,798 514,739 476,700 536,760" fill="#ffffff" opacity="0.6"/>
  </g>
  <circle cx="525" cy="749" r="18" fill="#ffffff"/>
  <circle cx="520" cy="744" r="6" fill="#e0f2fe"/>
</svg>
