<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <radialGradient id="cardGrad_star_of_bethlehem" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <filter id="cardShadow_star_of_bethlehem"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/></filter>
  </defs>
  <!-- Card Back Exterior Rim -->
  <rect x="25" y="25" width="1000" height="1448" rx="65" fill="#030712" stroke="#fbbf24" stroke-width="18" filter="url(#cardShadow_star_of_bethlehem)"/>
  <!-- Inner Guilloche Border -->
  <rect x="65" y="65" width="920" height="1368" rx="45" fill="url(#cardGrad_star_of_bethlehem)" stroke="#fbbf24" stroke-width="4" stroke-dasharray="12,8"/>
  <rect x="85" y="85" width="880" height="1328" rx="35" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <!-- Center Starburst / Medallion -->
  <circle cx="525" cy="749" r="220" fill="#030712" stroke="#fbbf24" stroke-width="6"/>
  <circle cx="525" cy="749" r="195" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- Thematic Symbol -->
  <text x="525" y="785" font-family="'Cinzel Decorative', 'Times New Roman', serif" font-size="110" font-weight="bold" fill="#fbbf24" text-anchor="middle">⭐</text>
  <!-- Corner Ornaments -->
  <circle cx="130" cy="130" r="20" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="920" cy="130" r="20" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="130" cy="1368" r="20" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <circle cx="920" cy="1368" r="20" fill="none" stroke="#fbbf24" stroke-width="3"/>
</svg>