<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Kosmischer Deep Space -->
    <radialGradient id="spaceBase" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="celestialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="stellarSilver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Kosmischer Sternenhimmel-Körper -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#spaceBase)" stroke="#0b0f19" stroke-width="8"/>

  <!-- Funkelnde Fixsterne & Konstellationen -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="120" cy="180" r="3"/>
    <circle cx="180" cy="240" r="2"/>
    <circle cx="260" cy="140" r="4" filter="url(#starGlow)"/>
    <circle cx="380" cy="210" r="2.5"/>
    <circle cx="890" cy="170" r="3.5" filter="url(#starGlow)"/>
    <circle cx="820" cy="260" r="2"/>
    <circle cx="730" cy="150" r="3"/>
    <circle cx="150" cy="1320" r="3"/>
    <circle cx="240" cy="1260" r="4" filter="url(#starGlow)"/>
    <circle cx="880" cy="1340" r="3.5" filter="url(#starGlow)"/>
    <circle cx="780" cy="1280" r="2.5"/>
    <!-- Konstellations-Linien -->
    <path d="M 120 180 L 180 240 L 260 140 L 380 210" stroke="#818cf8" stroke-width="1.2" opacity="0.4" fill="none"/>
    <path d="M 890 170 L 820 260 L 730 150" stroke="#818cf8" stroke-width="1.2" opacity="0.4" fill="none"/>
  </g>

  <!-- Äußerer Himmelsmechanik-Rahmen mit Tierkreis-Teilung -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#stellarSilver)" stroke-width="14"/>
  <rect x="65" y="65" width="920" height="1368" rx="20" fill="none" stroke="url(#celestialGold)" stroke-width="3" stroke-dasharray="12 6"/>

  <!-- 4 Eck-Astrolabien (Viertel-Kreise mit Skalenteilung) -->
  <g stroke="url(#celestialGold)" stroke-width="3" fill="none" opacity="0.75">
    <!-- Oben Links -->
    <path d="M 65 240 A 175 175 0 0 0 240 65"/>
    <path d="M 65 190 A 125 125 0 0 0 190 65" stroke-dasharray="6 4"/>
    <line x1="65" y1="65" x2="190" y2="190" stroke-width="2"/>
    <!-- Oben Rechts -->
    <path d="M 985 240 A 175 175 0 0 1 810 65"/>
    <path d="M 985 190 A 125 125 0 0 1 860 65" stroke-dasharray="6 4"/>
    <line x1="985" y1="65" x2="860" y2="190" stroke-width="2"/>
    <!-- Unten Links -->
    <path d="M 65 1258 A 175 175 0 0 1 240 1433"/>
    <path d="M 65 1308 A 125 125 0 0 1 190 1433" stroke-dasharray="6 4"/>
    <!-- Unten Rechts -->
    <path d="M 985 1258 A 175 175 0 0 0 810 1433"/>
    <path d="M 985 1308 A 125 125 0 0 0 860 1433" stroke-dasharray="6 4"/>
  </g>

  <!-- Große galaktische Nebelwolke im Zentrum -->
  <circle cx="525" cy="749" r="440" fill="url(#nebulaGlow)"/>

  <!-- Großes Astrolabium & Himmelsglobus-Ringe -->
  <g stroke="url(#celestialGold)" fill="none" filter="url(#starGlow)">
    <!-- Äußerer Tierkreisring mit 12 Segmenten -->
    <circle cx="525" cy="749" r="360" stroke-width="8"/>
    <circle cx="525" cy="749" r="330" stroke-width="3" stroke-dasharray="8 8"/>
    
    <!-- Ekliptik-Ellipse (Geneigter Himmelsäquator) -->
    <ellipse cx="525" cy="749" rx="330" ry="160" stroke-width="5" transform="rotate(-25 525 749)" stroke="url(#stellarSilver)"/>
    <ellipse cx="525" cy="749" rx="330" ry="160" stroke-width="5" transform="rotate(25 525 749)" stroke="url(#stellarSilver)"/>
  </g>

  <!-- Zentrum: Die goldene Planetenkammer -->
  <circle cx="525" cy="749" r="220" fill="#030712" stroke="url(#celestialGold)" stroke-width="10"/>
  <circle cx="525" cy="749" r="195" fill="none" stroke="#818cf8" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- 8-zackige Astralkompass-Rose -->
  <g fill="url(#celestialGold)" stroke="#1e1b4b" stroke-width="3" filter="url(#starGlow)">
    <!-- Hauptstrahlen (N, S, W, O) -->
    <polygon points="525,569 545,734 525,749 505,734"/>
    <polygon points="525,929 545,764 525,749 505,764"/>
    <polygon points="705,749 540,769 525,749 540,729"/>
    <polygon points="345,749 510,769 525,749 510,729"/>
    <!-- Nebenstrahlen (Diagonal) -->
    <polygon points="652,622 542,739 525,749 535,732" fill="url(#stellarSilver)"/>
    <polygon points="398,876 508,759 525,749 515,766" fill="url(#stellarSilver)"/>
    <polygon points="652,876 535,766 525,749 542,759" fill="url(#stellarSilver)"/>
    <polygon points="398,622 515,732 525,749 508,739" fill="url(#stellarSilver)"/>
  </g>

  <!-- Zentraler strahlender Polarstern (Kernfusion) -->
  <circle cx="525" cy="749" r="42" fill="url(#stellarSilver)" stroke="url(#celestialGold)" stroke-width="5"/>
  <circle cx="525" cy="749" r="24" fill="#ffffff" filter="url(#starGlow)"/>
  <circle cx="525" cy="749" r="10" fill="#e0e7ff"/>
</svg>
