<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Königskobaltblau & Hohe Zitadelle -->
    <radialGradient id="citadelRoyal" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="40%" stop-color="#172554"/>
      <stop offset="75%" stop-color="#0c1836"/>
      <stop offset="100%" stop-color="#040914"/>
    </radialGradient>
    <!-- 30-Jahre-Jubiläums Reingold-Glanz -->
    <linearGradient id="anniversaryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <radialGradient id="diamondCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#bfdbfe"/>
      <stop offset="70%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </radialGradient>
    <filter id="goldShimmer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="royalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Königlich Kobaltblauer Prunk-Kartenkörper -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#citadelRoyal)" stroke="#060c1c" stroke-width="8"/>

  <!-- Subtiles royales Damast-Mustermosaik im Hintergrund -->
  <g stroke="url(#anniversaryGold)" stroke-width="1.2" opacity="0.22" fill="none">
    <path d="M 525 100 L 935 749 L 525 1398 L 115 749 Z"/>
    <path d="M 525 160 L 875 749 L 525 1338 L 175 749 Z"/>
    <path d="M 525 220 L 815 749 L 525 1278 L 235 749 Z"/>
    <circle cx="525" cy="749" r="480"/>
    <circle cx="525" cy="749" r="440" stroke-dasharray="8 6"/>
  </g>

  <!-- Äußere Dreifache Goldfiligran-Prunkbordüre (30 Jahre Jubiläums-Stil) -->
  <rect x="45" y="45" width="960" height="1408" rx="30" fill="none" stroke="url(#anniversaryGold)" stroke-width="18" filter="url(#royalShadow)"/>
  <rect x="68" y="68" width="914" height="1362" rx="20" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.9"/>
  <rect x="82" y="82" width="886" height="1334" rx="14" fill="none" stroke="url(#anniversaryGold)" stroke-width="4" stroke-dasharray="14 8"/>

  <!-- 4 Hohe Erzmagier-Kronen an den Ecken -->
  <g fill="url(#anniversaryGold)" stroke="#3b1f08" stroke-width="2.5" filter="url(#goldShimmer)">
    <!-- Oben Links -->
    <g transform="translate(125, 125)">
      <polygon points="0,-35 22,-5 35,-25 28,15 -28,15 -35,-25 -22,-5"/>
      <circle cx="0" cy="-35" r="5" fill="#fff"/>
      <circle cx="35" cy="-25" r="4" fill="#fff"/>
      <circle cx="-35" cy="-25" r="4" fill="#fff"/>
      <circle cx="0" cy="5" r="6" fill="#1e3a8a"/>
    </g>
    <!-- Oben Rechts -->
    <g transform="translate(925, 125)">
      <polygon points="0,-35 22,-5 35,-25 28,15 -28,15 -35,-25 -22,-5"/>
      <circle cx="0" cy="-35" r="5" fill="#fff"/>
      <circle cx="35" cy="-25" r="4" fill="#fff"/>
      <circle cx="-35" cy="-25" r="4" fill="#fff"/>
      <circle cx="0" cy="5" r="6" fill="#1e3a8a"/>
    </g>
    <!-- Unten Links -->
    <g transform="translate(125, 1373)">
      <polygon points="0,35 22,5 35,25 28,-15 -28,-15 -35,25 -22,5"/>
      <circle cx="0" cy="35" r="5" fill="#fff"/>
      <circle cx="35" cy="25" r="4" fill="#fff"/>
      <circle cx="-35" cy="25" r="4" fill="#fff"/>
      <circle cx="0" cy="-5" r="6" fill="#1e3a8a"/>
    </g>
    <!-- Unten Rechts -->
    <g transform="translate(925, 1373)">
      <polygon points="0,35 22,5 35,25 28,-15 -28,-15 -35,25 -22,5"/>
      <circle cx="0" cy="35" r="5" fill="#fff"/>
      <circle cx="35" cy="25" r="4" fill="#fff"/>
      <circle cx="-35" cy="25" r="4" fill="#fff"/>
      <circle cx="0" cy="-5" r="6" fill="#1e3a8a"/>
    </g>
  </g>

  <!-- Mittlere Hohe Ratskammer (Prunk-Goldkreis) -->
  <circle cx="525" cy="749" r="320" fill="#0c1836" stroke="url(#anniversaryGold)" stroke-width="14" filter="url(#goldShimmer)"/>
  <circle cx="525" cy="749" r="290" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="16 10"/>

  <!-- Goldener Sonnenkompass der Hohen Zitadelle (16 Strahlen) -->
  <g fill="url(#anniversaryGold)" stroke="#3b1f08" stroke-width="2.5" filter="url(#royalShadow)">
    <!-- 4 Große Kardinal-Sonnenstrahlen -->
    <polygon points="525,509 545,729 525,749 505,729"/>
    <polygon points="525,989 545,769 525,749 505,769"/>
    <polygon points="765,749 545,769 525,749 545,729"/>
    <polygon points="285,749 505,769 525,749 505,729"/>
    <!-- 4 Mittlere Diagonal-Sonnenstrahlen -->
    <polygon points="695,579 545,735 525,749 539,729"/>
    <polygon points="355,919 505,763 525,749 511,769"/>
    <polygon points="695,919 539,769 525,749 545,763"/>
    <polygon points="355,579 511,729 525,749 505,735"/>
  </g>

  <!-- Zentrum: Siegel der Hohen Erzmagier mit Brillanz-Diamant -->
  <circle cx="525" cy="749" r="180" fill="url(#citadelRoyal)" stroke="url(#anniversaryGold)" stroke-width="10"/>
  <circle cx="525" cy="749" r="158" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Magier-Stab & Hoher Hexenhut Monogramm -->
  <g stroke="url(#anniversaryGold)" stroke-width="6" fill="none" filter="url(#goldShimmer)">
    <!-- Hoher Zaubererhut -->
    <path d="M 455 790 L 595 790 M 475 790 L 515 670 Q 525 650 545 660 L 575 790" stroke-width="6" fill="#172554"/>
    <circle cx="545" cy="660" r="8" fill="#fef08a"/>
  </g>

  <!-- Facettierter Herz-Diamant (Brillantkern) -->
  <polygon points="525,715 560,749 525,783 490,749" fill="url(#diamondCore)" stroke="url(#anniversaryGold)" stroke-width="4" filter="url(#goldShimmer)"/>
  <circle cx="516" cy="738" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
