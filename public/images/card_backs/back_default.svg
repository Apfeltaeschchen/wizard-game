<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1498" width="1050" height="1498">
  <defs>
    <!-- Pergament & Farbverläufe -->
    <radialGradient id="parchmentBase" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fdf6e2"/>
      <stop offset="45%" stop-color="#f5e6c4"/>
      <stop offset="75%" stop-color="#d8b276"/>
      <stop offset="92%" stop-color="#8a5322"/>
      <stop offset="100%" stop-color="#452309"/>
    </radialGradient>
    <linearGradient id="brassOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="25%" stop-color="#d49e35"/>
      <stop offset="50%" stop-color="#875317"/>
      <stop offset="75%" stop-color="#d49e35"/>
      <stop offset="100%" stop-color="#ffe28a"/>
    </linearGradient>
    <linearGradient id="innerInlay" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a3210"/>
      <stop offset="50%" stop-color="#8f5b23"/>
      <stop offset="100%" stop-color="#3d1f08"/>
    </linearGradient>
    <radialGradient id="sigilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e6ab35" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7a440e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1a0b02" flood-opacity="0.7"/>
    </filter>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#fff" flood-opacity="0.4"/>
      <feDropShadow dx="-1" dy="-2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Karten-Grundkörper mit Pergamenttextur -->
  <rect x="15" y="15" width="1020" height="1468" rx="42" fill="url(#parchmentBase)" stroke="#2b1404" stroke-width="6"/>

  <!-- Brandrand-Vignette -->
  <rect x="25" y="25" width="1000" height="1448" rx="36" fill="none" stroke="#3b1c06" stroke-width="12" opacity="0.6"/>
  <rect x="42" y="42" width="966" height="1414" rx="30" fill="none" stroke="#663812" stroke-width="4" stroke-dasharray="14 6" opacity="0.7"/>

  <!-- Äußerer gravierter Messingrahmen -->
  <rect x="58" y="58" width="934" height="1382" rx="24" fill="none" stroke="url(#brassOuter)" stroke-width="16" filter="url(#softShadow)"/>
  <rect x="74" y="74" width="902" height="1350" rx="18" fill="none" stroke="#2b1404" stroke-width="3" opacity="0.8"/>

  <!-- Filigrane Eckbeschläge (4 Ecken, spiegelbildlich) -->
  <!-- Oben Links -->
  <g transform="translate(68, 68)">
    <path d="M 0 0 L 140 0 C 110 30 110 50 140 70 C 90 70 70 90 70 140 C 50 110 30 110 0 140 Z" fill="url(#brassOuter)" stroke="#3d1f08" stroke-width="2"/>
    <circle cx="45" cy="45" r="12" fill="#ffeaa7" stroke="#663812" stroke-width="3"/>
    <circle cx="45" cy="45" r="5" fill="#3b1c06"/>
    <path d="M 12 120 Q 30 30 120 12" fill="none" stroke="#fffae0" stroke-width="2" opacity="0.8"/>
  </g>
  <!-- Oben Rechts -->
  <g transform="translate(982, 68) scale(-1, 1)">
    <path d="M 0 0 L 140 0 C 110 30 110 50 140 70 C 90 70 70 90 70 140 C 50 110 30 110 0 140 Z" fill="url(#brassOuter)" stroke="#3d1f08" stroke-width="2"/>
    <circle cx="45" cy="45" r="12" fill="#ffeaa7" stroke="#663812" stroke-width="3"/>
    <circle cx="45" cy="45" r="5" fill="#3b1c06"/>
    <path d="M 12 120 Q 30 30 120 12" fill="none" stroke="#fffae0" stroke-width="2" opacity="0.8"/>
  </g>
  <!-- Unten Links -->
  <g transform="translate(68, 1430) scale(1, -1)">
    <path d="M 0 0 L 140 0 C 110 30 110 50 140 70 C 90 70 70 90 70 140 C 50 110 30 110 0 140 Z" fill="url(#brassOuter)" stroke="#3d1f08" stroke-width="2"/>
    <circle cx="45" cy="45" r="12" fill="#ffeaa7" stroke="#663812" stroke-width="3"/>
    <circle cx="45" cy="45" r="5" fill="#3b1c06"/>
    <path d="M 12 120 Q 30 30 120 12" fill="none" stroke="#fffae0" stroke-width="2" opacity="0.8"/>
  </g>
  <!-- Unten Rechts -->
  <g transform="translate(982, 1430) scale(-1, -1)">
    <path d="M 0 0 L 140 0 C 110 30 110 50 140 70 C 90 70 70 90 70 140 C 50 110 30 110 0 140 Z" fill="url(#brassOuter)" stroke="#3d1f08" stroke-width="2"/>
    <circle cx="45" cy="45" r="12" fill="#ffeaa7" stroke="#663812" stroke-width="3"/>
    <circle cx="45" cy="45" r="5" fill="#3b1c06"/>
    <path d="M 12 120 Q 30 30 120 12" fill="none" stroke="#fffae0" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Gotischer Innenrahmen mit Spitzbögen -->
  <rect x="110" y="110" width="830" height="1278" rx="16" fill="none" stroke="url(#innerInlay)" stroke-width="6"/>
  <rect x="126" y="126" width="798" height="1246" rx="12" fill="none" stroke="#d49e35" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Subtiler Hintergrund-Guilloche-Mustereffekt (Magische Rauten) -->
  <g stroke="#8a5322" stroke-width="1.2" opacity="0.22" fill="none">
    <path d="M 525 150 L 890 749 L 525 1348 L 160 749 Z"/>
    <path d="M 525 210 L 830 749 L 525 1288 L 220 749 Z"/>
    <path d="M 525 270 L 770 749 L 525 1228 L 280 749 Z"/>
    <circle cx="525" cy="749" r="460"/>
    <circle cx="525" cy="749" r="410" stroke-dasharray="6 6"/>
  </g>

  <!-- Mittlere Lehrlings-Zirkel & Arkan-Stern Struktur -->
  <circle cx="525" cy="749" r="320" fill="url(#sigilGlow)"/>
  
  <!-- Äußerer Runenring mit Lehrlings-Symbolen -->
  <circle cx="525" cy="749" r="280" fill="none" stroke="url(#brassOuter)" stroke-width="14" filter="url(#softShadow)"/>
  <circle cx="525" cy="749" r="262" fill="none" stroke="#3d1f08" stroke-width="3"/>
  <circle cx="525" cy="749" r="298" fill="none" stroke="#3d1f08" stroke-width="3"/>

  <!-- 12 Gotische Roste / Punkte im Kreis -->
  <g fill="#ffe28a" stroke="#452309" stroke-width="2">
    <circle cx="525" cy="469" r="8"/>
    <circle cx="665" cy="506" r="8"/>
    <circle cx="765" cy="609" r="8"/>
    <circle cx="805" cy="749" r="8"/>
    <circle cx="765" cy="889" r="8"/>
    <circle cx="665" cy="992" r="8"/>
    <circle cx="525" cy="1029" r="8"/>
    <circle cx="385" cy="992" r="8"/>
    <circle cx="285" cy="889" r="8"/>
    <circle cx="245" cy="749" r="8"/>
    <circle cx="285" cy="609" r="8"/>
    <circle cx="385" cy="506" r="8"/>
  </g>

  <!-- Geometrisches Oktagramm (Doppel-Quadrat / Arkanstern) -->
  <g stroke="url(#brassOuter)" stroke-width="8" fill="rgba(80, 42, 12, 0.25)" filter="url(#emboss)">
    <!-- Quadrat 1 -->
    <polygon points="525,529 745,749 525,969 305,749"/>
    <!-- Quadrat 2 (45° gedreht) -->
    <polygon points="681,593 681,905 369,905 369,593"/>
  </g>

  <circle cx="525" cy="749" r="160" fill="url(#innerInlay)" stroke="url(#brassOuter)" stroke-width="8"/>
  <circle cx="525" cy="749" r="142" fill="none" stroke="#ffeaa7" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Zentrierter Lehrlings-Arkanstern mit Brillanzkristall -->
  <!-- 8 Strahlen -->
  <g fill="url(#brassOuter)" stroke="#2b1404" stroke-width="2.5" filter="url(#softShadow)">
    <!-- Oben / Unten / Rechts / Links -->
    <polygon points="525,605 545,730 525,749 505,730"/>
    <polygon points="525,893 545,768 525,749 505,768"/>
    <polygon points="669,749 544,769 525,749 544,729"/>
    <polygon points="381,749 506,769 525,749 506,729"/>
    <!-- Diagonalen -->
    <polygon points="627,647 547,737 525,749 537,727"/>
    <polygon points="423,851 503,761 525,749 513,771"/>
    <polygon points="627,851 537,771 525,749 547,761"/>
    <polygon points="423,647 513,727 525,749 503,737"/>
  </g>

  <!-- Zentraler leuchtender Bernstein-Cabochon -->
  <circle cx="525" cy="749" r="38" fill="url(#brassOuter)" stroke="#3d1f08" stroke-width="4"/>
  <circle cx="525" cy="749" r="28" fill="#ffd15c"/>
  <circle cx="520" cy="743" r="10" fill="#fff" opacity="0.75"/>
</svg>
