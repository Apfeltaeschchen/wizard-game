<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <!-- Samtiger Glanz-Filter für karmesinroten Stoff -->
    <filter id="velvetSheen" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35 0.35" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.45   0 0 0 0 0.05   0 0 0 0 0.12  0 0 0 0.28 0" />
    </filter>

    <radialGradient id="velvetCrimsonBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="45%" stop-color="#2a030d" />
      <stop offset="80%" stop-color="#190208" />
      <stop offset="100%" stop-color="#0b0104" />
    </radialGradient>

    <!-- Poliertes Messing & Gold für Uhrwerk-Zahnräder -->
    <linearGradient id="clockworkBrassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Goldener Kernschein -->
    <radialGradient id="brassCoreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#e11d48" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#1e0208" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. KARMESINROTER SAMTBELAG MIT MAHAGONIRAND -->
  <rect width="1600" height="1000" fill="url(#velvetCrimsonBg)" />
  <rect width="1600" height="1000" filter="url(#velvetSheen)" style="mix-blend-mode: overlay;" />

  <!-- 2. HUSAREN-TRESSEN & MILITÄRISCHE SAMTBORDÜRE -->
  <g stroke="url(#clockworkBrassGrad)" fill="none" opacity="0.65">
    <rect x="50" y="45" width="1500" height="910" rx="14" stroke-width="2.2" />
    <rect x="62" y="57" width="1476" height="886" rx="10" stroke-width="1.0" stroke-dasharray="6 4" />
    
    <!-- Husaren-Geflecht-Bogen oben/unten -->
    <path d="M 600,45 Q 800,75 1000,45" stroke-width="1.4" />
    <path d="M 600,955 Q 800,925 1000,955" stroke-width="1.4" />
  </g>

  <!-- 3. ZENTRALES MECHANISCHES UHRWERK-ASTROLABIUM (STICH-ZIRKEL) -->
  <circle cx="800" cy="500" r="330" fill="url(#brassCoreGlow)" />
  <g transform="translate(800, 500)" stroke="url(#clockworkBrassGrad)" fill="none" opacity="0.6">
    <!-- Äußerer Zahnkranz mit 24 Zähnen -->
    <circle r="280" stroke-width="2" stroke-dasharray="14 10" />
    <circle r="265" stroke-width="1" />
    <circle r="250" stroke-width="1.4" stroke-dasharray="24 8 4 8" />

    <!-- Ineinandergreifendes Innen-Zahnrad -->
    <circle r="170" stroke-width="2.2" stroke-dasharray="16 6" />
    <circle r="150" stroke-width="0.8" />
    
    <!-- 12 Speichen wie eine Taschenuhr / Astrolabium -->
    <g stroke-width="1.2" opacity="0.7">
      <line x1="0" y1="-170" x2="0" y2="170" />
      <line x1="-170" y1="0" x2="170" y2="0" />
      <line x1="-120" y1="-120" x2="120" y2="120" />
      <line x1="-120" y1="120" x2="120" y2="-120" />
      <line x1="-150" y1="-85" x2="150" y2="85" />
      <line x1="-85" y1="-150" x2="85" y2="150" />
    </g>

    <!-- Kernzahnrad mit Kronenwappen -->
    <circle r="75" stroke-width="2" fill="#2a030d" fill-opacity="0.3" />
    <polygon points="0,-40 25,-15 45,-25 25,25 -25,25 -45,-25 -25,-15" stroke-width="1.6" fill="#fbbf24" fill-opacity="0.25" />
    <!-- Aufzieh-Achse -->
    <circle r="14" fill="#fbbf24" />
    <circle r="5" fill="#4c0519" />
  </g>

  <!-- 4. UHRWERK-ZAHNRÄDER IN DEN VIER ECKEN -->
  <g stroke="url(#clockworkBrassGrad)" fill="#1c0309" stroke-width="1.4" opacity="0.75">
    <!-- Oben-Links Zahnradgruppe -->
    <g transform="translate(100, 95)">
      <circle r="45" stroke-dasharray="10 6" stroke-width="2" />
      <circle r="36" stroke-width="1" />
      <circle r="12" fill="#fbbf24" />
    </g>
    <!-- Oben-Rechts Zahnradgruppe -->
    <g transform="translate(1500, 95)">
      <circle r="45" stroke-dasharray="10 6" stroke-width="2" />
      <circle r="36" stroke-width="1" />
      <circle r="12" fill="#fbbf24" />
    </g>
    <!-- Unten-Links Zahnradgruppe -->
    <g transform="translate(100, 905)">
      <circle r="45" stroke-dasharray="10 6" stroke-width="2" />
      <circle r="36" stroke-width="1" />
      <circle r="12" fill="#fbbf24" />
    </g>
    <!-- Unten-Rechts Zahnradgruppe -->
    <g transform="translate(1500, 905)">
      <circle r="45" stroke-dasharray="10 6" stroke-width="2" />
      <circle r="36" stroke-width="1" />
      <circle r="12" fill="#fbbf24" />
    </g>
  </g>
</svg>