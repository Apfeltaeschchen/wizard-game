<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="candyStripeBorder" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="85%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="candyStripeBorder_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="candyStripeBorder_shadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/></filter>
  </defs>
  <!-- Outer Table Rim -->
  <rect x="20" y="20" width="1560" height="960" rx="480" fill="url(#candyStripeBorder)" stroke="url(#candyStripeBorder_gold)" stroke-width="18" filter="url(#candyStripeBorder_shadow)"/>
  <!-- Inner Play Felt Boundary -->
  <rect x="70" y="70" width="1460" height="860" rx="430" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="14,10" opacity="0.65"/>
  <!-- Center Thematic Ring & Medallion -->
  <circle cx="800" cy="500" r="180" fill="none" stroke="url(#candyStripeBorder_gold)" stroke-width="4" opacity="0.8"/>
  <circle cx="800" cy="500" r="170" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.5"/>
  <!-- Decorative Corner Vignettes -->
  <circle cx="350" cy="500" r="30" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
  <circle cx="1250" cy="500" r="30" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>
</svg>