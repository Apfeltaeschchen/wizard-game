<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <!-- Ultrafeines Wollfilz-Gewebe für luxuriöses Billardtuch -->
    <filter id="baizeWeave" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.75" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.08   0 0 0 0 0.35   0 0 0 0 0.18  0 0 0 0.22 0" />
    </filter>

    <!-- Warmes sanftes Deckenlicht im Tischzentrum -->
    <radialGradient id="emeraldFeltLight" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#0f5128" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#0a3219" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#051c0d" stop-opacity="1" />
    </radialGradient>

    <!-- Goldenes Siegel-Wasserzeichen Farbverlauf -->
    <linearGradient id="goldInlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#996515" stop-opacity="0.25" />
    </linearGradient>

    <!-- Weicher Gold-Schein für Beschläge -->
    <radialGradient id="brassGleam" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#ca8a04" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#713f12" stop-opacity="0.1" />
    </radialGradient>
  </defs>

  <!-- 1. GRUNDTUCH: SMARAGDGRÜNER ZITADELLEN-FILZ -->
  <rect width="1600" height="1000" fill="url(#emeraldFeltLight)" />

  <!-- 2. WOLLFILZ-MICROSTRUKTUR -->
  <rect width="1600" height="1000" filter="url(#baizeWeave)" style="mix-blend-mode: overlay;" />

  <!-- 3. EINGEWEBTES ZENTRALES ERZMAGIER-SIEGEL & KOMPASS (STICH-ZIRKEL WASSERZEICHEN) -->
  <g transform="translate(800, 500)" stroke="url(#goldInlayGrad)" fill="none" pointer-events="none">
    <!-- Äußerer Zier-Ring mit Runen-Skalierung -->
    <circle r="290" stroke-width="1.8" stroke-dasharray="8 6 2 6" />
    <circle r="275" stroke-width="0.8" opacity="0.6" />
    
    <!-- Mittlerer Ring mit Himmelsrichtungs-Marken -->
    <circle r="210" stroke-width="2" />
    <circle r="195" stroke-width="1" stroke-dasharray="4 4" opacity="0.7" />

    <!-- 8-zackiger arkaner Kompass-Stern -->
    <path d="M 0,-210 L 16,-45 L 210,0 L 45,16 L 0,210 L -16,45 L -210,0 L -45,-16 Z" stroke-width="1.5" fill="url(#goldInlayGrad)" fill-opacity="0.04" />
    <!-- 4 diagonale Nebenspitzen -->
    <path d="M -125,-125 L -25,-25 L 125,-125 L 25,25 L 125,125 L -25,25 L -125,125 L -25,-25 Z" stroke-width="1" opacity="0.5" />

    <!-- Zentraler Siegelkern -->
    <circle r="90" stroke-width="1.6" />
    <circle r="82" stroke-width="0.8" stroke-dasharray="3 3" />
    <circle r="45" stroke-width="1.4" fill="url(#goldInlayGrad)" fill-opacity="0.06" />
    
    <!-- 12 Tierkreis- / Runden-Orientierungspunkte -->
    <g stroke-width="1.5" opacity="0.75">
      <line x1="0" y1="-210" x2="0" y2="-198" />
      <line x1="0" y1="210" x2="0" y2="198" />
      <line x1="-210" y1="0" x2="-198" y2="0" />
      <line x1="210" y1="0" x2="198" y2="0" />
      <line x1="-148" y1="-148" x2="-140" y2="-140" />
      <line x1="148" y1="-148" x2="140" y2="-140" />
      <line x1="-148" y1="148" x2="-140" y2="140" />
      <line x1="148" y1="148" x2="140" y2="140" />
    </g>
  </g>

  <!-- 4. EINGELEFASSTE UMLAUFENDE GOLD-KORDELBORDÜRE AM INNEREN RAND (ZITADELLEN-EDITION) -->
  <rect x="18" y="18" width="1564" height="964" rx="20" ry="20" fill="none" stroke="url(#goldInlayGrad)" stroke-width="3" opacity="0.8" />
  <rect x="24" y="24" width="1552" height="952" rx="16" ry="16" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-dasharray="8 4 2 4" opacity="0.75" />
  <rect x="34" y="34" width="1532" height="932" rx="12" ry="12" fill="none" stroke="url(#goldInlayGrad)" stroke-width="1.2" opacity="0.5" />
  <rect x="42" y="42" width="1516" height="916" rx="8" ry="8" fill="none" stroke="#fef08a" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.4" />

  <!-- 5. POLIERTE FILIGRANE AKANTHUS-MESSINGSPANGEN & ECKBESCHLÄGE -->
  <g stroke="url(#goldInlayGrad)" fill="url(#brassGleam)" stroke-width="1.8" opacity="0.85">
    <!-- Oben-Links: Akanthus-Spange & Eckbeschlag -->
    <path d="M 18,140 L 18,45 Q 18,18 45,18 L 140,18 L 115,48 Q 65,48 48,65 L 48,115 Z" />
    <path d="M 52,52 Q 85,25 125,32 Q 95,55 70,85 Z" fill="#d4af37" opacity="0.6" stroke-width="1" />
    <circle cx="72" cy="72" r="5" fill="#fef08a" stroke="#713f12" stroke-width="1.5" />
    <circle cx="110" cy="35" r="3.5" fill="#d4af37" />
    <circle cx="35" cy="110" r="3.5" fill="#d4af37" />

    <!-- Oben-Rechts: Akanthus-Spange & Eckbeschlag -->
    <path d="M 1582,140 L 1582,45 Q 1582,18 1555,18 L 1460,18 L 1485,48 Q 1535,48 1552,65 L 1552,115 Z" />
    <path d="M 1548,52 Q 1515,25 1475,32 Q 1505,55 1530,85 Z" fill="#d4af37" opacity="0.6" stroke-width="1" />
    <circle cx="1528" cy="72" r="5" fill="#fef08a" stroke="#713f12" stroke-width="1.5" />
    <circle cx="1490" cy="35" r="3.5" fill="#d4af37" />
    <circle cx="1565" cy="110" r="3.5" fill="#d4af37" />

    <!-- Unten-Links: Akanthus-Spange & Eckbeschlag -->
    <path d="M 18,860 L 18,955 Q 18,982 45,982 L 140,982 L 115,952 Q 65,952 48,935 L 48,885 Z" />
    <path d="M 52,948 Q 85,975 125,968 Q 95,945 70,915 Z" fill="#d4af37" opacity="0.6" stroke-width="1" />
    <circle cx="72" cy="928" r="5" fill="#fef08a" stroke="#713f12" stroke-width="1.5" />
    <circle cx="110" cy="965" r="3.5" fill="#d4af37" />
    <circle cx="35" cy="890" r="3.5" fill="#d4af37" />

    <!-- Unten-Rechts: Akanthus-Spange & Eckbeschlag -->
    <path d="M 1582,860 L 1582,955 Q 1582,982 1555,982 L 1460,982 L 1485,952 Q 1535,952 1552,935 L 1552,885 Z" />
    <path d="M 1548,948 Q 1515,975 1475,968 Q 1505,945 1530,915 Z" fill="#d4af37" opacity="0.6" stroke-width="1" />
    <circle cx="1528" cy="928" r="5" fill="#fef08a" stroke="#713f12" stroke-width="1.5" />
    <circle cx="1490" cy="965" r="3.5" fill="#d4af37" />
    <circle cx="1565" cy="890" r="3.5" fill="#d4af37" />
  </g>
</svg>
