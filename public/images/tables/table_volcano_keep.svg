<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <!-- Poröser Basalt- und Vulkangestein-Filter -->
    <filter id="basaltStone" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.25 0.25" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.35   0 0 0 0 0.12   0 0 0 0 0.08  0 0 0 0.35 0" />
    </filter>

    <!-- Magma Gluthauch Filter -->
    <filter id="magmaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vulkan-Basalt Tiefenverlauf -->
    <radialGradient id="volcanoBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2d0b07" />
      <stop offset="40%" stop-color="#1b0604" />
      <stop offset="75%" stop-color="#120403" />
      <stop offset="100%" stop-color="#070202" />
    </radialGradient>

    <!-- Flammender Magma-Verlauf -->
    <linearGradient id="magmaFissureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f97316" />
      <stop offset="65%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Glutkern-Schein in der Tischmitte -->
    <radialGradient id="magmaCoreGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#b91c1c" stop-opacity="0.16" />
      <stop offset="80%" stop-color="#450a0a" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. BASALT-FESTUNGS-STEINPLATTE -->
  <rect width="1600" height="1000" fill="url(#volcanoBg)" />
  <rect width="1600" height="1000" filter="url(#basaltStone)" style="mix-blend-mode: overlay;" />

  <!-- 2. GLÜHENDE MAGMA-RISSE & ERUPTIONS-ADERFLUSS -->
  <g stroke="url(#magmaFissureGrad)" fill="none" opacity="0.45" filter="url(#magmaGlow)">
    <!-- Magmariss Querachse -->
    <path d="M -20,350 Q 220,380 410,290 T 780,470 T 1150,420 T 1620,530" stroke-width="2.5" />
    <path d="M 410,290 Q 520,200 620,160" stroke-width="1.2" opacity="0.7" />
    <path d="M 780,470 Q 840,600 890,720" stroke-width="1.8" opacity="0.6" />
    <path d="M 1150,420 Q 1280,310 1390,260" stroke-width="1.4" opacity="0.7" />

    <!-- Zweite Magmaspalte Unten -->
    <path d="M 200,980 Q 380,820 540,860 T 920,810 T 1350,920" stroke-width="2.0" opacity="0.5" />
    <path d="M 540,860 Q 610,750 670,720" stroke-width="1.0" opacity="0.6" />
  </g>

  <!-- 3. ZENTRALER MAGMA-ZIRKEL (DRUIDISCHER FEUERSTERN) -->
  <circle cx="800" cy="500" r="330" fill="url(#magmaCoreGlow)" />
  <g transform="translate(800, 500)" stroke="url(#magmaFissureGrad)" fill="none" opacity="0.5" filter="url(#magmaGlow)">
    <circle r="275" stroke-width="2" stroke-dasharray="16 10 4 10" />
    <circle r="260" stroke-width="0.8" opacity="0.5" />

    <!-- 8-strahliger Drachen-/Vulkanstern -->
    <path d="M 0,-215 L 20,-60 L 215,0 L 60,20 L 0,215 L -20,60 L -215,0 L -60,-20 Z" stroke-width="1.6" fill="#dc2626" fill-opacity="0.06" />
    <circle r="120" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle r="55" stroke-width="2" fill="#ef4444" fill-opacity="0.15" />
    <circle r="22" stroke-width="1.2" fill="#fef08a" fill-opacity="0.3" />
  </g>

  <!-- 4. GEZACKTE BASALTKANTEN MIT GLÜHENDEN MAGMARISSEN (ORGANISCH EINGEBETTET) -->
  <g stroke="url(#magmaFissureGrad)" fill="none" opacity="0.75" filter="url(#magmaGlow)">
    <!-- Sanfte innere Basalt-Führungslinien -->
    <rect x="45" y="45" width="1510" height="910" rx="14" stroke-width="1.8" opacity="0.4" />

    <!-- Umlaufende leuchtende Magmarisse (eingerückt, kantenfrei) -->
    <path d="M 60,60 L 140,68 L 260,54 L 400,66 L 540,56 L 700,68 L 840,54 L 1000,66 L 1160,56 L 1320,68 L 1460,56 L 1540,60" stroke-width="1.8" />
    <path d="M 60,940 L 140,932 L 260,946 L 400,934 L 540,944 L 700,932 L 840,946 L 1000,934 L 1160,944 L 1320,932 L 1460,944 L 1540,940" stroke-width="1.8" />

    <!-- Feine glühende Nebenadern in die Tischfläche hinein -->
    <path d="M 400,66 L 430,95 M 840,54 L 860,95 M 1320,68 L 1300,98" stroke="#fef08a" stroke-width="1.2" />
    <path d="M 540,944 L 520,905 M 1000,934 L 1030,900 M 1460,944 L 1440,905" stroke="#fef08a" stroke-width="1.2" />
  </g>

  <!-- 5. BASALT-ECKBESCHLÄGE MIT GLÜHENDEN MAGMA-KERNEN (ORGANISCH IN DEN ECKEN EINGEFASST) -->
  <g fill="#1b0604" stroke="url(#magmaFissureGrad)" stroke-width="1.6" opacity="0.85">
    <!-- Oben-Links Basalt-Kralle -->
    <polygon points="55,115 55,75 75,55 115,55 95,80 80,80 80,95" />
    <circle cx="70" cy="70" r="6" fill="#f97316" filter="url(#magmaGlow)" />
    <circle cx="70" cy="70" r="2.5" fill="#fef08a" />

    <!-- Oben-Rechts Basalt-Kralle -->
    <polygon points="1545,115 1545,75 1525,55 1485,55 1505,80 1520,80 1520,95" />
    <circle cx="1530" cy="70" r="6" fill="#f97316" filter="url(#magmaGlow)" />
    <circle cx="1530" cy="70" r="2.5" fill="#fef08a" />

    <!-- Unten-Links Basalt-Kralle -->
    <polygon points="55,885 55,925 75,945 115,945 95,920 80,920 80,905" />
    <circle cx="70" cy="930" r="6" fill="#f97316" filter="url(#magmaGlow)" />
    <circle cx="70" cy="930" r="2.5" fill="#fef08a" />

    <!-- Unten-Rechts Basalt-Kralle -->
    <polygon points="1545,885 1545,925 1525,945 1485,945 1505,920 1520,920 1520,905" />
    <circle cx="1530" cy="930" r="6" fill="#f97316" filter="url(#magmaGlow)" />
    <circle cx="1530" cy="930" r="2.5" fill="#fef08a" />
  </g>
</svg>
