<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <!-- Dunkler Schiefer- und Obsidian-Porenfilter -->
    <filter id="slateStone" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.22 0.22" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.18   0 0 0 0 0.08   0 0 0 0 0.32  0 0 0 0.28 0" />
    </filter>

    <!-- Amethyst-Kristall Glühen Filter -->
    <filter id="amethystGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hintergrund Schiefer Obsidian Gradient -->
    <radialGradient id="amethystBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a1045" />
      <stop offset="40%" stop-color="#18092b" />
      <stop offset="75%" stop-color="#110520" />
      <stop offset="100%" stop-color="#080210" />
    </radialGradient>

    <!-- Kristallader-Verlauf -->
    <linearGradient id="crystalVeinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Arkanes Runen-Licht -->
    <radialGradient id="runeCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. BASALT- UND OBSIDIAN-GRUNDPLATTE -->
  <rect width="1600" height="1000" fill="url(#amethystBg)" />
  <rect width="1600" height="1000" filter="url(#slateStone)" style="mix-blend-mode: overlay;" />

  <!-- 2. ORGANISCH VERZWEIGTE AMETHYST-KRISTALLADERN -->
  <g stroke="url(#crystalVeinGrad)" fill="none" opacity="0.4" filter="url(#amethystGlow)">
    <!-- Ader Oben-Links nach Mitte -->
    <path d="M 0,180 Q 240,210 380,310 T 640,430 T 780,480" stroke-width="2.2" />
    <path d="M 180,195 Q 260,140 320,110" stroke-width="1.2" opacity="0.6" />
    <path d="M 380,310 Q 420,380 470,410" stroke-width="1.4" opacity="0.5" />

    <!-- Ader Unten-Rechts nach Mitte -->
    <path d="M 1600,820 Q 1380,780 1220,680 T 960,560 T 820,520" stroke-width="2.2" />
    <path d="M 1420,790 Q 1340,860 1280,890" stroke-width="1.2" opacity="0.6" />
    <path d="M 1220,680 Q 1170,610 1120,580" stroke-width="1.4" opacity="0.5" />

    <!-- Zarte Risse Oben-Rechts -->
    <path d="M 1450,0 Q 1380,150 1250,220" stroke-width="1.5" opacity="0.35" />
    <path d="M 150,900 Q 280,820 390,860" stroke-width="1.5" opacity="0.35" />
  </g>

  <!-- 3. ARKANER AMETHYST-STICHZIRKEL (CENTERPIECE) -->
  <circle cx="800" cy="500" r="320" fill="url(#runeCenterGlow)" />
  <g transform="translate(800, 500)" stroke="url(#crystalVeinGrad)" fill="none" opacity="0.5" filter="url(#amethystGlow)">
    <!-- Äußerer Runenkreis -->
    <circle r="270" stroke-width="2" stroke-dasharray="12 8 4 8" />
    <circle r="255" stroke-width="0.8" opacity="0.5" />

    <!-- Hexagramm / Arkanes Dreieckspaar -->
    <polygon points="0,-220 190.5,110 -190.5,110" stroke-width="1.5" opacity="0.6" />
    <polygon points="0,220 190.5,-110 -190.5,-110" stroke-width="1.5" opacity="0.6" />

    <!-- Mittlerer Zirkelring mit Glyphen-Marken -->
    <circle r="140" stroke-width="1.8" />
    <circle r="130" stroke-width="0.8" stroke-dasharray="4 4" />
    
    <!-- Zentrales Krypta-Auge -->
    <circle r="60" stroke-width="2" fill="#7e22ce" fill-opacity="0.08" />
    <circle r="25" stroke-width="1.5" fill="#c084fc" fill-opacity="0.2" />
  </g>

  <!-- 4. DURCHGEHENDES BAND LEUCHTENDER KANTENRUNEN (OBEN & UNTEN, EINGERÜCKT) -->
  <g stroke="url(#crystalVeinGrad)" fill="none" opacity="0.8" filter="url(#amethystGlow)">
    <!-- Sanfte innere Führungs-Linie (kantenfrei) -->
    <rect x="45" y="45" width="1510" height="910" rx="14" stroke-width="1.4" opacity="0.4" stroke-dasharray="16 8 4 8" />

    <!-- Obere Runenzeile eingerückt -->
    <g transform="translate(140, 50)" stroke-width="1.8" opacity="0.8">
      <!-- Wiederholte arkane Krypta-Glyphen oben -->
      <path d="M 0,0 L 0,16 M -8,6 L 8,6 M -6,14 L 6,14" />
      <path d="M 160,0 L 170,16 L 150,16 Z" />
      <path d="M 320,0 L 320,16 L 332,8 Z" />
      <path d="M 480,8 L 492,0 L 504,8 L 492,16 Z" />
      <path d="M 640,0 L 640,16 M 632,4 L 648,12" />
      <path d="M 800,8 L 812,0 L 824,8 L 812,16 Z" />
      <path d="M 960,0 L 960,16 M 952,12 L 968,4" />
      <path d="M 1120,0 L 1132,8 L 1120,16 M 1132,0 L 1120,8 L 1132,16" />
      <path d="M 1280,0 L 1290,16 L 1270,16 Z" />
    </g>

    <!-- Untere Runenzeile eingerückt -->
    <g transform="translate(140, 934)" stroke-width="1.8" opacity="0.8">
      <!-- Wiederholte arkane Krypta-Glyphen unten -->
      <path d="M 0,16 L 0,0 M -8,10 L 8,10 M -6,2 L 6,2" />
      <path d="M 160,16 L 170,0 L 150,0 Z" />
      <path d="M 320,16 L 320,0 L 332,8 Z" />
      <path d="M 480,8 L 492,16 L 504,8 L 492,0 Z" />
      <path d="M 640,16 L 640,0 M 632,12 L 648,4" />
      <path d="M 800,8 L 812,16 L 824,8 L 812,0 Z" />
      <path d="M 960,16 L 960,0 M 952,4 L 968,12" />
      <path d="M 1120,16 L 1132,8 L 1120,0 M 1132,16 L 1120,8 L 1132,0" />
      <path d="M 1280,16 L 1290,0 L 1270,0 Z" />
    </g>
  </g>

  <!-- 5. DEZENTE, WEICH VERBLENDETE RUNEN-ORNAMENTE & KRISTALLCLUSTER IN DEN 4 ECKEN (KANTENFREI) -->
  <g fill="none" stroke="#d8b4fe" stroke-width="1.4" opacity="0.5" filter="url(#amethystGlow)">
    <!-- Oben-Links -->
    <path d="M 55,100 A 35,35 0 0,1 100,55" />
    <circle cx="75" cy="75" r="4" fill="#c084fc" opacity="0.7" />

    <!-- Oben-Rechts -->
    <path d="M 1545,100 A 35,35 0 0,0 1500,55" />
    <circle cx="1525" cy="75" r="4" fill="#c084fc" opacity="0.7" />

    <!-- Unten-Links -->
    <path d="M 55,900 A 35,35 0 0,0 100,945" />
    <circle cx="75" cy="925" r="4" fill="#c084fc" opacity="0.7" />

    <!-- Unten-Rechts -->
    <path d="M 1545,900 A 35,35 0 0,1 1500,945" />
    <circle cx="1525" cy="925" r="4" fill="#c084fc" opacity="0.7" />
  </g>
</svg>
