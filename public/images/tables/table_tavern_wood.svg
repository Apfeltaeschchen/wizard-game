<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <!-- Feiner Holzfaser- und Porenfilter für echte rustikale Eiche -->
    <filter id="woodGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14 0.012" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.32   0 0 0 0 0.16   0 0 0 0 0.07  0 0 0 0.42 0" />
    </filter>

    <!-- Harmonische Bohlen-Farbverläufe für plastische Holzwölbung -->
    <linearGradient id="plankGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c160a" />
      <stop offset="50%" stop-color="#3d2112" />
      <stop offset="100%" stop-color="#241207" />
    </linearGradient>
    <linearGradient id="plankGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30190c" />
      <stop offset="50%" stop-color="#422415" />
      <stop offset="100%" stop-color="#281408" />
    </linearGradient>
    <linearGradient id="plankGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#341c0e" />
      <stop offset="50%" stop-color="#482717" />
      <stop offset="100%" stop-color="#2b1509" />
    </linearGradient>
    <linearGradient id="plankGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e170b" />
      <stop offset="50%" stop-color="#402313" />
      <stop offset="100%" stop-color="#261308" />
    </linearGradient>
    <linearGradient id="plankGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1509" />
      <stop offset="50%" stop-color="#391e10" />
      <stop offset="100%" stop-color="#221006" />
    </linearGradient>

    <!-- Warmes Kaminfeuerlicht, das sanft über den Tavernentisch streicht -->
    <radialGradient id="tavernFireGlow" cx="48%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#78350f" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>

    <!-- Schmiedeeisen Beschlag Verlauf -->
    <linearGradient id="ironBandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b5563" />
      <stop offset="40%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- 1. FÜNF SCHWERE EICHENBOHLEN -->
  <rect x="0" y="0" width="1600" height="198" fill="url(#plankGrad1)" />
  <rect x="0" y="200" width="1600" height="198" fill="url(#plankGrad2)" />
  <rect x="0" y="400" width="1600" height="198" fill="url(#plankGrad3)" />
  <rect x="0" y="600" width="1600" height="198" fill="url(#plankGrad4)" />
  <rect x="0" y="800" width="1600" height="200" fill="url(#plankGrad5)" />

  <!-- 2. FEINE FUGEN MIT SCHATTEN- UND LICHTKANTE -->
  <line x1="0" y1="199" x2="1600" y2="199" stroke="#0d0502" stroke-width="2.2" />
  <line x1="0" y1="201" x2="1600" y2="201" stroke="#6d3918" stroke-width="0.9" opacity="0.45" />

  <line x1="0" y1="399" x2="1600" y2="399" stroke="#0d0502" stroke-width="2.2" />
  <line x1="0" y1="401" x2="1600" y2="401" stroke="#6d3918" stroke-width="0.9" opacity="0.45" />

  <line x1="0" y1="599" x2="1600" y2="599" stroke="#0d0502" stroke-width="2.2" />
  <line x1="0" y1="601" x2="1600" y2="601" stroke="#6d3918" stroke-width="0.9" opacity="0.45" />

  <line x1="0" y1="799" x2="1600" y2="799" stroke="#0d0502" stroke-width="2.2" />
  <line x1="0" y1="801" x2="1600" y2="801" stroke="#6d3918" stroke-width="0.9" opacity="0.45" />

  <!-- 3. RUSTIKALE MASERUNGEN & ASTLÖCHER -->
  <rect width="1600" height="1000" filter="url(#woodGrain)" style="mix-blend-mode: overlay;" />

  <!-- Eingebranntes Kerbenzirkel-Wasserzeichen in der Tischmitte -->
  <g transform="translate(800, 500)" stroke="#1a0c05" stroke-width="1.8" fill="none" opacity="0.32">
    <circle r="230" stroke-dasharray="14 8" />
    <circle r="215" stroke-width="1" />
    <circle r="140" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle r="70" stroke-width="1.5" />
    <line x1="-160" y1="0" x2="160" y2="0" stroke-width="1" />
    <line x1="0" y1="-160" x2="0" y2="160" stroke-width="1" />
  </g>

  <!-- 4. GESCHMIEDETE EISENBÄNDER & VIERKANTNÄGEL -->
  <!-- Linke Eisenbeschläge -->
  <rect x="18" y="40" width="16" height="920" rx="4" fill="url(#ironBandGrad)" stroke="#111827" stroke-width="1.5" opacity="0.85" />
  <!-- Rechte Eisenbeschläge -->
  <rect x="1566" y="40" width="16" height="920" rx="4" fill="url(#ironBandGrad)" stroke="#111827" stroke-width="1.5" opacity="0.85" />

  <!-- Handgeschmiedete Nieten an den Bohlenenden -->
  <g fill="#180c05" stroke="#5a3116" stroke-width="1.5">
    <circle cx="26" cy="100" r="5" fill="#111827" /><circle cx="24.5" cy="98.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="26" cy="300" r="5" fill="#111827" /><circle cx="24.5" cy="298.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="26" cy="500" r="5" fill="#111827" /><circle cx="24.5" cy="498.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="26" cy="700" r="5" fill="#111827" /><circle cx="24.5" cy="698.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="26" cy="900" r="5" fill="#111827" /><circle cx="24.5" cy="898.5" r="1.5" fill="#9ca3af" stroke="none" />

    <circle cx="1574" cy="100" r="5" fill="#111827" /><circle cx="1572.5" cy="98.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="1574" cy="300" r="5" fill="#111827" /><circle cx="1572.5" cy="298.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="1574" cy="500" r="5" fill="#111827" /><circle cx="1572.5" cy="498.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="1574" cy="700" r="5" fill="#111827" /><circle cx="1572.5" cy="698.5" r="1.5" fill="#9ca3af" stroke="none" />
    <circle cx="1574" cy="900" r="5" fill="#111827" /><circle cx="1572.5" cy="898.5" r="1.5" fill="#9ca3af" stroke="none" />
  </g>

  <!-- 5. KAMINFEUER-LICHTFALL (WARMER GLANZ) -->
  <rect width="1600" height="1000" fill="url(#tavernFireGlow)" />
</svg>
