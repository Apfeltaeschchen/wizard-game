<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Tiefer Außen-Vignettenschatten -->
    <radialGradient id="vaultVignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e0804" stop-opacity="0" />
      <stop offset="60%" stop-color="#080503" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#020101" stop-opacity="0.98" />
    </radialGradient>

    <!-- Warmes Deckenlicht / Kronleuchter über dem Spielbereich -->
    <radialGradient id="chandelierGlow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#1e1107" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#090502" stop-opacity="0" />
    </radialGradient>

    <!-- Steinplatten-Bodenmuster im Gewölbe -->
    <pattern id="stoneFloor" width="160" height="80" patternUnits="userSpaceOnUse">
      <rect width="160" height="80" fill="#0b0704" />
      <line x1="0" y1="40" x2="160" y2="40" stroke="#040201" stroke-width="2" />
      <line x1="0" y1="80" x2="160" y2="80" stroke="#040201" stroke-width="2" />
      <line x1="80" y1="0" x2="80" y2="40" stroke="#040201" stroke-width="2" />
      <line x1="160" y1="40" x2="160" y2="80" stroke="#040201" stroke-width="2" />
    </pattern>

    <!-- Gotische Rippenbogen-Gradienten -->
    <linearGradient id="ribTopLeft" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#c89a38" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="ribTopRight" x1="100%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#c89a38" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="ribBottomLeft" x1="0%" y1="100%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#c89a38" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="ribBottomRight" x1="100%" y1="100%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#c89a38" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Dunkler Steinboden des Meistergewölbes -->
  <rect width="1920" height="1080" fill="url(#stoneFloor)" />

  <!-- MATTE, FEINE STEINGRAVUREN DES RITUALKREISES HINTER DEM TISCH (OHNE GLOW-FILTER) -->
  <g transform="translate(960, 540)">
    <!-- Äußere Zirkelkreise mit astronomischen Ringen -->
    <circle r="860" stroke="#c89a38" stroke-opacity="0.15" stroke-width="2" fill="none" />
    <circle r="830" stroke="#c89a38" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="12 6" fill="none" />
    <circle r="770" stroke="#c89a38" stroke-opacity="0.2" stroke-width="1.5" fill="none" />
    <circle r="720" stroke="#c89a38" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 8" fill="none" />
    <circle r="660" stroke="#c89a38" stroke-opacity="0.16" stroke-width="1.4" fill="none" />

    <!-- 16-teilige magische Ausrichtungsstrahlen hinter dem Tisch -->
    <g stroke="#c89a38" stroke-opacity="0.14" stroke-width="1.2" stroke-dasharray="8 6">
      <line x1="-860" y1="0" x2="860" y2="0" />
      <line x1="0" y1="-860" x2="0" y2="860" />
      <line x1="-608" y1="-608" x2="608" y2="608" />
      <line x1="-608" y1="608" x2="608" y2="-608" />
      <line x1="-794" y1="-329" x2="794" y2="329" />
      <line x1="-794" y1="329" x2="794" y2="-329" />
      <line x1="-329" y1="-794" x2="329" y2="794" />
      <line x1="-329" y1="794" x2="329" y2="-794" />
    </g>

    <!-- Futhark-Runensymbole und Alchemie-Zeichen am Rand des Ritualkreises -->
    <g font-family="'MedievalSharp', serif" font-size="26" font-weight="900" fill="#c89a38" fill-opacity="0.3" text-anchor="middle" dominant-baseline="central">
      <!-- 12 Tierkreis- / Futhark-Positionen rund um den Tisch -->
      <text transform="translate(0, -745)">ᚠ</text>
      <text transform="translate(372, -645)">ᚢ</text>
      <text transform="translate(645, -372)">ᚦ</text>
      <text transform="translate(745, 0)">ᚨ</text>
      <text transform="translate(645, 372)">ᚱ</text>
      <text transform="translate(372, 645)">ᚲ</text>
      <text transform="translate(0, 745)">ᚷ</text>
      <text transform="translate(-372, 645)">ᚹ</text>
      <text transform="translate(-645, 372)">ᚺ</text>
      <text transform="translate(-745, 0)">ᚾ</text>
      <text transform="translate(-645, -372)">ᛁ</text>
      <text transform="translate(-372, -645)">ᛃ</text>

      <!-- Sekundäre Runen & alchemistische Glyphen -->
      <text transform="translate(195, -720)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛈ</text>
      <text transform="translate(530, -530)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛉ</text>
      <text transform="translate(720, -195)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛊ</text>
      <text transform="translate(720, 195)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛏ</text>
      <text transform="translate(530, 530)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛒ</text>
      <text transform="translate(195, 720)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛖ</text>
      <text transform="translate(-195, 720)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛗ</text>
      <text transform="translate(-530, 530)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛚ</text>
      <text transform="translate(-720, 195)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛜ</text>
      <text transform="translate(-720, -195)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛞ</text>
      <text transform="translate(-530, -530)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛟ</text>
      <text transform="translate(-195, -720)" font-size="20" fill="#a67c2e" fill-opacity="0.25">ᛇ</text>
    </g>

    <!-- Alchemistische Zirkelgeometrie & Siegelkreuze -->
    <g stroke="#c89a38" stroke-opacity="0.16" fill="none" stroke-width="1.5">
      <!-- 8-zackiger Sternen-Zirkel -->
      <polygon points="0,-770 225,-225 770,0 225,225 0,770 -225,225 -770,0 -225,-225" stroke-dasharray="10 6" />
      <polygon points="0,-660 466,-466 660,0 466,466 0,660 -466,466 -660,0 -466,-466" stroke-width="1.2" />

      <!-- Eck-Knotenpunkte mit Siegeldreiecken -->
      <circle cx="0" cy="-770" r="14" fill="#180e07" stroke="#c89a38" stroke-width="1.5" />
      <circle cx="770" cy="0" r="14" fill="#180e07" stroke="#c89a38" stroke-width="1.5" />
      <circle cx="0" cy="770" r="14" fill="#180e07" stroke="#c89a38" stroke-width="1.5" />
      <circle cx="-770" cy="0" r="14" fill="#180e07" stroke="#c89a38" stroke-width="1.5" />
    </g>
  </g>

  <!-- Gotische Deckenrippen aus den vier Raumecken -->
  <g stroke-width="2.5" opacity="0.5">
    <line x1="0" y1="0" x2="960" y2="540" stroke="url(#ribTopLeft)" />
    <line x1="1920" y1="0" x2="960" y2="540" stroke="url(#ribTopRight)" />
    <line x1="0" y1="1080" x2="960" y2="540" stroke="url(#ribBottomLeft)" />
    <line x1="1920" y1="1080" x2="960" y2="540" stroke="url(#ribBottomRight)" />

    <!-- Sekundäre Gewölbegrate -->
    <line x1="480" y1="0" x2="960" y2="540" stroke="url(#ribTopLeft)" stroke-dasharray="8 6" opacity="0.3" />
    <line x1="1440" y1="0" x2="960" y2="540" stroke="url(#ribTopRight)" stroke-dasharray="8 6" opacity="0.3" />
    <line x1="0" y1="540" x2="960" y2="540" stroke="url(#ribTopLeft)" stroke-dasharray="10 8" opacity="0.25" />
    <line x1="1920" y1="540" x2="960" y2="540" stroke="url(#ribTopRight)" stroke-dasharray="10 8" opacity="0.25" />
    <line x1="480" y1="1080" x2="960" y2="540" stroke="url(#ribBottomLeft)" stroke-dasharray="8 6" opacity="0.3" />
    <line x1="1440" y1="1080" x2="960" y2="540" stroke="url(#ribBottomRight)" stroke-dasharray="8 6" opacity="0.3" />
  </g>

  <!-- Warmes Decken-Kerzenlicht auf den Raum und Tischbereich -->
  <circle cx="960" cy="540" r="760" fill="url(#chandelierGlow)" />

  <!-- Tiefschwarze Raumvignette für maximale Fokus-Tiefe -->
  <rect width="1920" height="1080" fill="url(#vaultVignette)" />

  <!-- Subtile, feine Aschepartikel im Kerzenlichtkegel -->
  <g fill="#fde047" opacity="0.3">
    <circle cx="910" cy="460" r="2" />
    <circle cx="1040" cy="410" r="1.5" />
    <circle cx="840" cy="620" r="2.2" />
    <circle cx="1110" cy="580" r="1.5" />
    <circle cx="970" cy="660" r="2" />
    <circle cx="940" cy="350" r="1.5" />
  </g>
</svg>
