<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <defs>
    <!-- Feiner Holzfaser-Filter für natürliche Poren -->
    <filter id="woodGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15 0.015" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.26   0 0 0 0 0.14   0 0 0 0 0.06  0 0 0 0.35 0" />
    </filter>

    <!-- Bohlen-Farbverläufe für natürliche, gleichmäßige Holzwölbung -->
    <linearGradient id="plankGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c160a" />
      <stop offset="50%" stop-color="#3a1f10" />
      <stop offset="100%" stop-color="#281408" />
    </linearGradient>
    <linearGradient id="plankGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e170b" />
      <stop offset="50%" stop-color="#3d2112" />
      <stop offset="100%" stop-color="#2a1509" />
    </linearGradient>
    <linearGradient id="plankGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30190c" />
      <stop offset="50%" stop-color="#3e2213" />
      <stop offset="100%" stop-color="#2b160a" />
    </linearGradient>
    <linearGradient id="plankGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e170b" />
      <stop offset="50%" stop-color="#3d2112" />
      <stop offset="100%" stop-color="#2a1509" />
    </linearGradient>
    <linearGradient id="plankGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c160a" />
      <stop offset="50%" stop-color="#3a1f10" />
      <stop offset="100%" stop-color="#281408" />
    </linearGradient>

    <!-- Warmes sanftes Deckenlicht im Tischzentrum -->
    <radialGradient id="tableCenterCandle" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- HINTERGRUND-HOLZPLANKEN (5 breite horizontale Eichenbohlen über die gesamte Fläche) -->
  <!-- Bohle 1 (0 - 200px) -->
  <rect x="0" y="0" width="1600" height="198" fill="url(#plankGrad1)" />

  <!-- Bohle 2 (200 - 400px) -->
  <rect x="0" y="200" width="1600" height="198" fill="url(#plankGrad2)" />

  <!-- Bohle 3 (400 - 600px - Zentrum) -->
  <rect x="0" y="400" width="1600" height="198" fill="url(#plankGrad3)" />

  <!-- Bohle 4 (600 - 800px) -->
  <rect x="0" y="600" width="1600" height="198" fill="url(#plankGrad4)" />

  <!-- Bohle 5 (800 - 1000px) -->
  <rect x="0" y="800" width="1600" height="200" fill="url(#plankGrad5)" />

  <!-- HORIZONTALE HOLZFASERN -->
  <rect width="1600" height="1000" filter="url(#woodGrain)" style="mix-blend-mode: overlay;" />

  <!-- FEINE BOHLENFUGEN MIT ZARTER LICHTKANTE -->
  <!-- Fuge 1 -->
  <line x1="0" y1="199" x2="1600" y2="199" stroke="#100602" stroke-width="1.8" />
  <line x1="0" y1="201" x2="1600" y2="201" stroke="#5a3116" stroke-width="0.8" opacity="0.35" />

  <!-- Fuge 2 -->
  <line x1="0" y1="399" x2="1600" y2="399" stroke="#100602" stroke-width="1.8" />
  <line x1="0" y1="401" x2="1600" y2="401" stroke="#5a3116" stroke-width="0.8" opacity="0.35" />

  <!-- Fuge 3 -->
  <line x1="0" y1="599" x2="1600" y2="599" stroke="#100602" stroke-width="1.8" />
  <line x1="0" y1="601" x2="1600" y2="601" stroke="#5a3116" stroke-width="0.8" opacity="0.35" />

  <!-- Fuge 4 -->
  <line x1="0" y1="799" x2="1600" y2="799" stroke="#100602" stroke-width="1.8" />
  <line x1="0" y1="801" x2="1600" y2="801" stroke="#5a3116" stroke-width="0.8" opacity="0.35" />

  <!-- RUSTIKALE EICHEN-HOLZNÄGEL AN DEN BOHLENENDEN -->
  <g fill="#180c05" stroke="#482510" stroke-width="1.4">
    <!-- Links (x = 55) -->
    <g transform="translate(55, 100)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(55, 300)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(55, 500)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(55, 700)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(55, 900)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>

    <!-- Mitte-Links (x = 480) -->
    <g transform="translate(480, 100)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(480, 300)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(480, 500)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(480, 700)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(480, 900)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>

    <!-- Mitte-Rechts (x = 1120) -->
    <g transform="translate(1120, 100)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1120, 300)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1120, 500)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1120, 700)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1120, 900)" opacity="0.65"><circle r="5.5" /><circle cx="-1" cy="-1" r="1.8" fill="#6d3918" opacity="0.6" stroke="none" /></g>

    <!-- Rechts (x = 1545) -->
    <g transform="translate(1545, 100)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1545, 300)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1545, 500)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1545, 700)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
    <g transform="translate(1545, 900)"><circle r="6" /><circle cx="-1.5" cy="-1.5" r="2" fill="#6d3918" opacity="0.6" stroke="none" /></g>
  </g>

  <!-- SANFTES KERZENLICHT IM ZENTRUM -->
  <rect width="1600" height="1000" fill="url(#tableCenterCandle)" />
</svg>
