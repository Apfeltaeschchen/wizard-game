<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <!-- Feine Holz- und Filztextur ohne periodische Kacheln -->
    <filter id="tableTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.02" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.22   0 0 0 0 0.12   0 0 0 0 0.05  0 0 0 0.35 0" />
    </filter>

    <!-- Warmer, eleganter Grundverlauf für edles Dark-Fantasy-Holz -->
    <linearGradient id="tableWoodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26150a" />
      <stop offset="50%" stop-color="#361e0e" />
      <stop offset="100%" stop-color="#26150a" />
    </linearGradient>

    <!-- Sanfte, subtile Raumbeleuchtung im Zentrum -->
    <radialGradient id="tableCenterGaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e29b38" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#a8591e" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Rand-Vignette: 0% bis 72% absolut transparent, erst ab 72% sanfte Abdunkelung zum Außenrand -->
    <radialGradient id="tableEdgeVignette" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050201" stop-opacity="0" />
      <stop offset="72%" stop-color="#050201" stop-opacity="0" />
      <stop offset="88%" stop-color="#050201" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050201" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Einheitliche Holzbasis -->
  <rect width="1000" height="1000" fill="url(#tableWoodGradient)" />

  <!-- Feiner Rausch- und Texturfilter -->
  <rect width="1000" height="1000" filter="url(#tableTexture)" style="mix-blend-mode: overlay;" />

  <!-- Zentriertes sanftes Licht -->
  <rect width="1000" height="1000" fill="url(#tableCenterGaze)" />

  <!-- Ausschließlich randständige Abdunkelung/Vignette -->
  <rect width="1000" height="1000" fill="url(#tableEdgeVignette)" />
</svg>
