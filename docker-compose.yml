version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grimoire-postgres
    restart: always
    environment:
      POSTGRES_USER: wizard
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: grimoire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizard -d grimoire_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
